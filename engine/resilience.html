<!DOCTYPE html>
<html lang="es" class="app-shell" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nodo No Encontrado | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="/engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&display=swap');
        
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        .tech-font { font-family: 'Space Grotesk', sans-serif; }
        
        .glass-panel { background: rgba(255,255,255,0.02); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); }
        
        .text-gradient-cyan { 
            background: linear-gradient(135deg, #13ecd6, #10b981); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            display: inline-block; 
            padding-right: 0.2em; 
        }

        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Aceleración GPU para el icono de error */
        .error-icon-box { transform: translateZ(0); box-shadow: 0 0 50px rgba(239, 68, 68, 0.05); }
    </style>
    
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-black">
    <div class="text-center space-y-12 max-w-sm w-full reveal-node">
        
        <div class="flex flex-col items-center gap-6">
            <div class="size-28 glass-panel rounded-[2.5rem] flex items-center justify-center border border-red-500/20 error-icon-box">
                <span class="material-icons-round text-red-500 text-6xl">link_off</span>
            </div>
            <div class="space-y-3">
                <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.5em] tech-font">Protocolo de Resiliencia</p>
                <h1 class="text-7xl font-black tech-font tracking-tighter italic text-gradient-cyan">404</h1>
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.3em]">Nodo no detectado en la red</p>
            </div>
        </div>

        <div class="glass-panel p-10 rounded-[3rem] space-y-6 border-white/5">
            <p class="text-[10px] text-zinc-600 uppercase tracking-[0.2em] font-black leading-relaxed">
                El nodo solicitado no responde o ha sido purgado del sistema de archivos principal.
            </p>
            
            <div class="flex flex-col gap-4 pt-4">
                <button onclick="window.location.href='/dashboard'" 
                        class="w-full py-6 bg-white text-black rounded-2xl font-black text-[10px] uppercase tracking-[0.4em] hover:bg-[#13ecd6] transition-all active:scale-95 shadow-2xl tech-font">
                    Volver al Mando
                </button>
                <button onclick="window.history.back()" 
                        class="w-full py-5 glass-panel rounded-2xl font-black text-[10px] uppercase tracking-[0.3em] text-zinc-500 hover:text-white transition-all border-white/5 tech-font">
                    Retroceder Nodo
                </button>
            </div>
        </div>

        <p class="text-[8px] font-black text-zinc-800 uppercase tracking-[0.5em] tech-font">
            SplitGasto 2026 · Resiliencia Alpha v4.4
        </p>
    </div>

    <script>
        // Asegurar visibilidad inmediata al restaurar de caché
        window.addEventListener('pageshow', () => {
            document.body.style.opacity = '1';
            document.body.style.filter = 'none';
        });
    </script>
</body>
</html>
