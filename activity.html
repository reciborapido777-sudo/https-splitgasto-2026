<!DOCTYPE html>
<html lang="es" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="activity.title">Actividad | SplitGasto 2026</title>
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
            body { background: #000; color: #fff; font-family: "Plus Jakarta Sans", sans-serif; overflow-x: hidden !important; width: 100% !important; margin: 0; padding: 0; box-sizing: border-box;  touch-action: manipulation; }
        .glass-panel { background: rgba(255,255,255,0.02); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s cubic-bezier(0.16,1,0.3,1); transform: translateZ(0); }
        .money-display { font-family: "Space Grotesk", sans-serif; letter-spacing: -0.02em; padding-right: 0.55em !important; display: inline-block; white-space: nowrap; }
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; }
        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .filter-btn { transition: all 0.3s; }
        .filter-btn.active { background: #fff; color: #000; }
        .tx-row { transition: all 0.3s cubic-bezier(0.16,1,0.3,1); cursor: pointer; }
        .tx-row:hover { background: rgba(255,255,255,0.04); transform: translateX(4px); }
        .tx-row.hidden-tx { display: none; }
    
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
        .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
        .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
        .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
        .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SplitGasto">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <script src="engine/router.js"></script>
    <script src="engine/desktop-fix.js" defer></script>
    <script src="engine/auth.js"></script>
    <script src="engine/api.js"></script>
    <script src="engine/i18n.js" defer></script>
</head>
<body class="app-shell pb-32">
<div class="app-frame">
    <div class="max-w-7xl mx-auto px-6 py-8 space-y-10">

        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/80 backdrop-blur-xl z-50">
            <div class="flex items-center gap-6">
                <button onclick="SGRouter.back()" class="size-14 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all shadow-xl">
                    <span class="material-icons-round text-zinc-500 text-2xl">arrow_back</span>
                </button>
                <div class="space-y-0.5">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em]" data-i18n="activity.auditLog">Audit Log</p>
                    <h1 class="text-2xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none" data-i18n="activity.movements">Movimientos</h1>
                </div>
            </div>
            <button onclick="SGRouter.navigate('dashboard', 'activity')" class="glass-panel px-5 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10 transition-all active:scale-95 border-white/5">
                <span class="material-icons-round text-[#13ecd6] text-sm">dashboard</span>
                <span class="text-[9px] font-black uppercase tracking-widest text-zinc-400" data-i18n="nav.dashboard">Mando</span>
            </button>
        </header>

        <!-- Resumen mensual -->
        <section class="glass-panel p-8 rounded-[3rem] border-[#a855f7]/10 reveal-node">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="space-y-1">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest" data-i18n="activity.totalExpense">Gasto Total</p>
                    <p class="text-2xl font-black money-display text-white">840,36€</p>
                    <p class="text-[9px] text-[#FF9D42] font-black uppercase">+8% vs Feb</p>
                </div>
                <div class="space-y-1" onclick="SGRouter.navigate('analytics', 'activity')" style="cursor:pointer">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest" data-i18n="activity.aiEfficiency">Eficiencia IA</p>
                    <p class="text-2xl font-black money-display text-[#13ecd6]">+12.4%</p>
                    <p class="text-[9px] text-zinc-600 font-black uppercase" data-i18n="activity.viewMetrics">Ver métricas →</p>
                </div>
                <div class="space-y-1">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest" data-i18n="activity.settled">Liquidadas</p>
                    <p class="text-2xl font-black money-display text-white">14</p>
                    <p class="text-[9px] text-[#13ecd6] font-black uppercase" data-i18n="activity.transactions">Transacciones</p>
                </div>
                <div class="space-y-1">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest" data-i18n="activity.pending">Pendientes</p>
                    <p class="text-2xl font-black money-display text-[#FF9D42]">3</p>
                    <p class="text-[9px] text-zinc-600 font-black uppercase" data-i18n="activity.requireAction">Requieren acción</p>
                </div>
            </div>
        </section>

        <!-- Filtros -->
        <nav class="flex gap-3 overflow-x-auto no-scrollbar py-1 reveal-node" style="animation-delay:0.1s" id="filter-nav">
            <button class="filter-btn active px-7 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest flex-shrink-0" onclick="filterTx('all', this)" data-i18n="activity.filterAll">Todos</button>
            <button class="filter-btn glass-panel px-7 py-3.5 rounded-2xl text-zinc-500 text-[10px] font-black uppercase tracking-widest flex-shrink-0 hover:text-white transition-colors" onclick="filterTx('income', this)" data-i18n="activity.filterIncome">A cobrar</button>
            <button class="filter-btn glass-panel px-7 py-3.5 rounded-2xl text-zinc-500 text-[10px] font-black uppercase tracking-widest flex-shrink-0 hover:text-white transition-colors" onclick="filterTx('expense', this)" data-i18n="activity.filterExpense">A pagar</button>
            <button class="filter-btn glass-panel px-7 py-3.5 rounded-2xl text-zinc-500 text-[10px] font-black uppercase tracking-widest flex-shrink-0 hover:text-white transition-colors" onclick="filterTx('pending', this)" data-i18n="activity.filterPending">Pendientes</button>
            <button class="filter-btn glass-panel px-7 py-3.5 rounded-2xl text-zinc-500 text-[10px] font-black uppercase tracking-widest flex-shrink-0 hover:text-white transition-colors" onclick="filterTx('settled', this)" data-i18n="activity.filterSettled">Liquidados</button>
        </nav>

        <main class="space-y-12" id="activity-content">
            <p class="text-xs text-zinc-600 text-center py-12" data-i18n="activity.loadingMovements">Cargando movimientos…</p>
        </main>
    </div>

 <script>
    const CAT_ICONS = {
  comida:'restaurant', transporte:'directions_car', entretenimiento:'movie',
  alojamiento:'home', compras:'shopping_bag', salud:'medical_services',
  servicios:'bolt', otro:'receipt'
};
const CAT_COLORS = {
  comida:'#13ecd6', transporte:'#a855f7', entretenimiento:'#FF9D42',
  alojamiento:'#ec4899', compras:'#3b82f6', salud:'#22c55e',
  servicios:'#f59e0b', otro:'#6b7280'
};

    // Global cache for delete confirmation
    let _allExpensesCache = [];

    async function loadActivityData() {
      if (!SGAuth || !SGAuth.isLoggedIn()) {
        SGRouter.showToast(t('activity.loginRequired', null, 'Inicia sesión primero'), 'error');
        setTimeout(() => SGRouter.navigate('auth-login'), 1500);
        return;
      }

      const container = document.getElementById('activity-content');
      container.innerHTML = `<p class="text-xs text-zinc-600 text-center py-12">${t('activity.loadingMovements', null, 'Cargando movimientos…')}</p>`;

      try {
        const groupsResult = await SGApi.getGroups();
        const groups = (groupsResult?.success && groupsResult?.groups) ? groupsResult.groups : [];

        if (groups.length === 0) {
          container.innerHTML = `<div class="text-center py-16 space-y-4">
            <p class="text-zinc-600 text-sm">${t('activity.noGroups', null, 'No hay grupos todavía')}</p>
            <button onclick="SGRouter.navigate('create-group','activity')" class="px-6 py-3 rounded-2xl text-sm font-bold" style="background:rgba(19,236,214,0.1);color:#13ecd6;border:1px solid rgba(19,236,214,0.2)">
              ${t('activity.createFirstGroup', null, '+ Crear primer grupo')}
            </button>
          </div>`;
          return;
        }

        // Cargar gastos Y miembros de TODOS los grupos en paralelo
        const expPromises = groups.map(g => SGApi.getExpenses(g.id).catch(() => null));
        const memPromises = groups.map(g => SGApi.getGroupMembers(g.id).catch(() => null));
        const [allExpResults, allMemResults] = await Promise.all([
          Promise.all(expPromises),
          Promise.all(memPromises)
        ]);

        // Construir mapa global userId → nombre para mostrar quién pagó
        const _memberNameMap = {};
        groups.forEach((g, i) => {
          const memResult = allMemResults[i];
          if (memResult?.success && memResult.members) {
            memResult.members.forEach(m => {
              if (m.id && m.name) _memberNameMap[m.id] = m.name;
            });
          }
        });

        const allExpenses = [];
        groups.forEach((g, i) => {
          const expResult = allExpResults[i];
          if (expResult?.success && expResult.expenses) {
            expResult.expenses.forEach(e => {
              allExpenses.push({ ...e, _groupName: g.name, _groupId: g.id });
            });
          }
        });
        // Exponer el mapa para uso en la función de renderizado
        window._activityMemberNames = _memberNameMap;

        _allExpensesCache = allExpenses;

        // Ordenar por fecha descendente
        allExpenses.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

        if (allExpenses.length === 0) {
          container.innerHTML = `<div class="text-center py-16 space-y-4">
            <span class="material-icons-round text-5xl text-zinc-800">receipt_long</span>
            <p class="text-zinc-600 text-sm">${t('activity.noExpensesYet', null, 'Sin gastos todavía')}</p>
            <button onclick="SGRouter.navigate('add-expense','activity')" class="px-6 py-3 rounded-2xl text-sm font-bold" style="background:rgba(19,236,214,0.1);color:#13ecd6;border:1px solid rgba(19,236,214,0.2)">
              ${t('activity.addFirstExpense', null, '+ Añadir primer gasto')}
            </button>
          </div>`;

          // Actualizar resumen con ceros reales
          updateSummary(allExpenses, SGAuth.getUserId());
          return;
        }

        // Agrupar por fecha
        const today = new Date().toISOString().split('T')[0];
        const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
        const byDate = {};
        allExpenses.forEach(exp => {
          let raw = exp.created_at || exp.date || today;
          let d;
          if (typeof raw === 'number') {
            d = new Date(raw).toISOString().split('T')[0];
          } else if (typeof raw === 'string') {
            d = raw.includes('T') ? raw.split('T')[0] : raw;
          } else {
            d = today;
          }
          if (!byDate[d]) byDate[d] = [];
          byDate[d].push(exp);
        });

        const uid = SGAuth.getUserId();
        let html = '';

        for (const [date, expenses] of Object.entries(byDate)) {
          let label;
          if (date === today) label = `${t('activity.today', null, 'Hoy')} — ${formatDate(date)}`;
          else if (date === yesterday) label = `${t('activity.yesterday', null, 'Ayer')} — ${formatDate(date)}`;
          else label = formatDate(date);

          let dayTotal = 0;
          expenses.forEach(e => {
            dayTotal += (e.paid_by === uid) ? parseFloat(e.amount) : -parseFloat(e.amount);
          });

          const daySign = dayTotal >= 0 ? '+' : '';

          html += `<div class="space-y-3">
            <div class="flex items-center gap-4 px-2 reveal-node">
              <p class="text-[9px] font-black text-zinc-700 uppercase tracking-[0.4em] flex-shrink-0">${label}</p>
              <div class="h-px flex-1 bg-white/5"></div>
              <p class="text-[9px] font-black uppercase tracking-widest flex-shrink-0" style="color:${dayTotal >= 0 ? '#13ecd6' : '#6b7280'}">${daySign}${dayTotal.toFixed(2)}€</p>
            </div>`;

          expenses.forEach(exp => {
            const isMine = exp.paid_by === uid;
            const icon = CAT_ICONS[exp.category] || 'receipt';
            const color = CAT_COLORS[exp.category] || '#6b7280';
            const txType = isMine ? 'income' : 'expense';
            const amt = parseFloat(exp.amount) || 0;
            const amountStr = isMine ? `+${amt.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}€` : `-${amt.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}€`;
            const amountColor = isMine ? '#13ecd6' : '#FF9D42';
            const time = exp.created_at ? new Date(exp.created_at).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}) : '';
            const expId = exp.id;

            html += `
            <div class="tx-row ${txType} settled glass-panel p-4 rounded-[1.5rem] flex items-center gap-3 reveal-node" id="exp-row-${expId}">
              <div class="w-11 h-11 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background:${color}10;border-color:${color}20">
                <span class="material-icons-round text-base" style="color:${color}">${icon}</span>
              </div>
              <div class="flex-1 min-w-0">
                <h4 class="text-sm font-bold truncate">${exp.description || exp.category || 'Gasto'}</h4>
                <div class="flex items-center gap-2 flex-wrap mt-0.5">
                  <span class="status-pill bg-[#13ecd6]/20 text-[#13ecd6]">${t('activity.registered', null, 'Registrado')}</span>
                  <p class="text-[9px] text-zinc-600 font-bold uppercase">${exp._groupName} · ${time}</p>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <p class="text-base font-black money-display" style="color:${amountColor}">${amountStr}</p>
                ${isMine ? `<button onclick="deleteExpense('${expId}','${exp._groupId}')" class="text-[8px] text-zinc-700 hover:text-red-400 transition-colors font-bold uppercase tracking-wider mt-0.5 flex items-center gap-0.5 ml-auto">
                  <span class="material-icons-round text-xs">delete</span>${t('common.delete', null, 'Borrar')}
                </button>` : `<p class="text-[8px] text-zinc-600 uppercase font-black mt-0.5">${(window._activityMemberNames && window._activityMemberNames[exp.paid_by]) ? t('activity.paidBy', null, 'Pagó') + " " + window._activityMemberNames[exp.paid_by] : t('activity.paidByOther', null, 'Pagó otro')}</p>`}
              </div>
            </div>`;
          });

          html += '</div>';
        }

        container.innerHTML = html;
        updateSummary(allExpenses, uid);

      } catch (e) {
        console.error('Activity load error:', e);
        container.innerHTML = `<p class="text-xs text-zinc-600 text-center py-12">${t('error.system', null, 'Error al cargar movimientos')}</p>`;
      }
    }

    function updateSummary(expenses, uid) {
      const totalGasto = expenses.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
      const pendientes = expenses.filter(e => e.paid_by !== uid).length;
      const totalCount = expenses.length;

      const summaryEl = document.querySelector('.glass-panel .grid');
      if (!summaryEl) return;
      const cells = summaryEl.querySelectorAll('.space-y-1');
      if (cells[0]) {
        const el = cells[0].querySelector('.money-display');
        if (el) el.textContent = totalGasto.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + '€';
        const sub = cells[0].querySelector('p:last-child');
        if (sub) sub.textContent = 'este período';
      }
      if (cells[2]) {
        const el = cells[2].querySelector('.money-display');
        if (el) el.textContent = totalCount;
      }
      if (cells[3]) {
        const el = cells[3].querySelector('.money-display');
        if (el) el.textContent = pendientes;
      }
    }

    function _closeModal(id) { const el = document.getElementById(id); if (el) el.remove(); }

    async function deleteExpense(expenseId, groupId) {
      const modalId = 'delete-expense-modal';
      _closeModal(modalId);
      const modal = document.createElement('div');
      modal.id = modalId;
      modal.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px)';
      modal.innerHTML = `
        <div style="background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:28px;max-width:340px;width:90%;text-align:center">
          <span class="material-icons-round" style="font-size:36px;color:#ef4444;margin-bottom:10px;display:block">delete_forever</span>
          <h3 style="font-size:15px;font-weight:800;margin-bottom:6px">${t('activity.deleteExpenseTitle', null, 'Eliminar gasto')}</h3>
          <p style="font-size:11px;color:#666;margin-bottom:20px">${t('activity.deleteExpenseConfirm', null, 'Esta acción no se puede deshacer.')}</p>
          <div style="display:flex;gap:10px">
            <button onclick="_closeModal('${modalId}')" style="flex:1;padding:11px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#999;font-weight:700;font-size:13px;cursor:pointer">${t('common.cancel', null, 'Cancelar')}</button>
            <button id="confirm-del-exp-btn" style="flex:1;padding:11px;border-radius:14px;border:none;background:#ef4444;color:#fff;font-weight:800;font-size:13px;cursor:pointer">${t('common.delete', null, 'Eliminar')}</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      modal.addEventListener('click', (e) => { if (e.target === modal) _closeModal(modalId); });
      document.getElementById('confirm-del-exp-btn').addEventListener('click', async () => {
        _closeModal(modalId);
        try {
          const res = await SGApi.deleteExpense(expenseId);
          if (res && res.success) {
            SGRouter.showToast(t('activity.deleteSuccess', null, 'Gasto eliminado ✓'), 'success');
            const row = document.getElementById(`exp-row-${expenseId}`);
            if (row) {
              row.style.opacity = '0';
              row.style.transform = 'translateX(20px)';
              row.style.transition = 'all 0.3s ease';
              setTimeout(() => { row.remove(); }, 300);
            }
            setTimeout(() => loadActivityData(), 600);
          } else {
            SGRouter.showToast(res?.error || t('activity.deleteError', null, 'Error al eliminar gasto'), 'error');
          }
        } catch(e) {
          console.error('deleteExpense error:', e);
          SGRouter.showToast(t('error.system', null, 'Error de conexión'), 'error');
        }
      });
    }

    function formatDate(dateStr) {
      if (!dateStr || dateStr === 'Invalid Date') return '—';
      const d = new Date(dateStr + 'T12:00:00');
      if (isNaN(d.getTime())) return '—';
      const months = getMonthNames(getSavedLanguage());
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function filterTx(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active');
        b.style.background = '';
        b.style.color = '';
      });
      btn.classList.add('active');
      document.querySelectorAll('.tx-row').forEach(row => {
        if (type === 'all') row.classList.remove('hidden-tx');
        else row.classList.contains(type) ? row.classList.remove('hidden-tx') : row.classList.add('hidden-tx');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadActivityData();
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        loadActivityData();
      } else {
        try {
          const flag = sessionStorage.getItem('sg_expense_added');
          if (flag) {
            sessionStorage.removeItem('sg_expense_added');
            loadActivityData();
          }
        } catch {}
      }
    });
    </script>
        
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item " onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p data-i18n="nav.dashboard">Mando</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p data-i18n="nav.groups">Grupos</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p data-i18n="nav.expenses">Gastos</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p data-i18n="nav.metrics">Métricas</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p data-i18n="nav.profile">Perfil</p>
            </button>
        </div>
    </nav>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
</div>
</body>
</html>
