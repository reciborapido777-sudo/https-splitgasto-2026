<!DOCTYPE html>
<html lang="es" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad | SplitGasto 2026</title>
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
            html, body { background: #000; color: #fff; font-family: "Plus Jakarta Sans", sans-serif; overflow-x: hidden !important; width: 100% !important; margin: 0; padding: 0; box-sizing: border-box;  touch-action: manipulation; }
        .glass-panel { background: rgba(255,255,255,0.02); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s cubic-bezier(0.16,1,0.3,1); transform: translateZ(0); }
        .money-display { font-family: "Space Grotesk", sans-serif; letter-spacing: -0.02em; padding-right: 0.55em !important; display: inline-block; white-space: nowrap; }
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; }
        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .filter-btn { transition: all 0.3s; }
        .filter-btn.active { background: #fff; color: #000; }
        .tx-row { transition: all 0.3s cubic-bezier(0.16,1,0.3,1); cursor: pointer; }
        .tx-row:hover { background: rgba(255,255,255,0.04); transform: translateX(4px); }
        .tx-row.hidden-tx { display: none; }
    
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
        .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
        .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
        .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
        .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SplitGasto">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <script src="engine/router.js"></script>
    <script src="engine/desktop-fix.js" defer></script>
    <script src="engine/auth.js"></script>
    <script src="engine/api.js"></script>

</head>
<body class="app-shell pb-32">
<div class="app-frame">
    <div class="max-w-7xl mx-auto px-6 py-8 space-y-10">

        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/80 backdrop-blur-xl z-50">
            <div class="flex items-center gap-6">
                <button onclick="SGRouter.back()" class="size-14 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all shadow-xl">
                    <span class="material-icons-round text-zinc-500 text-2xl">arrow_back</span>
                </button>
                <div class="space-y-0.5">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em]">Audit Log</p>
                    <h1 class="text-2xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Movimientos</h1>
                </div>
            </div>
            <button onclick="SGRouter.navigate('dashboard', 'activity')" class="glass-panel px-5 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10 transition-all active:scale-95 border-white/5">
                <span class="material-icons-round text-[#13ecd6] text-sm">dashboard</span>
                <span class="text-[9px] font-black uppercase tracking-widest text-zinc-400">Mando</span>
            </button>
        </header>

        <!-- Resumen mensual -->
        <section class="glass-panel p-8 rounded-[3rem] border-[#a855f7]/10 reveal-node">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="space-y-1">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest">Gasto Total</p>
                    <p class="text-2xl font-black money-display text-white">840,36€</p>
                    <p class="text-[9px] text-[#FF9D42] font-black uppercase">+8% vs Feb</p>
                </div>
                <div class="space-y-1" onclick="SGRouter.navigate('analytics', 'activity')" style="cursor:pointer">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest">Eficiencia IA</p>
                    <p class="text-2xl font-black money-display text-[#13ecd6]">+12.4%</p>
                    <p class="text-[9px] text-zinc-600 font-black uppercase">Ver métricas →</p>
                </div>
                <div class="space-y-1">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest">Liquidadas</p>
                    <p class="text-2xl font-black money-display text-white">14</p>
                    <p class="text-[9px] text-[#13ecd6] font-black uppercase">Transacciones</p>
                </div>
                <div class="space-y-1">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest">Pendientes</p>
                    <p class="text-2xl font-black money-display text-[#FF9D42]">3</p>
                    <p class="text-[9px] text-zinc-600 font-black uppercase">Requieren acción</p>
                </div>
            </div>
        </section>

        <!-- Filtros -->
        <nav class="flex gap-3 overflow-x-auto no-scrollbar py-1 reveal-node" style="animation-delay:0.1s" id="filter-nav">
            <button class="filter-btn active px-7 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest flex-shrink-0" onclick="filterTx('all', this)">Todos</button>
            <button class="filter-btn glass-panel px-7 py-3.5 rounded-2xl text-zinc-500 text-[10px] font-black uppercase tracking-widest flex-shrink-0 hover:text-white transition-colors" onclick="filterTx('income', this)">A cobrar</button>
            <button class="filter-btn glass-panel px-7 py-3.5 rounded-2xl text-zinc-500 text-[10px] font-black uppercase tracking-widest flex-shrink-0 hover:text-white transition-colors" onclick="filterTx('expense', this)">A pagar</button>
            <button class="filter-btn glass-panel px-7 py-3.5 rounded-2xl text-zinc-500 text-[10px] font-black uppercase tracking-widest flex-shrink-0 hover:text-white transition-colors" onclick="filterTx('pending', this)">Pendientes</button>
            <button class="filter-btn glass-panel px-7 py-3.5 rounded-2xl text-zinc-500 text-[10px] font-black uppercase tracking-widest flex-shrink-0 hover:text-white transition-colors" onclick="filterTx('settled', this)">Liquidados</button>
        </nav>

        <main class="space-y-12" id="activity-content">
            <p class="text-xs text-zinc-600 text-center py-12">Cargando movimientos…</p>
        </main>
    </div>

 <script>
    const CAT_ICONS = { food:'restaurant', transport:'directions_car', leisure:'movie', home:'home', travel:'flight', health:'medical_services', other:'receipt', bolt:'bolt' };
    const CAT_COLORS = { food:'#13ecd6', transport:'#a855f7', leisure:'#FF9D42', home:'#ec4899', travel:'#3b82f6', health:'#22c55e', other:'#6b7280' };

    async function loadActivityData() {
      if (!SGAuth || !SGAuth.isLoggedIn()) {
        SGRouter.showToast('Inicia sesión primero', 'error');
        setTimeout(() => SGRouter.navigate('auth-login'), 1500);
        return;
      }

      try {
        const groupsResult = await SGApi.getGroups();
        const groups = (groupsResult?.success && groupsResult?.groups) ? groupsResult.groups : [];

        if (groups.length === 0) {
          document.getElementById('activity-content').innerHTML = '<p class="text-xs text-zinc-600 text-center py-12">No hay grupos aún. Crea uno para empezar.</p>';
          return;
        }

        // Load expenses from first group (or all groups)
        const allExpenses = [];
        for (const g of groups) {
          const expResult = await SGApi.getExpenses(g.id).catch(() => null);
          if (expResult?.success && expResult.expenses) {
            expResult.expenses.forEach(e => { e._groupName = g.name; });
            allExpenses.push(...expResult.expenses);
          }
        }

        // Sort by date descending
        allExpenses.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        if (allExpenses.length === 0) {
          document.getElementById('activity-content').innerHTML = '<p class="text-xs text-zinc-600 text-center py-12">Sin movimientos todavía</p>';
          return;
        }

        // Group by date
        const today = new Date().toISOString().split('T')[0];
        const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
        const groups_by_date = {};
        allExpenses.forEach(exp => {
          const d = (exp.created_at || today).split('T')[0];
          if (!groups_by_date[d]) groups_by_date[d] = [];
          groups_by_date[d].push(exp);
        });

        const uid = SGAuth.getUserId();
        const container = document.getElementById('activity-content');
        let html = '';

        for (const [date, expenses] of Object.entries(groups_by_date)) {
          let label, dayTotal = 0;
          if (date === today) { label = `Hoy — ${formatDate(date)}`; }
          else if (date === yesterday) { label = `Ayer — ${formatDate(date)}`; }
          else { label = formatDate(date); }

          expenses.forEach(e => {
            const isMine = e.paid_by === uid;
            dayTotal += isMine ? e.amount : -e.amount;
          });

          const daySign = dayTotal >= 0 ? '+' : '';
          const dayColor = dayTotal >= 0 ? '#13ecd6' : 'text-zinc-500';

          html += `<div class="space-y-3">
            <div class="flex items-center gap-4 px-2 reveal-node">
              <p class="text-[9px] font-black text-zinc-700 uppercase tracking-[0.4em] flex-shrink-0">${label}</p>
              <div class="h-px flex-1 bg-white/5"></div>
              <p class="text-[9px] font-black uppercase tracking-widest flex-shrink-0" style="color:${dayTotal >= 0 ? '#13ecd6' : '#6b7280'}">${daySign}${dayTotal.toFixed(2)}€</p>
            </div>`;

          expenses.forEach(exp => {
            const isMine = exp.paid_by === uid;
            const icon = CAT_ICONS[exp.category] || 'receipt';
            const color = CAT_COLORS[exp.category] || '#6b7280';
            const txType = isMine ? 'income' : 'expense';
            const amount = isMine ? `+${exp.amount?.toFixed(2)}€` : `-${exp.amount?.toFixed(2)}€`;
            const amountColor = isMine ? '#13ecd6' : '#FF9D42';
            const time = exp.created_at ? new Date(exp.created_at).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}) : '';

            html += `
            <div class="tx-row ${txType} settled glass-panel p-5 rounded-[2rem] flex items-center justify-between reveal-node" onclick="SGRouter.navigate('receipt', 'activity')">
              <div class="flex items-center gap-5 min-w-0">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background:${color}10;border-color:${color}20">
                  <span class="material-icons-round" style="color:${color}">${icon}</span>
                </div>
                <div class="space-y-1 truncate">
                  <h4 class="text-sm font-bold truncate">${exp.description || exp.category}</h4>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="status-pill bg-[#13ecd6]/20 text-[#13ecd6]">Registrado</span>
                    <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-tight">${exp._groupName} • ${exp.category}</p>
                  </div>
                </div>
              </div>
              <div class="text-right flex-shrink-0 pl-4">
                <p class="text-lg font-black money-display" style="color:${amountColor}">${amount}</p>
                <p class="text-[8px] text-zinc-700 uppercase font-black">${time}</p>
              </div>
            </div>`;
          });

          html += '</div>';
        }

        container.innerHTML = html;

        // Update summary
        const totalExpense = allExpenses.reduce((sum, e) => sum + (e.amount || 0), 0);
        const myExpenses = allExpenses.filter(e => e.paid_by === uid);
        const myTotal = myExpenses.reduce((sum, e) => sum + (e.amount || 0), 0);
        const summaryEl = document.querySelector('.glass-panel .grid');
        if (summaryEl) {
          const cells = summaryEl.querySelectorAll('.space-y-1');
          if (cells[0]) cells[0].querySelector('.money-display').textContent = `${totalExpense.toFixed(2)}€`;
          if (cells[2]) cells[2].querySelector('.money-display').textContent = `${allExpenses.length}`;
        }

      } catch (e) {
        console.error('Activity load error:', e);
        document.getElementById('activity-content').innerHTML = '<p class="text-xs text-zinc-600 text-center py-12">Error al cargar movimientos</p>';
      }
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function filterTx(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active');
        b.style.background = '';
        b.style.color = '';
      });
      btn.classList.add('active');

      document.querySelectorAll('.tx-row').forEach(row => {
        if (type === 'all') {
          row.classList.remove('hidden-tx');
        } else {
          if (row.classList.contains(type)) {
            row.classList.remove('hidden-tx');
          } else {
            row.classList.add('hidden-tx');
          }
        }
      });
    }

    loadActivityData();
    </script>
        
    <!-- Bottom Navigation Bar -->
        <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item " onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>


        <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
</div>
</body>
</html>
