<!DOCTYPE html>
<html lang="es" class="app-shell" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Casino Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&display=swap');
        
        body { background:#000; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; overflow-x:hidden; }
        .tech-font { font-family: 'Space Grotesk', sans-serif; }

        .glass { background:rgba(255,255,255,0.03); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.06); border-radius:24px; }

        .game-card {
            border-radius:2.5rem; overflow:hidden; position:relative; cursor:pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border:1px solid rgba(255,255,255,0.05); transform: translateZ(0);
        }
        .game-card:active { transform:scale(0.97); }

        .card-roulette { background:linear-gradient(135deg, #0a1a1a 0%, #000 100%); }
        .card-cards { background:linear-gradient(135deg, #150a25 0%, #000 100%); }
        .card-coin { background:linear-gradient(135deg, #1a1205 0%, #000 100%); }
        .card-darts { background:linear-gradient(135deg, #051a0a 0%, #000 100%); }

        .premium-badge {
            background: linear-gradient(90deg, #D4AF37, #F9E076);
            color:#000; font-size:7px; font-weight:900; letter-spacing:0.15em;
            padding:3px 10px; border-radius:50px; text-transform:uppercase;
        }

        .play-btn {
            border-radius:50px; font-weight:900; font-size:9px; padding:12px 24px;
            transition:all 0.2s; display:inline-flex; align-items:center; gap:8px;
            text-transform: uppercase; letter-spacing: 0.1em;
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; background:none; border:none; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: #13ecd6; }

        @keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        .spin-slow { animation:spin-slow 12s linear infinite; }
        
        .orb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; opacity: 0.4; }
        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
    <script src="engine/router.js" defer></script>
</head>
<body class="app-shell pb-32 bg-black">
<div class="app-frame">

    <div class="orb w-64 h-64 -top-20 -right-20" style="background:rgba(19,236,214,0.15)"></div>
    <div class="orb w-48 h-48 bottom-40 -left-20" style="background:rgba(168,85,247,0.12)"></div>

    <header class="flex justify-between items-center px-6 py-4 sticky top-0 z-50 bg-black/80 backdrop-blur-xl border-b border-white/5">
        <button onclick="SGRouter.back()" class="size-11 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all border border-white/5">
            <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
        </button>
        <div class="text-center">
            <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.4em]">Protocolo Azar</p>
            <h1 class="text-sm font-black tech-font tracking-widest uppercase italic text-white leading-none">Casino Alpha</h1>
        </div>
        <button onclick="SGRouter.navigate('membership')" class="size-11 rounded-2xl flex items-center justify-center bg-[#D4AF37]/10 border border-[#D4AF37]/30 active:scale-90 transition-all">
            <span class="material-icons-round text-[#D4AF37] text-lg">workspace_premium</span>
        </button>
    </header>

    <main class="max-w-md mx-auto px-5 pt-6 space-y-6 relative z-10">

        <div class="glass p-5 flex justify-around reveal-node">
            <div class="text-center">
                <p class="font-black tech-font text-lg text-[#13ecd6]">2.4K</p>
                <p class="text-[7px] font-black uppercase tracking-widest opacity-40">Partidas</p>
            </div>
            <div class="w-px bg-white/5"></div>
            <div class="text-center">
                <p class="font-black tech-font text-lg text-white">847</p>
                <p class="text-[7px] font-black uppercase tracking-widest opacity-40">Nodos</p>
            </div>
            <div class="w-px bg-white/5"></div>
            <div class="text-center">
                <p class="font-black tech-font text-lg text-[#FF9D42]">18.2K</p>
                <p class="text-[7px] font-black uppercase tracking-widest opacity-40">Decidido</p>
            </div>
        </div>

        <div class="game-card card-roulette p-7 reveal-node" style="animation-delay: 0.1s" onclick="SGRouter.requirePremium('Ruleta')">
            <div class="flex items-start justify-between mb-6">
                <div>
                    <span class="premium-badge">Élite</span>
                    <h3 class="text-xl font-black tech-font mt-3 uppercase italic">Ruleta Alpha</h3>
                    <p class="text-[9px] text-zinc-500 font-bold uppercase tracking-wider mt-1">Decisión por rotación 3D</p>
                </div>
                <div class="w-16 h-16 flex items-center justify-center flex-shrink-0">
                    <svg width="64" height="64" viewBox="0 0 72 72" class="spin-slow">
                        <circle cx="36" cy="36" r="34" fill="none" stroke="rgba(19,236,214,0.2)" stroke-width="2"/>
                        <path d="M36 36 L36 2 A34 34 0 0 1 70 36 Z" fill="rgba(19,236,214,0.3)"/>
                        <path d="M36 36 L70 36 A34 34 0 0 1 36 70 Z" fill="rgba(168,85,247,0.3)"/>
                        <circle cx="36" cy="36" r="6" fill="#13ecd6"/>
                    </svg>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex gap-2">
                    <span class="text-[7px] font-black uppercase tracking-widest px-2 py-1 rounded bg-white/5 text-zinc-500">2-12 Socios</span>
                </div>
                <button class="play-btn bg-[#13ecd6] text-black">
                    <span class="material-icons-round text-sm">casino</span> Girar
                </button>
            </div>
        </div>

        <div class="game-card card-cards p-7 reveal-node" style="animation-delay: 0.2s" onclick="SGRouter.requirePremium('Cartas')">
            <div class="flex items-start justify-between mb-6">
                <div>
                    <span class="premium-badge">Élite</span>
                    <h3 class="text-xl font-black tech-font mt-3 uppercase italic">Carta Alta</h3>
                    <p class="text-[9px] text-zinc-500 font-bold uppercase tracking-wider mt-1">Quien saque la más alta, paga</p>
                </div>
                <div class="size-14 bg-[#a855f7]/20 rounded-xl flex items-center justify-center border border-[#a855f7]/30 rotate-6">
                    <span class="material-icons-round text-[#a855f7] text-3xl">style</span>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex gap-2">
                    <span class="text-[7px] font-black uppercase tracking-widest px-2 py-1 rounded bg-white/5 text-zinc-500">Baraja Pro</span>
                </div>
                <button class="play-btn bg-[#a855f7] text-white">
                    <span class="material-icons-round text-sm">layers</span> Jugar
                </button>
            </div>
        </div>

        <div class="game-card card-coin p-7 reveal-node" style="animation-delay: 0.3s" onclick="SGRouter.navigate('game-coin')">
            <div class="flex items-start justify-between mb-6">
                <div>
                    <span class="text-[7px] font-black uppercase tracking-widest px-2 py-1 rounded bg-zinc-800 text-zinc-400">Incluido</span>
                    <h3 class="text-xl font-black tech-font mt-3 uppercase italic">Cara o Cruz</h3>
                    <p class="text-[9px] text-zinc-500 font-bold uppercase tracking-wider mt-1">La decisión binaria clásica</p>
                </div>
                <div class="size-16 rounded-full bg-gradient-to-br from-[#f0c060] to-[#d4af37] flex items-center justify-center shadow-[0_0_20px_rgba(212,175,55,0.3)]">
                    <span class="material-icons-round text-black/70 text-3xl">toll</span>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex gap-2">
                    <span class="text-[7px] font-black uppercase tracking-widest px-2 py-1 rounded bg-white/5 text-zinc-500">Física 3D</span>
                </div>
                <button class="play-btn bg-[#D4AF37] text-black">
                    <span class="material-icons-round text-sm">history_edu</span> Lanzar
                </button>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item active">
                <span class="material-icons-round">casino</span>
                <p>Juegos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('vault')">
                <span class="material-icons-round">auto_stories</span>
                <p>Bóveda</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>

</div>
</body>
</html>
