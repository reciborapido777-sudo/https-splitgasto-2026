<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Mis Grupos | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Estilos específicos de Groups que no están en global.css */
        .group-card { 
            position: relative; height: 260px; border-radius: 3rem; 
            overflow: hidden; cursor: pointer; 
            transition: var(--transition-alpha);
            transform: translateZ(0);
        }
        .group-card:hover { transform: translateY(-10px) scale(1.02); }
        .group-overlay { background: linear-gradient(to top, rgba(0,0,0,1) 10%, rgba(0,0,0,0.3) 100%); }

        .summary-pill {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1.5rem;
            padding: 0.9rem 1.4rem;
        }

        .event-placeholder {
            border: 2px dashed rgba(255, 255, 255, 0.05);
            background: transparent;
        }
        
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: var(--cian-tech); }
    </style>

    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame">

    <div class="max-w-lg mx-auto px-4 py-6 space-y-6">
        
        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/80 backdrop-blur-xl z-50 -mx-4 px-4">
            <div class="flex items-center gap-4">
                <button onclick="SGRouter.back()" class="size-12 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all">
                    <span class="material-icons-round text-zinc-400 text-xl">arrow_back</span>
                </button>
                <div>
                    <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.4em]">Nodos de Activos</p>
                    <h1 class="text-xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Mis Grupos</h1>
                </div>
            </div>
            <button onclick="SGRouter.showToast('Crear grupo: próximamente disponible', 'info')" 
                    class="px-4 py-2.5 rounded-xl bg-[#13ecd6]/10 border border-[#13ecd6]/20 flex items-center gap-2 text-[#13ecd6] active:scale-95 transition-all">
                <span class="material-icons-round text-sm">add</span>
                <span class="text-[9px] font-black uppercase tracking-widest">Nuevo</span>
            </button>
        </header>

        <section class="grid grid-cols-3 gap-3 reveal-node">
            <div class="summary-pill flex flex-col gap-1">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Grupos</p>
                <p class="text-xl font-black font-['Space_Grotesk'] text-white">3</p>
            </div>
            <div class="summary-pill flex flex-col gap-1">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Balance</p>
                <p class="text-xl font-black font-['Space_Grotesk'] text-[#13ecd6]">+83,50€</p>
            </div>
            <div class="summary-pill flex flex-col gap-1">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Socios</p>
                <p class="text-xl font-black font-['Space_Grotesk'] text-white">8</p>
            </div>
        </section>

        <main class="space-y-4">
            
            <div class="group-card group reveal-node" onclick="SGRouter.navigate('split', 'groups')">
                <img src="https://images.unsplash.com/photo-1579027989536-b7b1f875659b?q=80&w=800" 
                     class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:scale-105 transition-all duration-700" alt="Sushi">
                <div class="absolute inset-0 group-overlay flex flex-col justify-end p-8 space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="status-tag bg-[#13ecd6]/10 text-[#13ecd6] border border-[#13ecd6]/20">Activo</span>
                        <div class="flex -space-x-2">
                            <img src="https://api.dicebear.com/9.x/initials/svg?seed=Mario&backgroundColor=0d1f0d" class="size-7 rounded-full border-2 border-black" alt="">
                            <img src="https://api.dicebear.com/9.x/initials/svg?seed=Elena&backgroundColor=1a0d1f" class="size-7 rounded-full border-2 border-black" alt="">
                            <div class="size-7 rounded-full border-2 border-black bg-zinc-800 flex items-center justify-center">
                                <span class="text-[7px] font-black text-zinc-400">+2</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-2xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Sushi Kyoto Pro</h3>
                        <p class="text-xs text-zinc-400 font-bold uppercase tracking-widest mt-1">Balance: <span class="text-[#13ecd6] money-display">+125,50€</span></p>
                    </div>
                </div>
            </div>

            <div class="group-card group reveal-node" style="animation-delay: 0.1s" onclick="SGRouter.navigate('split', 'groups')">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=800" 
                     class="absolute inset-0 w-full h-full object-cover opacity-50 group-hover:scale-105 transition-all duration-700" alt="Pirineos">
                <div class="absolute inset-0 group-overlay flex flex-col justify-end p-8 space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="status-tag bg-[#a855f7]/10 text-[#a855f7] border border-[#a855f7]/20">Auditando IA</span>
                    </div>
                    <div>
                        <h3 class="text-2xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Viaje Pirineos</h3>
                        <p class="text-xs text-zinc-400 font-bold uppercase tracking-widest mt-1">Balance: <span class="text-white money-display">-42,00€</span></p>
                    </div>
                </div>
            </div>

            <div class="group-card event-placeholder group reveal-node flex flex-col items-center justify-center gap-4 active:scale-95 transition-all" 
                 style="animation-delay: 0.2s" onclick="SGRouter.showToast('Protocolo de Creación · Próximamente', 'info')">
                <div class="size-14 rounded-full glass-panel flex items-center justify-center group-hover:border-[#a855f7]/50 transition-all">
                    <span class="material-icons-round text-zinc-700 group-hover:text-[#a855f7] text-2xl">add</span>
                </div>
                <div class="text-center">
                    <h4 class="text-[9px] font-black uppercase tracking-[0.4em] text-zinc-600 group-hover:text-zinc-400">Nuevo Grupo</h4>
                </div>
            </div>
        </main>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>

</div>
</body>
</html>
