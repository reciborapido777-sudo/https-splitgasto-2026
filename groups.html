<!DOCTYPE html>
<html lang="es" style="background-color: #000 !important; overflow-x: hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Grupos | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
       
        html, body {  
            background: #000; color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden !important; width: 100% !important; margin: 0; padding: 0;
            box-sizing: border-box;
            /* overscroll-behavior:none removed — it blocks one-finger scroll
               on some Android WebViews. Use 'contain' (allows scroll,
               prevents pull-to-refresh/navigation on bounce) instead. */
            overscroll-behavior: contain; touch-action: manipulation; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0);
        }

        .group-card { 
            position: relative; height: 260px; border-radius: 3rem; 
            overflow: hidden; border: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0);
        }
        .group-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8);
        }
        .group-overlay { background: linear-gradient(to top, rgba(0,0,0,1) 10%, rgba(0,0,0,0.3) 100%); }

        .money-display { 
            padding-right: 0.55em !important; 
            white-space: nowrap; 
            font-family: 'Space Grotesk', sans-serif;
            display: inline-block;
        }

        .summary-pill {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1.5rem;
            padding: 0.9rem 1.4rem;
        }

        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .event-placeholder {
            border: 2px dashed rgba(255, 255, 255, 0.05);
            background: transparent;
        }
        .event-placeholder:hover {
            border-color: rgba(168, 85, 247, 0.3);
            background: rgba(168, 85, 247, 0.02);
            transform: translateY(-6px);
        }
    
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
        .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
        .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
        .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
        .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
</style>
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <script src="engine/desktop-fix.js" defer></script>

</head>
<body class="app-shell pb-28">
<div class="app-frame">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-10">
        
        <!-- Header -->
        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/80 backdrop-blur-xl z-50">
            <div class="flex items-center gap-5">
                <button onclick="SGRouter.back()" class="size-14 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all shadow-xl">
                    <span class="material-icons-round text-zinc-400 text-2xl">arrow_back</span>
                </button>
                <div class="space-y-0.5">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em]">Nodos de Activos</p>
                    <h1 class="text-2xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Mis Grupos</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="SGRouter.navigate('create-group','groups')" 
                        class="px-5 py-3 rounded-2xl bg-[#13ecd6]/10 border border-[#13ecd6]/20 flex items-center gap-2 hover:bg-[#13ecd6]/15 transition-all active:scale-95">
                    <span class="material-icons-round text-[#13ecd6] text-sm">add</span>
                    <span class="text-[9px] font-black uppercase tracking-widest text-[#13ecd6] hidden sm:inline">Nuevo</span>
                </button>
            </div>
        </header>

        <!-- Resumen rápido -->
        <section class="grid grid-cols-3 gap-3 sm:gap-5 reveal-node">
            <div class="summary-pill flex flex-col gap-1">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Grupos Activos</p>
                <p class="text-2xl font-black font-['Space_Grotesk'] text-white" id="summary-groups">0</p>
            </div>
            <div class="summary-pill flex flex-col gap-1">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Balance Neto</p>
                <p class="text-2xl font-black font-['Space_Grotesk'] text-[#13ecd6]" id="summary-balance">0,00€</p>
            </div>
            <div class="summary-pill flex flex-col gap-1">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Socios</p>
                <p class="text-2xl font-black font-['Space_Grotesk'] text-white" id="summary-members">0</p>
            </div>
        </section>

        <!-- Grid de grupos -->
        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8" id="groups-grid">

            <!-- Crear grupo CTA -->
            <div class="group-card event-placeholder group reveal-node flex flex-col items-center justify-center gap-5 transition-all" 
                 onclick="SGRouter.navigate('create-group','groups')">
                <div class="size-16 rounded-full glass-panel flex items-center justify-center group-hover:border-[#a855f7]/50 transition-all">
                    <span class="material-icons-round text-zinc-700 group-hover:text-[#a855f7] text-3xl transition-colors">add</span>
                </div>
                <div class="text-center">
                    <h4 class="text-[10px] font-black uppercase tracking-[0.5em] text-zinc-600 group-hover:text-zinc-400 transition-colors">Nuevo Grupo</h4>
                    <p class="text-[8px] font-bold uppercase text-zinc-800 tracking-widest mt-1">Añadir Nodo</p>
                </div>
            </div>

        </main>

        <!-- Actividad reciente del grupo -->
        <section class="glass-panel p-6 sm:p-10 rounded-[3rem] space-y-6 reveal-node" style="animation-delay: 0.35s">
            <div class="flex items-center justify-between">
                <div class="space-y-0.5">
                    <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.5em]">Últimos Movimientos</p>
                    <h3 class="text-lg font-black font-['Space_Grotesk'] uppercase italic">Actividad Reciente</h3>
                </div>
                <button onclick="SGRouter.navigate('activity', 'groups')" class="text-[9px] font-black text-[#13ecd6] uppercase tracking-widest hover:underline">Ver todo</button>
            </div>
            <div class="space-y-1" id="groups-activity">
                <p class="text-xs text-zinc-600 text-center py-6">Cargando actividad…</p>
            </div>
        </section>

            </div>

    <!-- Bottom Navigation Bar -->
        <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item " onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>

<script>
const GROUP_BGS = [
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FF6B35'/><stop offset='1' stop-color='%23C0392B'/></linearGradient><radialGradient id='b' cx='75%25' cy='25%25' r='55%25'><stop offset='0' stop-color='%23FF9D42' stop-opacity='.3'/><stop offset='1' stop-color='%230d0500' stop-opacity='0'/></radialGradient></defs><rect width='800' height='400' fill='%230d0500'/><rect width='800' height='400' fill='url(%23b)'/><ellipse cx='600' cy='110' rx='200' ry='200' fill='url(%23a)' opacity='.15'/><polygon points='0,400 250,200 420,280 620,160 800,240 800,400' fill='%231a0800'/><circle cx='600' cy='115' r='50' fill='%23FF6B35' opacity='.28'/><circle cx='600' cy='115' r='25' fill='%23FF9D42' opacity='.35'/></svg>`,
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400'><defs><linearGradient id='a' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%2313ecd6' stop-opacity='.35'/><stop offset='1' stop-color='%230a3a5a' stop-opacity='.8'/></linearGradient></defs><rect width='800' height='400' fill='%23020c18'/><polygon points='0,400 100,200 250,290 400,130 560,250 700,110 800,190 800,400' fill='url(%23a)'/><polygon points='400,130 560,250 300,280' fill='%23ffffff' opacity='.07'/><circle cx='680' cy='85' r='45' fill='%23ffffff' opacity='.07'/><ellipse cx='400' cy='65' rx='220' ry='28' fill='%2313ecd6' opacity='.05'/><circle cx='100' cy='320' r='80' fill='%230a3a5a' opacity='.4'/></svg>`,
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23a855f7' stop-opacity='.45'/><stop offset='1' stop-color='%234c1d95' stop-opacity='.65'/></linearGradient><radialGradient id='b' cx='30%25' cy='70%25' r='60%25'><stop offset='0' stop-color='%23a855f7' stop-opacity='.15'/><stop offset='1' stop-color='transparent'/></radialGradient></defs><rect width='800' height='400' fill='%230a0012'/><rect width='800' height='400' fill='url(%23b)'/><rect x='80' y='80' width='200' height='280' fill='url(%23a)' rx='4'/><rect x='300' y='120' width='160' height='240' fill='url(%23a)' rx='4' opacity='.7'/><rect x='485' y='100' width='190' height='260' fill='url(%23a)' rx='4' opacity='.55'/><rect x='700' y='140' width='60' height='220' fill='url(%23a)' rx='4' opacity='.4'/><rect x='100' y='210' width='28' height='36' fill='%23a855f7' opacity='.6' rx='2'/><rect x='145' y='210' width='28' height='36' fill='%23a855f7' opacity='.6' rx='2'/><rect x='190' y='210' width='28' height='36' fill='%23a855f7' opacity='.6' rx='2'/></svg>`,
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322c55e' stop-opacity='.35'/><stop offset='1' stop-color='%23059669' stop-opacity='.2'/></linearGradient><radialGradient id='b' cx='70%25' cy='25%25' r='55%25'><stop offset='0' stop-color='%2313ecd6' stop-opacity='.22'/><stop offset='1' stop-color='transparent'/></radialGradient></defs><rect width='800' height='400' fill='%23010f0d'/><rect width='800' height='400' fill='url(%23b)'/><rect x='50' y='50' width='210' height='130' rx='16' fill='url(%23a)'/><rect x='280' y='50' width='210' height='130' rx='16' fill='url(%23a)' opacity='.7'/><rect x='510' y='50' width='240' height='130' rx='16' fill='url(%23a)' opacity='.55'/><rect x='50' y='200' width='700' height='160' rx='16' fill='url(%23a)' opacity='.4'/><circle cx='680' cy='280' r='55' fill='%2313ecd6' opacity='.08'/></svg>`,
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f59e0b' stop-opacity='.4'/><stop offset='1' stop-color='%2392400e' stop-opacity='.5'/></linearGradient><radialGradient id='b' cx='50%25' cy='30%25' r='50%25'><stop offset='0' stop-color='%23f59e0b' stop-opacity='.2'/><stop offset='1' stop-color='transparent'/></radialGradient></defs><rect width='800' height='400' fill='%230a0700'/><rect width='800' height='400' fill='url(%23b)'/><circle cx='200' cy='150' r='80' fill='url(%23a)' opacity='.3'/><circle cx='500' cy='100' r='60' fill='url(%23a)' opacity='.25'/><circle cx='650' cy='250' r='90' fill='url(%23a)' opacity='.2'/><circle cx='350' cy='300' r='50' fill='%23f59e0b' opacity='.1'/></svg>`,
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%233b82f6' stop-opacity='.35'/><stop offset='1' stop-color='%231e3a5f' stop-opacity='.6'/></linearGradient><radialGradient id='b' cx='40%25' cy='60%25' r='55%25'><stop offset='0' stop-color='%233b82f6' stop-opacity='.15'/><stop offset='1' stop-color='transparent'/></radialGradient></defs><rect width='800' height='400' fill='%23050a18'/><rect width='800' height='400' fill='url(%23b)'/><rect x='100' y='80' width='250' height='180' rx='20' fill='url(%23a)' opacity='.5'/><rect x='400' y='120' width='280' height='200' rx='20' fill='url(%23a)' opacity='.35'/><circle cx='650' cy='100' r='70' fill='%233b82f6' opacity='.1'/></svg>`
];
const GROUP_ACCENTS = ['#FF9D42', '#13ecd6', '#a855f7', '#22c55e', '#f59e0b', '#3b82f6'];
const CAT_ICONS = { food:'restaurant', transport:'directions_car', leisure:'movie', home:'home', travel:'flight', health:'medical_services', other:'receipt' };
const CAT_COLORS = { food:'#13ecd6', transport:'#a855f7', leisure:'#FF9D42', home:'#ec4899', travel:'#3b82f6', health:'#22c55e', other:'#6b7280' };

async function loadGroups() {
  if (!SGAuth || !SGAuth.isLoggedIn()) return;
  try {
    const result = await SGApi.getGroups();
    if (!result || !result.success || !result.groups) return;
    const groups = result.groups;
    const grid = document.getElementById('groups-grid');
    const ctaCard = grid.querySelector('.event-placeholder');
    document.getElementById('summary-groups').textContent = groups.length;
    let totalBalance = 0, totalMembers = 0;
    for (let i = 0; i < groups.length; i++) {
      const g = groups[i];
      const balRes = await SGApi.getBalances(g.id).catch(() => null);
      const uid = SGAuth.getUserId();
      const myBal = (balRes?.success && balRes?.balances) ? (balRes.balances[uid] || 0) : 0;
      totalBalance += myBal;
      const mc = g.members ? g.members.length : 1;
      totalMembers += mc;
      const accent = GROUP_ACCENTS[i % GROUP_ACCENTS.length];
      const bg = GROUP_BGS[i % GROUP_BGS.length];
      const bSign = myBal >= 0 ? '+' : '';
      const bColor = myBal >= 0 ? '#13ecd6' : '#ef4444';
      const card = document.createElement('div');
      card.className = 'group-card group reveal-node';
      card.style.animationDelay = `${i * 0.1}s`;
      card.onclick = () => window.location.href = `split.html?groupId=${g.id}`;
      card.innerHTML = `
          <img src="data:image/svg+xml,${bg}" class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-75 group-hover:scale-110 transition-transform duration-1000" alt="">
          <div class="absolute inset-0 group-overlay flex flex-col justify-end p-8 space-y-4">
          <div class="flex justify-between items-center">
            <span class="px-3 py-1 text-[8px] font-black uppercase rounded-full border tracking-widest" style="background:${accent}15;color:${accent};border-color:${accent}25">Activo</span>
            <p class="text-[8px] text-zinc-600 uppercase">${mc} socio${mc!==1?'s':''}</p>
          </div>
          <div class="space-y-0.5">
            <h3 class="text-2xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">${g.name}</h3>
            <p class="text-xs text-zinc-400 font-bold uppercase tracking-widest">Balance: <span class="money-display" style="color:${bColor}">${bSign}${myBal.toFixed(2)}€</span></p>
          </div>
        </div>`;
      grid.insertBefore(card, ctaCard);
    }
    const tSign = totalBalance >= 0 ? '+' : '';
    const tColor = totalBalance >= 0 ? '#13ecd6' : '#ef4444';
    const balEl = document.getElementById('summary-balance');
    balEl.textContent = `${tSign}${totalBalance.toFixed(2)}€`;
    balEl.style.color = tColor;
    document.getElementById('summary-members').textContent = totalMembers;
    if (groups.length > 0) {
      const expRes = await SGApi.getExpenses(groups[0].id).catch(() => null);
      const actEl = document.getElementById('groups-activity');
      if (expRes?.success && expRes.expenses?.length > 0) {
        const recent = expRes.expenses.slice(0, 3);
        actEl.innerHTML = recent.map((exp, idx) => {
          const icon = CAT_ICONS[exp.category] || 'receipt';
          const color = CAT_COLORS[exp.category] || '#6b7280';
          const s = exp.amount >= 0 ? '+' : '';
          const ac = exp.amount >= 0 ? '#13ecd6' : '#ef4444';
          return `<div class="flex justify-between items-center py-3.5 ${idx<recent.length-1?'border-b border-white/5':''}">
            <div class="flex items-center gap-4">
              <div class="size-9 rounded-xl border flex items-center justify-center" style="background:${color}10;border-color:${color}15">
                <span class="material-icons-round text-sm" style="color:${color}">${icon}</span>
              </div>
              <div>
                <p class="text-xs font-black uppercase">${exp.description||exp.category}</p>
                <p class="text-[8px] text-zinc-600 uppercase tracking-widest">${groups[0].name}</p>
              </div>
            </div>
            <p class="text-base font-black font-['Space_Grotesk'] money-display" style="color:${ac}">${s}${exp.amount?.toFixed(2)}€</p>
          </div>`;
        }).join('');
      } else {
        actEl.innerHTML = '<p class="text-xs text-zinc-600 text-center py-6">Sin actividad reciente</p>';
      }
    }
  } catch (e) { console.error('Groups load error:', e); }
}
loadGroups();
</script>

        <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
</div>
</body>
