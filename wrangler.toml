name = "https-splitgasto-2026"
main = "_worker.js"               # ← modo DINÁMICO (no solo estático)
compatibility_date = "2026-04-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[ai]
binding = "AI"                    # ← Cloudflare Workers AI habilitado

[vars]
APP_NAME    = "SplitGasto 2026"
APP_VERSION = "3.0"
APP_ENV     = "production"
