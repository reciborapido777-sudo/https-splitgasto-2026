# SplitGasto 2026 — Cloudflare Workers Dinámico con IA
# Worker: https-splitgasto-2026
# URL: https://https-splitgasto-2026.reciborapido777.workers.dev

name = "https-splitgasto-2026"
main = "_worker.js"
compatibility_date = "2026-04-14"
compatibility_flags = ["nodejs_compat"]

# ── Assets estáticos ─────────────────────────────────────────────────
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "none"

# ── Cloudflare Workers AI ─────────────────────────────────────────────
[ai]
binding = "AI"

# ── R2 Bucket ─────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "SPLITGASTO_BUCKET"
bucket_name = "splitgasto-storage"

# ── Rate Limiting ──────────────────────────────────────────────────────
[[ratelimits]]
name = "SPLITGASTO_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 100
period = 60

# ── D1 Database ───────────────────────────────────────────────────────
[[d1_databases]]
binding = "SPLITGASTO_DB"
database_name = "splitgasto-db"
database_id = "0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d"

# ── KV Namespace ──────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SPLITGASTO_CACHE"
id = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

# ── Variables de entorno ──────────────────────────────────────────────
[vars]
APP_NAME    = "SplitGasto 2026"
APP_VERSION = "3.0"
APP_ENV     = "production"
AI_GATEWAY  = "splitgasto-ai"

# ── Observabilidad ─────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
