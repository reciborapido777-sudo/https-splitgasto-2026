# SplitGasto 2026 — Cloudflare Workers Dinámico con IA
# Worker: https-splitgasto-2026
# URL: https://https-splitgasto-2026.reciborapido777.workers.dev

name = "https-splitgasto-2026"
main = "_worker.js"
compatibility_date = "2026-04-14"
compatibility_flags = ["nodejs_compat"]

# ── Assets estáticos ─────────────────────────────────────────────────
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "none"

# ── Cloudflare Workers AI ─────────────────────────────────────────────
[ai]
binding = "AI"

# ── R2 Bucket ─────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "SPLITGASTO_BUCKET"
bucket_name = "splitgasto-storage"

# ── KV Cache ───────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SPLITGASTO_CACHE"
id = "2fff1325c50247a68880274994732d79"

# ── Rate Limiting ──────────────────────────────────────────────────────
[[ratelimits]]
name = "SPLITGASTO_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 100
period = 60

# ── D1 Database ────────────────────────────────────────────────────────
[[d1_databases]]
binding = "SPLITGASTO_DB"
database_name = "splitgasto-db"
database_id = "ac0401b5-1e3a-4c02-8c36-01025169eb1a"


# ── AI Gateway ─────────────────────────────────────────────────────────
[vars]
APP_NAME    = "SplitGasto 2026"
APP_VERSION = "4.1"
APP_ENV     = "production"

# ── Observabilidad ─────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
