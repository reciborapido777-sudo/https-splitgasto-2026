# SplitGasto 2026 — Cloudflare Workers Dinámico con IA
# Worker: https-splitgasto-2026

name = "https-splitgasto-2026"
main = "_worker.js"
compatibility_date = "2026-06-07"
compatibility_flags = ["nodejs_compat"]

# ── Assets estáticos ─────────────────────────────────────────────────
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "none"

# ── Cloudflare Workers AI ─────────────────────────────────────────────
[ai]
binding = "AI"
gateway = "splitgasto-ai"

# ── R2 Bucket ─────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "SPLITGASTO_BUCKET"
bucket_name = "splitgasto-storage"

# ── KV Cache ───────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SPLITGASTO_CACHE"
id = "2fff1325c50247a68880274994732d79"

# ── Rate Limiting ──────────────────────────────────────────────────────
[[ratelimits]]
name = "SPLITGASTO_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 100
period = 60

# ── D1 Database ────────────────────────────────────────────────────────
[[d1_databases]]
binding = "SPLITGASTO_DB"
database_name = "splitgasto-db"
database_id = "ac0401b5-1e3a-4c02-8c36-01025169eb1a"

# ── Variables de entorno ───────────────────────────────────────────────
[vars]
APP_NAME    = "SplitGasto 2026"
APP_VERSION = "4.31"
APP_ENV     = "production"
AI_GATEWAY  = "splitgasto-ai"
STRIPE_PRICE_ID = "price_1TkXVc9V7TZ4NU3DR9twDWzM"
STRIPE_PRICE_ID_MONTHLY = "price_1TjvZo9V7TZ4NU3DigZuGdfF"
GOOGLE_PLAY_PACKAGE_NAME = "com.splitgasto.nuevo"

# ── Observabilidad ────────────────────────────────────────────────────
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# ── Cron Trigger (renovar token Google Play) ──────────────────────────
[triggers]
crons = ["*/30 * * * *"]

# Email Routing — auto-respuesta de soporte
[[send_email]]
name = "EMAIL"




