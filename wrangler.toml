# SplitGasto 2026 — Cloudflare Workers Dinámico con IA
# Worker: https-splitgasto-2026
# URL: https://https-splitgasto-2026.reciborapido777.workers.dev

name = "https-splitgasto-2026"
main = "_worker.js"
compatibility_date = "2026-04-14"
compatibility_flags = ["nodejs_compat"]

# ── Assets estáticos ─────────────────────────────────────────────────
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "none"

# ── Cloudflare Workers AI ─────────────────────────────────────────────
[ai]
binding = "AI"

# ── R2 Bucket ─────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "SPLITGASTO_BUCKET"
bucket_name = "splitgasto-storage"

# ── Rate Limiting ──────────────────────────────────────────────────────
[[ratelimits]]
name = "SPLITGASTO_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 100
  period = 60

# ── Variables de entorno ──────────────────────────────────────────────
[vars]
APP_NAME    = "SplitGasto 2026"
APP_VERSION = "3.1"
APP_ENV     = "production"

# ── Observabilidad ─────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
