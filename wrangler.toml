# SplitGasto 2026 — Cloudflare Workers Dinámico con IA
# Worker: https-splitgasto-2026
# URL: https://https-splitgasto-2026.reciborapido777.workers.dev

name = "https-splitgasto-2026"
main = "_worker.js"
compatibility_date = "2026-04-14"
compatibility_flags = ["nodejs_compat"]

# ── Assets estáticos ─────────────────────────────────────────────────
# assets.directory apunta a "./dist" donde Vue genera los archivos
# compilados después de npm run build.
# binding = "ASSETS" permite que env.ASSETS.fetch() funcione en el Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# ── Cloudflare Workers AI ─────────────────────────────────────────────
[ai]
binding = "AI"

# ── Variables de entorno ──────────────────────────────────────────────
[vars]
APP_NAME    = "SplitGasto 2026"
APP_VERSION = "3.0"
APP_ENV     = "production"

# ── Observabilidad ─────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
