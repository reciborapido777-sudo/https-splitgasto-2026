<style>
  :root { --cyan:#13ecd6; --purple:#a855f7; --orange:#FF9D42; --gold:#d4af37; }
  * { font-family:'Manrope',sans-serif; box-sizing:border-box; }
  body { background:#050505; min-height:100dvh; overflow-x:hidden; touch-action: pan-y; /* FIX Android scroll */ }

  .glass { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); border-radius:24px; }

  /* ═══════════════════════════════════════════
     3-D COIN  (Canvas-based realistic spin)
     ═══════════════════════════════════════════ */
  #coin-area {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:24px 0 12px;
  }

  /* Wraps canvas + shadow */
  #coin-wrap {
    position:relative;
    width:220px;
    cursor:pointer;
    user-select:none;
    /* pan-y: lets browser recognise vertical swipes as scroll gestures
       even though the canvas intercepts touch events */
    touch-action: pan-y;
  }
  #coin-canvas {
    display:block;
    border-radius:50%;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,0.8));
    transition:filter 0.3s;
    /* Canvas must NOT steal vertical touch events from the scroll container */
    touch-action: pan-y;
  }
  #coin-canvas.result-heads {
    filter:drop-shadow(0 0 28px rgba(19,236,214,0.85)) drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  }
  #coin-canvas.result-tails {
    filter:drop-shadow(0 0 28px rgba(212,175,55,0.85)) drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  }
  /* Table shadow beneath coin */
  #coin-shadow {
    width:80%;
    height:20px;
    margin:4px auto 0;
    background:radial-gradient(ellipse, rgba(0,0,0,0.7) 0%, transparent 70%);
    border-radius:50%;
    filter:blur(8px);
    transform-origin:center;
    transition:transform 0.3s, opacity 0.3s;
  }
  #coin-shadow.flying {
    transform:scaleX(0.3) scaleY(0.5);
    opacity:0.25;
  }

  /* Result card */
  #result-card { transition:all 0.4s; border-radius:24px; }
  #result-card.heads-win {
    background:linear-gradient(135deg, rgba(19,236,214,0.14), rgba(19,236,214,0.04));
    border:1px solid rgba(19,236,214,0.4);
    box-shadow:0 0 40px rgba(19,236,214,0.18);
  }
  #result-card.tails-win {
    background:linear-gradient(135deg, rgba(212,175,55,0.14), rgba(212,175,55,0.04));
    border:1px solid rgba(212,175,55,0.4);
    box-shadow:0 0 40px rgba(212,175,55,0.18);
  }

  /* Choice buttons */
  .choice-btn {
    border-radius:16px; font-weight:800; font-size:0.92rem;
    transition:all 0.2s; border:2px solid transparent;
    position:relative; overflow:hidden;
  }
  .choice-btn.idle        { background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.12); }
  .choice-btn.selected-heads { background:rgba(19,236,214,0.15); border-color:var(--cyan); color:var(--cyan); }
  .choice-btn.selected-tails { background:rgba(212,175,55,0.15); border-color:var(--gold); color:var(--gold); }

  /* Flip button */
  #flip-btn {
    background:linear-gradient(135deg, var(--cyan), #0fbfaf);
    color:#050505; border-radius:50px;
    font-weight:800; font-size:1.1rem;
    box-shadow:0 8px 32px rgba(19,236,214,0.4); transition:all 0.2s;
  }
  #flip-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 40px rgba(19,236,214,0.6); }
  #flip-btn:disabled { opacity:0.5; cursor:not-allowed; }

  .bottom-nav { background:rgba(5,5,5,0.95); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.06); }

  .confetti-piece { position:fixed; border-radius:2px; animation:confetti-fall linear forwards; z-index:100; pointer-events:none; }
  @keyframes confetti-fall { from{transform:translateY(-20px) rotate(0deg);opacity:1} to{transform:translateY(110vh) rotate(720deg);opacity:0} }

  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
  .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
  .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
  .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
  .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
</style>

<body class="app-shell text-white pb-32">
<div class="app-frame">

<!-- Header -->
<header class="flex justify-between items-center px-5 py-4 sticky top-0 z-50"
  style="background:rgba(5,5,5,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05)">
  <button onclick="SGRouter.back()" class="flex items-center justify-center w-10 h-10 rounded-full" style="background:rgba(255,255,255,0.07)">
    <span class="material-icons-round" style="color:var(--cyan)">arrow_back_ios_new</span>
  </button>
  <div class="text-center">
    <h1 class="font-bold text-base">Cara o Cruz</h1>
    <p class="text-xs opacity-50">El Clásico de SplitGasto</p>
  </div>
  <div class="w-10 h-10 flex items-center justify-center rounded-full" style="background:rgba(255,255,255,0.07)">
    <span class="text-xs font-bold opacity-40" id="flip-count-hdr">×0</span>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-6 space-y-5">

  <!-- Stats row -->
  <div class="grid grid-cols-3 gap-3">
    <div class="glass p-3 text-center">
      <p class="text-lg font-bold" style="color:var(--cyan)" id="heads-count">0</p>
      <p class="text-xs opacity-40">Cara</p>
    </div>
    <div class="glass p-3 text-center">
      <p class="text-lg font-bold text-white" id="total-flips">0</p>
      <p class="text-xs opacity-40">Total</p>
    </div>
    <div class="glass p-3 text-center">
      <p class="text-lg font-bold" style="color:var(--gold)" id="tails-count">0</p>
      <p class="text-xs opacity-40">Cruz</p>
    </div>
  </div>

  <!-- Group selector — dinámico, carga grupos reales -->
  <div class="glass p-4">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center text-lg flex-shrink-0" style="background:rgba(19,236,214,0.15)">🪙</div>
      <div class="flex-1 min-w-0">
        <p class="text-[9px] font-black uppercase tracking-widest opacity-40 mb-1">Grupo</p>
        <select id="group-select-coin" class="w-full text-white font-bold text-sm outline-none cursor-pointer"
          style="border:none;background:transparent" onchange="onCoinGroupChange(this.value)">
          <option value="">Cargando grupos…</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Who chooses -->
  <div class="glass p-4">
    <p class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">¿Quién elige?</p>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <input type="text" id="player1-input" maxlength="16" placeholder="Jugador 1"
          class="text-xs font-bold opacity-70 bg-transparent border-b border-white/10 outline-none w-full mb-2 pb-0.5"
          oninput="updatePlayerName(1,this.value)" value="Jugador 1"/>
        <div class="flex gap-2">
          <button class="choice-btn flex-1 py-2 px-3 text-sm idle" id="p1-heads" onclick="selectChoice('p1','heads')">👆 Cara</button>
          <button class="choice-btn flex-1 py-2 px-3 text-sm idle" id="p1-tails" onclick="selectChoice('p1','tails')">✋ Cruz</button>
        </div>
      </div>
      <div>
        <input type="text" id="player2-input" maxlength="16" placeholder="Jugador 2"
          class="text-xs font-bold opacity-70 bg-transparent border-b border-white/10 outline-none w-full mb-2 pb-0.5"
          oninput="updatePlayerName(2,this.value)" value="Jugador 2"/>
        <div class="flex gap-2">
          <button class="choice-btn flex-1 py-2 px-3 text-sm idle" id="p2-heads" onclick="selectChoice('p2','heads')">👆 Cara</button>
          <button class="choice-btn flex-1 py-2 px-3 text-sm idle" id="p2-tails" onclick="selectChoice('p2','tails')">✋ Cruz</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3D Canvas Coin -->
  <div id="coin-area">
    <div id="coin-wrap" onclick="tapCoin()">
      <canvas id="coin-canvas" width="220" height="220"></canvas>
    </div>
    <div id="coin-shadow"></div>
    <p class="text-xs opacity-30">Toca la moneda o usa el botón</p>
  </div>

  <!-- Result card -->
  <div id="result-card" class="hidden p-5 text-center">
    <div class="text-4xl mb-2" id="result-emoji">🪙</div>
    <p class="text-2xl font-extrabold mb-1" id="result-title">—</p>
    <p class="text-sm opacity-60" id="result-sub">—</p>
    <div class="mt-4 flex justify-center gap-3">
      <button onclick="confirmResult()" class="px-5 py-2 rounded-full font-bold text-sm" style="background:var(--cyan);color:#050505">
        Confirmar
      </button>
      <button onclick="resetCoin()" class="px-5 py-2 rounded-full font-bold text-sm" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15)">
        Repetir
      </button>
    </div>
  </div>

  <!-- Flip button -->
  <button id="flip-btn" class="w-full py-5" onclick="flipCoin()">
    <span class="flex items-center justify-center gap-2">
      <span class="material-icons-round">toll</span>
      ¡LANZAR MONEDA!
    </span>
  </button>

  <!-- History -->
  <div class="glass p-5">
    <h3 class="font-bold text-sm mb-3">Historial</h3>
    <div id="history" class="space-y-1">
      <p class="text-xs opacity-30 text-center py-2">Sin lanzamientos aún</p>
    </div>
  </div>

</main>

<script>
// ══════════════════════════════════════════════════════════════════════════════
//  CANVAS-BASED 3D COIN RENDERER
//  The coin is drawn on a <canvas> using ellipses to simulate perspective.
//  angleY: rotation around Y axis (0 = heads facing, π/2 = edge, π = tails, etc.)
//  This gives a true 3D flip illusion without CSS transforms.
// ══════════════════════════════════════════════════════════════════════════════

const coinCanvas = document.getElementById('coin-canvas');
const cctx       = coinCanvas.getContext('2d');
const C          = 220;         // canvas size
const R          = 88;          // coin face radius (face occupies most of canvas)
const CX         = C / 2;
const CY         = C / 2;
const EDGE_THICKNESS = 10;      // visible edge width when nearly 90°

// Current Y-rotation angle (radians). 0 = heads, π = tails.
let coinAngleY = 0;

// ── Gradient caches (built once per draw pass is fine) ──────────────────────
function makeHeadsGrad(scaleX) {
  // Perspective squish makes radius = R*|cos(angleY)|
  const rx = Math.max(R * Math.abs(scaleX), 1);
  const g  = cctx.createRadialGradient(CX - rx * 0.25, CY - rx * 0.25, 2, CX, CY, rx);
  g.addColorStop(0,    '#5ffff0');
  g.addColorStop(0.3,  '#3ffff0');
  g.addColorStop(0.6,  '#13ecd6');
  g.addColorStop(0.82, '#07a89e');
  g.addColorStop(1,    '#045954');
  return g;
}
function makeTailsGrad(scaleX) {
  const rx = Math.max(R * Math.abs(scaleX), 1);
  const g  = cctx.createRadialGradient(CX - rx * 0.25, CY - rx * 0.25, 2, CX, CY, rx);
  g.addColorStop(0,    '#ffe87c');
  g.addColorStop(0.3,  '#e8c843');
  g.addColorStop(0.6,  '#d4af37');
  g.addColorStop(0.82, '#a07825');
  g.addColorStop(1,    '#5a420c');
  return g;
}

function drawCoin(angleY) {
  cctx.clearRect(0, 0, C, C);

  // cos(angleY) gives the X-scale for the ellipse (1=full circle, 0=line, -1=back)
  const cosA = Math.cos(angleY);
  const sinA = Math.abs(Math.sin(angleY));  // edge blend (0–1)
  const rx   = R * Math.abs(cosA);          // half-width of visible face ellipse

  // Which face is visible?
  // cosA > 0 → heads; cosA < 0 → tails; cosA ≈ 0 → edge
  const showHeads = cosA >= 0;

  // ── Draw cylindrical edge ────────────────────────────────────────────────
  if (sinA > 0.05) {
    const edgeH = Math.min(EDGE_THICKNESS * sinA * 1.6, R * 0.18);
    // Edge = rectangle behind the face ellipse, slightly taller
    const edgeGrad = cctx.createLinearGradient(CX - R, 0, CX + R, 0);
    edgeGrad.addColorStop(0,    '#555');
    edgeGrad.addColorStop(0.15, '#ccc');
    edgeGrad.addColorStop(0.35, '#777');
    edgeGrad.addColorStop(0.5,  '#bbb');
    edgeGrad.addColorStop(0.65, '#666');
    edgeGrad.addColorStop(0.85, '#aaa');
    edgeGrad.addColorStop(1,    '#444');
    // Bottom half of edge (shadow side)
    cctx.beginPath();
    cctx.ellipse(CX, CY + edgeH, R, R * 0.32, 0, 0, Math.PI);
    cctx.fillStyle = 'rgba(0,0,0,0.55)';
    cctx.fill();
    // Full edge band
    cctx.beginPath();
    cctx.ellipse(CX, CY - edgeH / 2, R, R * 0.22, 0, 0, Math.PI * 2);
    cctx.fillStyle = edgeGrad;
    cctx.fill();
    // Rim stripes
    for (let k = 0; k < 12; k++) {
      const px = CX - R + (2 * R * k / 12);
      cctx.beginPath();
      cctx.rect(px, CY - edgeH / 2 - R * 0.22, 1.5, R * 0.44);
      cctx.fillStyle = 'rgba(0,0,0,0.2)';
      cctx.fill();
    }
  }

  // ── Draw face ────────────────────────────────────────────────────────────
  if (rx > 0.5) {
    const faceGrad = showHeads ? makeHeadsGrad(cosA) : makeTailsGrad(cosA);
    const borderCol = showHeads ? 'rgba(19,236,214,0.85)' : 'rgba(212,175,55,0.85)';

    // Face ellipse
    cctx.beginPath();
    cctx.ellipse(CX, CY, rx, R, 0, 0, Math.PI * 2);
    cctx.fillStyle = faceGrad;
    cctx.fill();

    // Border ring
    cctx.beginPath();
    cctx.ellipse(CX, CY, rx, R, 0, 0, Math.PI * 2);
    cctx.strokeStyle = borderCol;
    cctx.lineWidth   = 3;
    cctx.stroke();

    // Specular highlight (top-left arc)
    const hlGrad = cctx.createRadialGradient(
      CX - rx * 0.35, CY - R * 0.3, 1,
      CX - rx * 0.15, CY - R * 0.1, rx * 0.85
    );
    hlGrad.addColorStop(0,    'rgba(255,255,255,0.45)');
    hlGrad.addColorStop(0.45, 'rgba(255,255,255,0.08)');
    hlGrad.addColorStop(1,    'rgba(255,255,255,0)');
    cctx.beginPath();
    cctx.ellipse(CX, CY, rx, R, 0, 0, Math.PI * 2);
    cctx.fillStyle = hlGrad;
    cctx.fill();

    // Inner engraving ring (perspective-correct)
    cctx.beginPath();
    cctx.ellipse(CX, CY, rx * 0.77, R * 0.77, 0, 0, Math.PI * 2);
    cctx.strokeStyle = 'rgba(255,255,255,0.18)';
    cctx.lineWidth   = 1.5;
    cctx.stroke();

    // Icon / text in center (only when face is wide enough to read)
    if (rx > R * 0.3) {
      const alpha = Math.min(1, (rx / R - 0.3) / 0.35);
      cctx.globalAlpha = alpha;
      cctx.fillStyle   = '#fff';
      cctx.font        = `900 ${Math.round(13 * rx / R)}px Manrope, sans-serif`;
      cctx.textAlign   = 'center';
      cctx.textBaseline = 'middle';
      cctx.shadowColor = 'rgba(0,0,0,0.7)';
      cctx.shadowBlur  = 6;
      // Simple text label (icon via Material Symbols not available on canvas)
      cctx.fillText(showHeads ? 'CARA' : 'CRUZ', CX, CY + 10);
      // Year / decorative
      cctx.font = `700 ${Math.round(8 * rx / R)}px Manrope, sans-serif`;
      cctx.fillStyle = 'rgba(255,255,255,0.55)';
      cctx.fillText('2026', CX, CY - 14 * rx / R);
      cctx.shadowBlur  = 0;
      cctx.globalAlpha = 1;
    }

    // Bottom shadow on face
    const shadowGrad = cctx.createLinearGradient(CX, CY, CX, CY + R);
    shadowGrad.addColorStop(0, 'transparent');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0.28)');
    cctx.beginPath();
    cctx.ellipse(CX, CY, rx, R, 0, 0, Math.PI * 2);
    cctx.fillStyle = shadowGrad;
    cctx.fill();
  }
}

// ══════════════════════════════════════════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════════════════════════════════════════
let headsCount = 0, tailsCount = 0, totalFlips = 0;
let isFlipping = false;
let choices    = { p1: null, p2: null };
let history    = [];
let players  = [{name:'Jugador 1', color:'#13ecd6'}, {name:'Jugador 2', color:'#a855f7'}];
let lastResult = null;

function updatePlayerName(num, val) {
  const name = val.trim() || (num === 1 ? 'Jugador 1' : 'Jugador 2');
  players[num - 1].name = name;
}

// Audio shims
function playCoinSpin()  { if (window.SGAudio) SGAudio.coinSpin(); }
function playCoinLand()  { if (window.SGAudio) SGAudio.coinLand(); }
function playWinSound()  { if (window.SGAudio) SGAudio.victory(); }

function selectChoice(player, side) {
  choices[player] = side;
  const other = player === 'p1' ? 'p2' : 'p1';
  if (!choices[other]) {
    const otherSide = side === 'heads' ? 'tails' : 'heads';
    choices[other]  = otherSide;
    updateChoiceButtons(other, otherSide);
  }
  updateChoiceButtons(player, side);
}

function updateChoiceButtons(player, side) {
  const h = document.getElementById(`${player}-heads`);
  const t = document.getElementById(`${player}-tails`);
  h.className = `choice-btn flex-1 py-2 px-3 text-sm ${side === 'heads' ? 'selected-heads' : 'idle'}`;
  t.className = `choice-btn flex-1 py-2 px-3 text-sm ${side === 'tails' ? 'selected-tails' : 'idle'}`;
}

function tapCoin() { if (!isFlipping) flipCoin(); }

// ── FLIP ANIMATION ────────────────────────────────────────────────────────────
// Pure JS animation: rotate angleY from 0 through multiple spins.
// Heads = 0, 2π, 4π…   Tails = π, 3π, 5π…
function flipCoin() {
  if (isFlipping) return;
  isFlipping = true;
  if (window.SGAudio) SGAudio.resume();
  playCoinSpin();

  document.getElementById('flip-btn').disabled = true;
  document.getElementById('result-card').classList.add('hidden');
  coinCanvas.classList.remove('result-heads', 'result-tails');

  const shadow = document.getElementById('coin-shadow');
  shadow.classList.add('flying');

  // Determine result
  const result = Math.random() < 0.5 ? 'heads' : 'tails';
  lastResult   = result;

  // Total rotation: 5 full spins (10π) + landing angle
  const landingAngle = result === 'heads'
    ? Math.round(coinAngleY / (Math.PI * 2)) * Math.PI * 2          // even multiple → heads
    : Math.round(coinAngleY / (Math.PI * 2)) * Math.PI * 2 + Math.PI; // +π → tails
  const totalSpins  = 5 * Math.PI * 2; // 5 full rotations
  const startAngle  = coinAngleY;
  const endAngle    = landingAngle + totalSpins;
  const duration    = 2200; // ms
  const t0          = performance.now();

  // Animation: vertical lift while spinning
  // translateY goes: 0 → -40px (peak at 25%) → 0 (land at 100%)
  const coinWrap = document.getElementById('coin-wrap');

  function easeFlip(t) {
    // Fast at first (launch), slow at end (landing). Smooth arc.
    return t < 0.5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function liftY(t) {
    // Parabolic lift: 0 at t=0, peak at t=0.35, 0 at t=1
    return -48 * Math.sin(Math.PI * Math.min(t / 0.75, 1));
  }

  function animate(now) {
    const elapsed = now - t0;
    const t       = Math.min(elapsed / duration, 1);
    const te      = easeFlip(t);

    coinAngleY = startAngle + (endAngle - startAngle) * te;
    drawCoin(coinAngleY);

    // Vertical lift transform
    const ly = liftY(t);
    coinWrap.style.transform = `translateY(${ly}px)`;

    // Shadow scaling (smaller when coin is high)
    const sh = 1 - Math.max(0, ly / -48) * 0.7;
    shadow.style.transform = `scaleX(${sh})`;
    shadow.style.opacity   = String(0.25 + sh * 0.5);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      // Landing
      coinAngleY = endAngle;
      drawCoin(coinAngleY);
      coinWrap.style.transform = '';
      shadow.classList.remove('flying');
      shadow.style.transform   = '';
      shadow.style.opacity     = '';

      // Result glow
      coinCanvas.classList.add(result === 'heads' ? 'result-heads' : 'result-tails');

      playCoinLand();

      // Counts
      if (result === 'heads') headsCount++; else tailsCount++;
      totalFlips++;
      document.getElementById('heads-count').textContent    = headsCount;
      document.getElementById('tails-count').textContent    = tailsCount;
      document.getElementById('total-flips').textContent    = totalFlips;
      document.getElementById('flip-count-hdr').textContent = `×${totalFlips}`;

      isFlipping = false;
      document.getElementById('flip-btn').disabled = false;
      showResult(result);
    }
  }
  requestAnimationFrame(animate);
}

function showResult(result) {
  const isHeads  = result === 'heads';
  playWinSound();
  const resultCard = document.getElementById('result-card');
  resultCard.classList.remove('hidden', 'heads-win', 'tails-win');
  resultCard.classList.add(isHeads ? 'heads-win' : 'tails-win');

  let winnerMsg = '';
  if (choices.p1 || choices.p2) {
    const p1Won = choices.p1 === result;
    const p2Won = choices.p2 === result;
    if (p1Won)       winnerMsg = `¡${players[0].name} gana!`;
    else if (p2Won)  winnerMsg = `¡${players[1].name} gana!`;
    else             winnerMsg = 'Ninguno acertó – repetir';
  } else {
    winnerMsg = isHeads ? `${players[0].name} paga` : `${players[1].name} paga`;
  }

  document.getElementById('result-emoji').textContent   = isHeads ? '👆' : '✋';
  document.getElementById('result-title').textContent   = isHeads ? '¡CARA!' : '¡CRUZ!';
  document.getElementById('result-title').style.color   = isHeads ? 'var(--cyan)' : 'var(--gold)';
  document.getElementById('result-sub').textContent     = winnerMsg;

  const time = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  history.unshift({result, label: isHeads ? 'CARA' : 'CRUZ', time, winner: winnerMsg});
  renderHistory();

  launchConfetti(isHeads ? '#13ecd6' : '#d4af37');
  SGRouter.showToast(isHeads ? '¡Cara! 👆' : '¡Cruz! ✋', 'success');
}

function renderHistory() {
  const el = document.getElementById('history');
  if (!history.length) {
    el.innerHTML = '<p class="text-xs opacity-30 text-center py-2">Sin lanzamientos aún</p>';
    return;
  }
  el.innerHTML = history.slice(0, 6).map((h, i) => `
    <div class="flex items-center justify-between py-1 ${i > 0 ? 'border-t border-white/5' : ''}">
      <div class="flex items-center gap-2">
        <span class="text-xs font-black px-2 py-0.5 rounded-full"
          style="background:${h.result === 'heads' ? 'rgba(19,236,214,0.15)' : 'rgba(212,175,55,0.15)'};
                 color:${h.result === 'heads' ? '#13ecd6' : '#d4af37'}">
          ${h.label}
        </span>
        <span class="text-xs opacity-60">${h.winner}</span>
      </div>
      <span class="text-xs opacity-30">${h.time}</span>
    </div>`).join('');
}

function resetCoin() {
  coinAngleY = 0;
  drawCoin(0);
  coinCanvas.classList.remove('result-heads', 'result-tails');
  document.getElementById('coin-wrap').style.transform = '';
  lastResult = null;
  choices    = { p1: null, p2: null };
  ['p1','p2'].forEach(p => {
    ['heads','tails'].forEach(s => {
      document.getElementById(`${p}-${s}`).className = 'choice-btn flex-1 py-2 px-3 text-sm idle';
    });
  });
  document.getElementById('result-card').classList.add('hidden');
}

function confirmResult() {
  SGRouter.showToast('Resultado confirmado ✓', 'success');
  document.getElementById('result-card').classList.add('hidden');
  setTimeout(() => SGRouter.navigate('split', 'game-coin'), 1200);
}

function launchConfetti(color) {
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random() * 100}vw;top:-20px;
      background:${Math.random() > 0.5 ? color : '#ffffff'};
      width:${5 + Math.random() * 9}px;height:${5 + Math.random() * 9}px;
      animation-duration:${1.5 + Math.random() * 2}s;
      animation-delay:${Math.random() * 0.5}s;
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'}`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// ── FIX: LOAD GROUPS FROM API ─────────────────────────────────────────────────
// Actualiza los nombres de los jugadores (inputs visibles) y el estado interno
function setCoinPlayers(p1name, p2name) {
  players[0].name = p1name || 'Jugador 1';
  players[1].name = p2name || 'Jugador 2';
  const inp1 = document.getElementById('player1-input');
  const inp2 = document.getElementById('player2-input');
  if (inp1) inp1.value = players[0].name;
  if (inp2) inp2.value = players[1].name;
}

async function onCoinGroupChange(groupId) {
  if (!groupId) return;
  try {
    const res = await SGApi.getGroupMembers(groupId);
    if (res && res.success && res.members && res.members.length >= 2) {
      setCoinPlayers(res.members[0].name, res.members[1].name);
      SGRouter.showToast('Jugadores cargados del grupo ✓', 'success');
    } else if (res && res.success && res.members && res.members.length === 1) {
      setCoinPlayers(res.members[0].name, 'Jugador 2');
    }
  } catch(e) { /* silenciar — jugadores por defecto ya están puestos */ }
}

async function loadCoinGroups() {
  if (!window.SGAuth || !SGAuth.isLoggedIn()) return; // jugadores por defecto
  try { await fetch('/api/db/repair-memberships', { method: 'POST', headers: { 'Authorization': `Bearer ${SGAuth.getToken()}` } }); } catch {}
  try {
    const res = await SGApi.getGroups();
    const sel = document.getElementById('group-select-coin');
    if (res && res.success && res.groups && res.groups.length > 0) {
      sel.innerHTML = res.groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
      // Cargar miembros del primer grupo
      await onCoinGroupChange(res.groups[0].id);
    } else {
      sel.innerHTML = '<option value="">Sin grupos — jugadores manuales</option>';
    }
  } catch(e) {
    const sel = document.getElementById('group-select-coin');
    if (sel) sel.innerHTML = '<option value="">Sin grupos — jugadores manuales</option>';
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
drawCoin(0);  // initial draw: heads facing
loadCoinGroups();
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .then(reg => {
                reg.update().catch(() => {});
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    if (!sw) return;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                            sw.postMessage({ type: 'SKIP_WAITING' });
                        }
                    });
                });
            })
            .catch(e => console.warn('[SW] Failed:', e));
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) { refreshing = true; window.location.reload(); }
        });
    });
}
</script>
