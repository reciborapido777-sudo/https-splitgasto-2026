<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Moneda Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Motor de Rotación de Moneda */
        .coin-container { perspective: 1000px; width: 200px; height: 200px; }
        #coin {
            width: 100%; height: 100%;
            position: relative; transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .coin-face {
            position: absolute; inset: 0; border-radius: 50%;
            backface-visibility: hidden; display: flex;
            align-items: center; justify-content: center;
            border: 4px solid rgba(255,255,255,0.1);
        }
        .heads { background: linear-gradient(135deg, #13ecd6 0%, #0a0a0a 100%); color: #000; }
        .tails { background: linear-gradient(135deg, #a855f7 0%, #000 100%); color: #fff; transform: rotateY(180deg); }
        
        @keyframes flip-heads { from { transform: rotateY(0); } to { transform: rotateY(1800deg); } }
        @keyframes flip-tails { from { transform: rotateY(0); } to { transform: rotateY(1980deg); } }
        
        .flipping-heads { animation: flip-heads 2s forwards cubic-bezier(0.1, 0.8, 0.3, 1); }
        .flipping-tails { animation: flip-tails 2s forwards cubic-bezier(0.1, 0.8, 0.3, 1); }
    </style>
    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame">
    <div class="max-w-lg mx-auto px-4 py-8 space-y-12">
        
        <header class="flex justify-between items-center">
            <button onclick="SGRouter.back()" class="size-12 rounded-2xl glass-panel flex items-center justify-center">
                <span class="material-icons-round text-zinc-500">arrow_back</span>
            </button>
            <h1 class="text-sm font-black font-['Space_Grotesk'] tracking-[0.3em] uppercase italic">Moneda Alpha</h1>
            <div class="size-12"></div>
        </header>

        <div class="flex flex-col items-center justify-center space-y-12 py-10">
            <div class="coin-container">
                <div id="coin">
                    <div class="coin-face heads">
                        <span class="material-icons-round text-6xl">account_balance</span>
                    </div>
                    <div class="coin-face tails">
                        <span class="material-icons-round text-6xl">Bolt</span>
                    </div>
                </div>
            </div>

            <div id="result-text" class="h-8 text-center">
                <p class="text-[10px] font-black uppercase tracking-[0.5em] text-[#13ecd6] opacity-0 transition-opacity" id="res-label">¡CARA!</p>
            </div>
        </div>

        <div class="space-y-4">
            <button id="flip-btn" onclick="tossCoin()" class="w-full py-6 bg-white text-black rounded-2xl font-black text-[10px] uppercase tracking-widest active:scale-95 transition-all">
                LANZAR MONEDA
            </button>
            <p class="text-center text-[9px] font-bold text-zinc-600 uppercase tracking-widest">Cara: Paga Socio A • Cruz: Paga Socio B</p>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playCoinSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function tossCoin() {
            const coin = document.getElementById('coin');
            const btn = document.getElementById('flip-btn');
            const label = document.getElementById('res-label');
            
            if(audioCtx.state === 'suspended') audioCtx.resume();
            playCoinSound();

            btn.disabled = true;
            label.classList.add('opacity-0');
            coin.className = '';
            
            const isHeads = Math.random() > 0.5;
            
            setTimeout(() => {
                coin.classList.add(isHeads ? 'flipping-heads' : 'flipping-tails');
            }, 50);

            setTimeout(() => {
                label.innerText = isHeads ? '¡CARA!' : '¡CRUZ!';
                label.style.color = isHeads ? '#13ecd6' : '#a855f7';
                label.classList.remove('opacity-0');
                btn.disabled = false;
                SGRouter.showToast(isHeads ? 'CARA' : 'CRUZ', 'premium');
            }, 2100);
        }
    </script>
</div>
</body>
</html>
