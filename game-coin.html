<style>
  :root { --cyan:#13ecd6; --purple:#a855f7; --orange:#FF9D42; }
  * { font-family:'Manrope',sans-serif; box-sizing:border-box; }
  body { background:#050505; min-height:100dvh; overflow-x:hidden; }

  .glass { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); border-radius:24px; }

  /* ─── 3D Coin — realistic with visible edge ─── */
  #coin-scene {
    perspective:500px;
    width:200px; height:200px;
    margin:0 auto;
    cursor:pointer;
    position:relative;
  }
  #coin {
    width:100%; height:100%;
    transform-style:preserve-3d;
    position:relative;
    transition:none;
    will-change:transform;
  }
  .coin-face {
    position:absolute; inset:0;
    border-radius:50%;
    backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  /* Heads — cyan metallic */
  #coin-heads {
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.45) 0%, transparent 50%),
      radial-gradient(circle at 70% 75%, rgba(0,0,0,0.2) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #3ffff0 0%, #13ecd6 40%, #07a89e 75%, #055f59 100%);
    box-shadow:
      0 0 60px rgba(19,236,214,0.55),
      inset 0 3px 6px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.35);
    border:3px solid rgba(19,236,214,0.8);
  }
  /* Tails — gold metallic */
  #coin-tails {
    transform:rotateY(180deg);
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5) 0%, transparent 50%),
      radial-gradient(circle at 70% 75%, rgba(0,0,0,0.25) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #ffe87a 0%, #d4af37 38%, #a07d1a 72%, #5a440a 100%);
    box-shadow:
      0 0 60px rgba(212,175,55,0.55),
      inset 0 3px 6px rgba(255,255,255,0.45),
      inset 0 -3px 6px rgba(0,0,0,0.4);
    border:3px solid rgba(212,175,55,0.85);
  }
  /* Coin inner ring engraving */
  .coin-inner {
    width:76%; height:76%;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:4px;
    position:relative;
  }
  .coin-inner::before {
    content:'';
    position:absolute; inset:6px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.12);
  }
  /* Visible coin EDGE — CSS cylinder trick */
  #coin-edge {
    position:absolute;
    left:50%; top:0;
    width:8px; height:100%;
    transform:translateX(-50%) rotateY(90deg);
    background:linear-gradient(to bottom,
      #888 0%, #ccc 15%, #777 35%, #bbb 50%, #666 65%, #aaa 80%, #555 100%);
    backface-visibility:visible;
    border-radius:4px;
    box-shadow:inset 0 0 4px rgba(0,0,0,0.6);
  }

  /* Coin shadow on table */
  #coin-shadow {
    width:80%; height:24px;
    background:radial-gradient(ellipse, rgba(0,0,0,0.65) 0%, transparent 70%);
    border-radius:50%;
    filter:blur(10px);
    margin:8px auto 0;
    transition:transform 0.3s, opacity 0.3s;
    transform-origin:center;
  }
  #coin-shadow.squashed {
    transform:scaleX(0.4);
    opacity:0.4;
  }

  /* Flip animations — 5 full spins (1800°) + landing */
  @keyframes flip-heads {
    0%   { transform:rotateY(0deg) translateY(0); }
    15%  { transform:rotateY(270deg) translateY(-30px); }
    70%  { transform:rotateY(1440deg) translateY(-10px); }
    100% { transform:rotateY(1800deg) translateY(0); }
  }
  @keyframes flip-tails {
    0%   { transform:rotateY(0deg) translateY(0); }
    15%  { transform:rotateY(270deg) translateY(-30px); }
    70%  { transform:rotateY(1620deg) translateY(-10px); }
    100% { transform:rotateY(1980deg) translateY(0); }
  }
  .flip-heads { animation:flip-heads 2.2s cubic-bezier(0.22,0.61,0.36,1) forwards; }
  .flip-tails { animation:flip-tails 2.2s cubic-bezier(0.22,0.61,0.36,1) forwards; }

  /* Bounce after landing */
  @keyframes coin-bounce {
    0%   { transform:rotateY(var(--end-rot)) translateY(0); }
    25%  { transform:rotateY(var(--end-rot)) translateY(-12px); }
    55%  { transform:rotateY(var(--end-rot)) translateY(-4px); }
    80%  { transform:rotateY(var(--end-rot)) translateY(-1px); }
    100% { transform:rotateY(var(--end-rot)) translateY(0); }
  }
  /* Glow pulse on result */
  @keyframes coin-glow-heads {
    0%,100%{ box-shadow:0 0 30px rgba(19,236,214,0.4); }
    50%    { box-shadow:0 0 80px rgba(19,236,214,0.9), 0 0 30px rgba(19,236,214,0.5); }
  }
  @keyframes coin-glow-tails {
    0%,100%{ box-shadow:0 0 30px rgba(212,175,55,0.4); }
    50%    { box-shadow:0 0 80px rgba(212,175,55,0.9), 0 0 30px rgba(212,175,55,0.5); }
  }

  /* Result glow */
  #result-card {
    transition:all 0.4s;
    border-radius:24px;
  }
  #result-card.heads-win {
    background:linear-gradient(135deg, rgba(19,236,214,0.15), rgba(19,236,214,0.05));
    border:1px solid rgba(19,236,214,0.4);
    box-shadow:0 0 40px rgba(19,236,214,0.2);
  }
  #result-card.tails-win {
    background:linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
    border:1px solid rgba(212,175,55,0.4);
    box-shadow:0 0 40px rgba(212,175,55,0.2);
  }

  /* Buttons */
  .choice-btn {
    border-radius:16px;
    font-weight:800;
    font-size:0.95rem;
    transition:all 0.2s;
    border:2px solid transparent;
    position:relative; overflow:hidden;
  }
  .choice-btn.selected-heads {
    background:rgba(19,236,214,0.15);
    border-color:var(--cyan);
    color:var(--cyan);
  }
  .choice-btn.selected-tails {
    background:rgba(212,175,55,0.15);
    border-color:#d4af37;
    color:#d4af37;
  }
  .choice-btn.idle {
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.12);
  }
  #flip-btn {
    background:linear-gradient(135deg, var(--cyan), #0fbfaf);
    color:#050505;
    border-radius:50px;
    font-weight:800; font-size:1.1rem;
    box-shadow:0 8px 32px rgba(19,236,214,0.4);
    transition:all 0.2s;
  }
  #flip-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 40px rgba(19,236,214,0.6); }
  #flip-btn:disabled { opacity:0.5; cursor:not-allowed; }

  .bottom-nav { background:rgba(5,5,5,0.95); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.06); }

  .confetti-piece { position:fixed; border-radius:2px; animation:confetti-fall linear forwards; z-index:100; pointer-events:none; }
  @keyframes confetti-fall { from{transform:translateY(-20px) rotate(0deg);opacity:1} to{transform:translateY(110vh) rotate(720deg);opacity:0} }

  /* Ambient glow */
  .heads-glow { box-shadow:0 0 80px rgba(19,236,214,0.2); }
  .tails-glow { box-shadow:0 0 80px rgba(212,175,55,0.2); }

<body class="app-shell text-white pb-32">
<div class="app-frame">

<!-- Header -->
<header class="flex justify-between items-center px-5 py-4 sticky top-0 z-50" style="background:rgba(5,5,5,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05)">
  <button onclick="SGRouter.back()" class="flex items-center justify-center w-10 h-10 rounded-full" style="background:rgba(255,255,255,0.07)">
    <span class="material-icons-round" style="color:var(--cyan)">arrow_back_ios_new</span>
  </button>
  <div class="text-center">
    <h1 class="font-bold text-base">Cara o Cruz</h1>
    <p class="text-xs opacity-50">El Clásico de SplitGasto</p>
  </div>
  <div class="w-10 h-10 flex items-center justify-center rounded-full" style="background:rgba(255,255,255,0.07)">
    <span class="text-xs font-bold opacity-40" id="flip-count-hdr">×0</span>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-6 space-y-5">

  <!-- Stats row -->
  <div class="grid grid-cols-3 gap-3">
    <div class="glass p-3 text-center">
      <p class="text-lg font-bold" style="color:var(--cyan)" id="heads-count">0</p>
      <p class="text-xs opacity-40">Cara</p>
    </div>
    <div class="glass p-3 text-center">
      <p class="text-lg font-bold text-white" id="total-flips">0</p>
      <p class="text-xs opacity-40">Total</p>
    </div>
    <div class="glass p-3 text-center">
      <p class="text-lg font-bold" style="color:#d4af37" id="tails-count">0</p>
      <p class="text-xs opacity-40">Cruz</p>
    </div>
  </div>

  <!-- Choice row (who calls?) -->
  <div class="glass p-4">
    <p class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">¿Quién elige?</p>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <p class="text-xs opacity-50 mb-2" id="player1-name">Commander</p>
        <div class="flex gap-2">
          <button class="choice-btn flex-1 py-2 px-3 text-sm idle" id="p1-heads" onclick="selectChoice('p1','heads')">👆 Cara</button>
          <button class="choice-btn flex-1 py-2 px-3 text-sm idle" id="p1-tails" onclick="selectChoice('p1','tails')">✋ Cruz</button>
        </div>
      </div>
      <div>
        <p class="text-xs opacity-50 mb-2" id="player2-name">Mario</p>
        <div class="flex gap-2">
          <button class="choice-btn flex-1 py-2 px-3 text-sm idle" id="p2-heads" onclick="selectChoice('p2','heads')">👆 Cara</button>
          <button class="choice-btn flex-1 py-2 px-3 text-sm idle" id="p2-tails" onclick="selectChoice('p2','tails')">✋ Cruz</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3D Coin -->
  <div class="flex flex-col items-center py-4 gap-4">
    <div id="coin-scene" onclick="tapCoin()">
      <div id="coin">
        <!-- Heads face — cyan -->
        <div class="coin-face" id="coin-heads">
          <div class="coin-inner">
            <span class="material-icons-round text-white" style="font-size:2.2rem;text-shadow:0 2px 8px rgba(0,0,0,0.4)">account_balance_wallet</span>
            <span class="text-white font-black tracking-widest" style="font-size:0.65rem;text-shadow:0 1px 4px rgba(0,0,0,0.5)">CARA</span>
          </div>
        </div>
        <!-- Tails face — gold -->
        <div class="coin-face" id="coin-tails">
          <div class="coin-inner">
            <span class="material-icons-round text-white" style="font-size:2.2rem;text-shadow:0 2px 8px rgba(0,0,0,0.4)">monetization_on</span>
            <span class="text-white font-black tracking-widest" style="font-size:0.65rem;text-shadow:0 1px 4px rgba(0,0,0,0.5)">CRUZ</span>
          </div>
        </div>
        <!-- Coin edge (visible during spin) -->
        <div id="coin-edge"></div>
      </div>
    </div>
    <div id="coin-shadow"></div>

      ¡LANZAR MONEDA!
    </span>

    </div>
  </div>

</main>

<script>
// ─── AUDIO ENGINE (delegated to engine/audio.js) ──────────────────────────────
function playCoinSpin() { if(window.SGAudio) SGAudio.coinSpin(); }
function playCoinLand() { if(window.SGAudio) SGAudio.coinLand(); }
function playWinSound() { if(window.SGAudio) SGAudio.victory(); }
let headsCount = 0, tailsCount = 0, totalFlips = 0;
let isFlipping = false;
let choices = {p1: null, p2: null};
let history = [];
const players = [{name:'Commander', color:'#13ecd6'}, {name:'Mario', color:'#a855f7'}];
let lastResult = null;

function selectChoice(player, side) {
  choices[player] = side;
  const other = player === 'p1' ? 'p2' : 'p1';
  // Auto-select opposite for other player if not chosen
  if (!choices[other]) {
    const otherSide = side === 'heads' ? 'tails' : 'heads';
    choices[other] = otherSide;
    updateChoiceButtons(other, otherSide);
  }
  updateChoiceButtons(player, side);
}

function updateChoiceButtons(player, side) {
  const h = document.getElementById(`${player}-heads`);
  const t = document.getElementById(`${player}-tails`);
  h.className = `choice-btn flex-1 py-2 px-3 text-sm ${side==='heads'?'selected-heads':'idle'}`;
  t.className = `choice-btn flex-1 py-2 px-3 text-sm ${side==='tails'?'selected-tails':'idle'}`;
}

function tapCoin() { if (!isFlipping) flipCoin(); }

function flipCoin() {
  if (isFlipping) return;
  isFlipping = true;
  if (window.SGAudio) { SGAudio.resume(); }
  playCoinSpin();

  document.getElementById('flip-btn').disabled = true;
  document.getElementById('result-card').classList.add('hidden');

  const coin   = document.getElementById('coin');
  const shadow = document.getElementById('coin-shadow');
  const heads  = document.getElementById('coin-heads');
  const tails  = document.getElementById('coin-tails');

  // Reset
  coin.style.animation = 'none';
  coin.style.transform = '';
  heads.style.animation = '';
  tails.style.animation = '';
  shadow.classList.remove('squashed');
  void coin.offsetWidth; // force reflow

  // Determine result
  const result = Math.random() < 0.5 ? 'heads' : 'tails';
  lastResult = result;

  // Apply flip animation
  const animClass = result === 'heads' ? 'flip-heads' : 'flip-tails';
  coin.classList.remove('flip-heads', 'flip-tails');
  coin.classList.add(animClass);

  // Shadow: squash during flight, restore on land
  setTimeout(() => shadow.classList.add('squashed'), 100);

  // LANDING (2200ms — matches animation duration)
  setTimeout(() => {
    shadow.classList.remove('squashed');
    coin.classList.remove('flip-heads', 'flip-tails');

    const endRot = result === 'heads' ? '0deg' : '180deg';
    coin.style.setProperty('--end-rot', endRot);
    coin.style.transform = `rotateY(${endRot})`;

    // Apply landing glow to visible face
    const visibleFace = result === 'heads' ? heads : tails;
    visibleFace.style.animation = result === 'heads'
      ? 'coin-glow-heads 1.5s ease infinite'
      : 'coin-glow-tails 1.5s ease infinite';

    playCoinLand();

    // Update counts
    if (result === 'heads') headsCount++; else tailsCount++;
    totalFlips++;
    document.getElementById('heads-count').textContent = headsCount;
    document.getElementById('tails-count').textContent = tailsCount;
    document.getElementById('total-flips').textContent = totalFlips;
    document.getElementById('flip-count-hdr').textContent = `×${totalFlips}`;

    showResult(result);
    isFlipping = false;
    document.getElementById('flip-btn').disabled = false;
  }, 2300);
}

function showResult(result) {
  const isHeads = result === 'heads';
  playWinSound();
  const resultCard = document.getElementById('result-card');
  resultCard.classList.remove('hidden', 'heads-win', 'tails-win');
  resultCard.classList.add(isHeads ? 'heads-win' : 'tails-win');

  // Determine who wins
  let winnerMsg = '';
  if (choices.p1 || choices.p2) {
    const p1Won = choices.p1 === result;
    const p2Won = choices.p2 === result;
    if (p1Won) winnerMsg = `¡${players[0].name} gana!`;
    else if (p2Won) winnerMsg = `¡${players[1].name} gana!`;
    else winnerMsg = 'Ninguno acertó – repetir';
  } else {
    winnerMsg = isHeads ? `${players[0].name} paga` : `${players[1].name} paga`;
  }

  document.getElementById('result-emoji').textContent = isHeads ? '👆' : '✋';
  document.getElementById('result-title').textContent = isHeads ? '¡CARA!' : '¡CRUZ!';
  document.getElementById('result-title').style.color = isHeads ? 'var(--cyan)' : '#d4af37';
  document.getElementById('result-sub').textContent = winnerMsg;

  // History
  const time = new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'});
  history.unshift({result, label: isHeads?'CARA':'CRUZ', time, winner: winnerMsg});
  renderHistory();

  launchConfetti(isHeads ? '#13ecd6' : '#d4af37');
  SGRouter.showToast(isHeads ? '¡Cara! 👆' : '¡Cruz! ✋', 'success');
}

function renderHistory() {
  const el = document.getElementById('history');
  if (history.length === 0) {
    el.innerHTML = '<p class="text-xs opacity-30 text-center py-2">Sin lanzamientos aún</p>';
    return;
  }
  el.innerHTML = history.slice(0,6).map((h, i) => `
    <div class="flex items-center justify-between py-1 ${i>0?'border-t border-white/5':''}">
      <div class="flex items-center gap-2">
        <span class="text-xs font-black px-2 py-0.5 rounded-full" style="background:${h.result==='heads'?'rgba(19,236,214,0.15)':'rgba(212,175,55,0.15)'};color:${h.result==='heads'?'#13ecd6':'#d4af37'}">${h.label}</span>
        <span class="text-xs opacity-60">${h.winner}</span>
      </div>
      <span class="text-xs opacity-30">${h.time}</span>
    </div>`).join('');
}

function resetCoin() {
  const coin  = document.getElementById('coin');
  coin.style.transition = 'transform 0.5s ease';
  coin.style.transform  = 'rotateY(0deg)';
  document.getElementById('coin-heads').style.animation = '';
  document.getElementById('coin-tails').style.animation = '';
  lastResult = null;
  choices = {p1: null, p2: null};
  // Reset choice buttons
  ['p1','p2'].forEach(p => {
    ['heads','tails'].forEach(s => {
      document.getElementById(`${p}-${s}`).className = 'choice-btn flex-1 py-2 px-3 text-sm idle';
    });
  });
  document.getElementById('result-card').classList.add('hidden');
}

function confirmResult() {
  SGRouter.showToast('Resultado confirmado ✓', 'success');
  document.getElementById('result-card').classList.add('hidden');
  setTimeout(() => SGRouter.navigate('split', 'game-coin'), 1200);
}

function launchConfetti(color) {
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `left:${Math.random()*100}vw;top:-20px;background:${Math.random()>0.5?color:'#ffffff'};width:${5+Math.random()*8}px;height:${5+Math.random()*8}px;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.5}s;border-radius:${Math.random()>0.5?'50%':'2px'}`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// Init
document.getElementById('player1-name').textContent = players[0].name;
document.getElementById('player2-name').textContent = players[1].name;
</script>

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
