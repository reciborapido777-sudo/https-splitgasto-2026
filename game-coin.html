<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Moneda Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        .coin-container { perspective: 1000px; width: 220px; height: 220px; }
        #coin {
            width: 100%; height: 100%;
            position: relative; transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .coin-face {
            position: absolute; inset: 0; border-radius: 50%;
            backface-visibility: hidden; display: flex;
            align-items: center; justify-content: center;
            border: 4px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 40px rgba(0,0,0,0.3);
        }
        .heads { background: radial-gradient(circle at 30% 30%, #13ecd6 0%, #064e47 100%); color: #000; }
        .tails { background: radial-gradient(circle at 30% 30%, #a855f7 0%, #3b0764 100%); color: #fff; transform: rotateY(180deg); }
        
        @keyframes flip-heads { 
            0% { transform: rotateY(0) translateY(0); }
            50% { transform: rotateY(900deg) translateY(-150px); }
            100% { transform: rotateY(1800deg) translateY(0); }
        }
        @keyframes flip-tails { 
            0% { transform: rotateY(0) translateY(0); }
            50% { transform: rotateY(990deg) translateY(-150px); }
            100% { transform: rotateY(1980deg) translateY(0); }
        }
        
        .flipping-heads { animation: flip-heads 2s forwards cubic-bezier(0.2, 0, 0.3, 1); }
        .flipping-tails { animation: flip-tails 2s forwards cubic-bezier(0.2, 0, 0.3, 1); }

        .coin-btn {
            background: #fff; color: #000; font-weight: 900; letter-spacing: 0.25em;
            box-shadow: 0 10px 40px rgba(255,255,255,0.1);
            transition: var(--transition-alpha);
        }
        .coin-btn:active { transform: scale(0.95); }
        .coin-btn:disabled { opacity: 0.5; filter: grayscale(1); }
    </style>
    <script src="engine/router.js"></script>
</head>
<body class="app-shell pb-32">
<div class="app-frame">
    <div class="max-w-lg mx-auto px-4 py-8 space-y-12">
        
        <header class="flex justify-between items-center py-4">
            <button onclick="SGRouter.back()" class="size-12 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all">
                <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
            </button>
            <div class="text-center">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.4em]">Decisión Rápida</p>
                <h1 class="text-lg font-black font-['Space_Grotesk'] tracking-widest uppercase italic text-white">Moneda Alpha</h1>
            </div>
            <div class="size-12"></div>
        </header>

        <div class="flex flex-col items-center justify-center space-y-12 py-10 reveal-node">
            <div class="coin-container">
                <div id="coin">
                    <div class="coin-face heads">
                        <span class="material-icons-round text-7xl">account_balance</span>
                    </div>
                    <div class="coin-face tails">
                        <span class="material-icons-round text-7xl">bolt</span>
                    </div>
                </div>
            </div>

            <div id="result-text" class="h-8 text-center">
                <p class="text-[12px] font-black uppercase tracking-[0.6em] transition-all duration-500 scale-150 opacity-0" id="res-label">¡CARA!</p>
            </div>
        </div>

        <div class="space-y-6 reveal-node" style="animation-delay: 0.2s">
            <button id="flip-btn" onclick="tossCoin()" class="coin-btn w-full py-6 rounded-2xl text-[10px] uppercase">
                EJECUTAR LANZAMIENTO
            </button>
            <div class="glass-panel p-4 rounded-xl border-white/5 text-center" onclick="SGRouter.navigate('split')">
                <p class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest leading-relaxed">
                    <span class="text-[#13ecd6]">Cara: Paga Socio A</span> • <span class="text-[#a855f7]">Cruz: Paga Socio B</span>
                </p>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item opacity-40" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p class="text-[8px] font-black uppercase tracking-widest mt-1">Mando</p>
            </button>
            <button class="nav-item opacity-40" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p class="text-[8px] font-black uppercase tracking-widest mt-1">Gastos</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('games')">
                <span class="material-icons-round text-[#13ecd6]">casino</span>
                <p class="text-[8px] font-black uppercase tracking-widest mt-1 text-[#13ecd6]">Juegos</p>
            </button>
            <button class="nav-item opacity-40" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p class="text-[8px] font-black uppercase tracking-widest mt-1">Perfil</p>
            </button>
        </div>
    </nav>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playCoinSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(2400, now);
            osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.4);
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc1.connect(gain1); gain1.connect(masterGain);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(440, now);
            gain2.gain.setValueAtTime(0.05, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc2.connect(gain2); gain2.connect(masterGain);

            osc1.start(); osc2.start();
            osc1.stop(now + 0.5); osc2.stop(now + 0.5);
        }

        function tossCoin() {
            const coin = document.getElementById('coin');
            const btn = document.getElementById('flip-btn');
            const label = document.getElementById('res-label');
            
            playCoinSound();
            btn.disabled = true;
            label.classList.add('opacity-0');
            label.classList.remove('scale-100', 'scale-150');
            
            coin.style.animation = 'none';
            void coin.offsetWidth; 
            
            const isHeads = Math.random() > 0.5;
            coin.classList.remove('flipping-heads', 'flipping-tails');
            
            setTimeout(() => {
                coin.classList.add(isHeads ? 'flipping-heads' : 'flipping-tails');
            }, 10);

            setTimeout(() => {
                label.innerText = isHeads ? '¡CARA!' : '¡CRUZ!';
                label.style.color = isHeads ? '#13ecd6' : '#a855f7';
                label.classList.remove('opacity-0');
                label.classList.add('scale-100');
                btn.disabled = false;
                if(window.SGRouter) SGRouter.showToast(isHeads ? 'RESULTADO: CARA' : 'RESULTADO: CRUZ', 'premium');
            }, 2000);
        }
    </script>
</div>
</body>
</html>
