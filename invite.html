<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Invitar Amigos | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        .share-btn {
            display: flex; align-items: center; gap: 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.5rem; padding: 1.25rem;
            cursor: pointer; transition: var(--transition-alpha); width: 100%;
        }
        .share-btn:active { transform: scale(.98); background: rgba(255,255,255,0.05); }
        
        .share-icon {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        
        .code-box {
            background: rgba(19,236,214,0.02);
            border: 2px dashed rgba(19,236,214,0.15);
            border-radius: 2rem; padding: 2rem; text-align: center;
        }
        
        .reward-chip {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
            border-radius: 999px; background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.2);
            font-size: 10px; font-weight: 900; color: #D4AF37;
            text-transform: uppercase; letter-spacing: .15em;
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: #13ecd6; }
    </style>
    <script src="engine/router.js"></script>
</head>
<body class="app-shell bg-black">
<div class="app-frame flex flex-col h-full">

    <header class="flex justify-between items-center p-6 shrink-0 sticky top-0 bg-black/80 backdrop-blur-xl z-50 border-b border-white/5">
        <div class="flex items-center gap-4">
            <button onclick="SGRouter.back()" class="size-11 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all border border-white/5">
                <span class="material-icons-round text-zinc-400 text-xl">arrow_back</span>
            </button>
            <div class="text-left">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.4em]">Protocolo Expansión</p>
                <h1 class="text-sm font-black font-['Space_Grotesk'] tracking-widest uppercase italic text-white leading-none">Invitar</h1>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-6 py-4 space-y-6 pb-32 no-scrollbar">
        
        <section class="glass-panel p-10 text-center space-y-4 reveal-node" style="border-color:rgba(212,175,55,0.15)">
            <div class="text-5xl mb-2">🎁</div>
            <div class="reward-chip">1 mes Premium gratis</div>
            <h2 class="text-3xl font-black font-['Space_Grotesk'] italic tracking-tighter text-white">Comparte y Gana</h2>
            <p class="text-zinc-500 text-xs leading-relaxed font-bold uppercase tracking-tight">
                Por cada amigo que complete su primer gasto grupal, ambos recibís <span class="text-[#D4AF37]">1 mes Premium</span>.
            </p>
        </section>

        <section class="code-box reveal-node" style="animation-delay: 0.1s">
            <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[.4em] mb-4">Tu código de Socio</p>
            <p class="text-4xl font-black font-['Space_Grotesk'] tracking-[0.2em] text-[#13ecd6] mb-6">SPLIT-4520</p>
            <button onclick="copyCode()" class="w-full py-4 rounded-2xl bg-[#13ecd6]/10 border border-[#13ecd6]/20 text-[#13ecd6] text-[10px] font-black uppercase tracking-widest hover:bg-[#13ecd6]/20 transition-all active:scale-95">
                <span class="material-icons-round text-sm align-middle mr-2">content_copy</span>
                Copiar código
            </button>
        </section>

        <section class="glass-panel p-6 space-y-4 reveal-node border-white/5" style="animation-delay: 0.2s">
            <div class="flex justify-between items-center">
                <p class="text-[9px] font-black uppercase tracking-widest text-zinc-400">Amigos invitados</p>
                <p class="text-[#13ecd6] font-black text-sm tech-font">2 / 5</p>
            </div>
            <div class="h-1.5 bg-white/5 rounded-full overflow-hidden">
                <div class="h-full rounded-full bg-gradient-to-r from-[#13ecd6] to-[#10b981]" style="width:40%"></div>
            </div>
            <p class="text-[9px] text-zinc-500 font-bold uppercase tracking-tight">
                Faltan 3 para <span class="text-[#FF9D42]">Socio Fundador Élite</span>
            </p>
        </section>

        <div class="space-y-3 reveal-node" style="animation-delay: 0.3s">
            <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[.4em] px-2">Canales de Difusión</p>

            <button class="share-btn" onclick="shareWhatsApp()">
                <div class="share-icon bg-[#25D366]/10 border border-[#25D366]/20">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                </div>
                <div class="flex-1 text-left">
                    <p class="font-black text-[11px] uppercase tracking-wider text-white">WhatsApp</p>
                    <p class="text-[9px] text-zinc-500 font-bold uppercase tracking-tighter">Envío directo de enlace</p>
                </div>
                <span class="material-icons-round text-zinc-700">chevron_right</span>
            </button>

            <button class="share-btn" onclick="shareGeneral()">
                <div class="share-icon bg-[#13ecd6]/10 border border-[#13ecd6]/20">
                    <span class="material-icons-round text-[#13ecd6] text-xl">share</span>
                </div>
                <div class="flex-1 text-left">
                    <p class="font-black text-[11px] uppercase tracking-wider text-white">Sistema Nativo</p>
                    <p class="text-[9px] text-zinc-500 font-bold uppercase tracking-tighter">Cualquier plataforma</p>
                </div>
                <span class="material-icons-round text-zinc-700">chevron_right</span>
            </button>
        </div>

        <p class="text-center text-[9px] text-zinc-700 px-8 leading-relaxed font-bold uppercase tracking-tighter pt-4">
            Máximo 5 premios acumulables. <button onclick="SGRouter.navigate('legal')" class="text-[#13ecd6] underline">Ver términos</button>
        </p>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-[100] bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>
</div>

<script>
    const inviteCode = 'SPLIT-4520';
    const inviteLink = `https://splitgasto.com/join/${inviteCode}`;
    const inviteMsg = `¡Únete a SplitGasto! Usa mi código ${inviteCode} y ambos conseguimos 1 mes Premium 🎉 → ${inviteLink}`;

    function copyCode() {
        navigator.clipboard.writeText(inviteCode).then(() => {
            if (window.SGRouter) SGRouter.showToast('CÓDIGO COPIADO 📋', 'success');
        }).catch(() => {
            alert('Código: ' + inviteCode);
        });
    }

    function shareWhatsApp() {
        window.open(`https://wa.me/?text=${encodeURIComponent(inviteMsg)}`, '_blank');
    }

    async function shareGeneral() {
        if (navigator.share) {
            try {
                await navigator.share({ title: 'SplitGasto', text: inviteMsg, url: inviteLink });
            } catch (err) {
                copyLinkManual();
            }
        } else {
            copyLinkManual();
        }
    }

    function copyLinkManual() {
        navigator.clipboard.writeText(inviteLink).then(() => {
            if (window.SGRouter) SGRouter.showToast('ENLACE COPIADO 🔗', 'success');
        });
    }
</script>
</body>
</html>
