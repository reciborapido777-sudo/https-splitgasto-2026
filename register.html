<!DOCTYPE html>
<html lang="es" class="app-shell" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Nueva Cuenta | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&display=swap');
        
        body { background:#000; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; overflow-x:hidden; }
        .tech-font { font-family: 'Space Grotesk', sans-serif; }

        .auth-input {
            width:100%; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
            border-radius:18px; padding:18px 22px; color:#fff; font-size:14px; font-weight:600;
            outline:none; transition:all .3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .auth-input:focus { border-color:#13ecd6; background:rgba(19,236,214,.03); box-shadow:0 0 20px rgba(19,236,214,0.1); }
        .auth-input::placeholder { color:#3f3f46; font-weight:400; }

        .auth-btn {
            width:100%; background:linear-gradient(135deg,#13ecd6,#10b981); border:none;
            border-radius:20px; padding:20px; color:#000; font-size:13px; font-weight:900;
            text-transform:uppercase; letter-spacing:.15em; cursor:pointer;
            transition:all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .auth-btn:active { transform:scale(.96); filter: brightness(1.2); }
        
        .glass-card { background:rgba(255,255,255,.01); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,.05); border-radius:2.5rem; }
        .orb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; opacity: 0.5; }
        
        label { font-size:9px; font-weight:900; text-transform:uppercase; letter-spacing:.25em; color:#52525b; display:block; margin-bottom:10px; padding-left: 8px; }
        
        .benefit-chip {
            display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.03);
            border:1px solid rgba(255,255,255,.05); border-radius:999px;
            padding:8px 14px; font-size:9px; font-weight:800; color:#a1a1aa; text-transform: uppercase;
        }

        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>

    <script src="engine/router.js" defer></script>
</head>
<body class="app-shell flex flex-col items-center justify-center px-6 relative bg-black">
<div class="app-frame w-full max-w-sm">

    <div class="orb" style="width:300px;height:300px;top:-80px;left:-80px;background:rgba(168,85,247,.12)"></div>
    <div class="orb" style="width:200px;height:200px;bottom:10%;right:-60px;background:rgba(19,236,214,.1)"></div>

    <div class="space-y-8 relative z-10 w-full">

        <button onclick="SGRouter.back()" class="flex items-center gap-3 text-zinc-500 hover:text-white transition-colors active:scale-90 group">
            <span class="material-icons-round text-lg">arrow_back</span>
            <span class="text-[10px] font-black uppercase tracking-[0.3em]">Volver</span>
        </button>

        <div class="text-center space-y-4 reveal-node">
            <div class="inline-flex size-20 rounded-3xl bg-gradient-to-br from-[#a855f7]/20 to-[#13ecd6]/10 border border-[#a855f7]/20 items-center justify-center mx-auto shadow-2xl">
                <span class="material-icons-round text-[#a855f7] text-4xl">person_add</span>
            </div>
            <div>
                <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.5em] mb-2">Protocolo de Acceso</p>
                <h1 class="text-3xl font-black tech-font italic uppercase tracking-tighter text-white">Iniciación Alpha</h1>
            </div>
        </div>

        <div class="flex gap-2 flex-wrap justify-center reveal-node" style="animation-delay: 0.1s">
            <span class="benefit-chip"><span class="material-icons-round text-[#13ecd6] text-sm">verified</span> Nivel Gratuito</span>
            <span class="benefit-chip"><span class="material-icons-round text-[#13ecd6] text-sm">security</span> AES-256</span>
            <span class="benefit-chip"><span class="material-icons-round text-[#13ecd6] text-sm">hub</span> 3 Nodos</span>
        </div>

        <div class="glass-card p-8 space-y-6 reveal-node shadow-2xl" style="animation-delay: 0.2s">
            <div>
                <label for="name">Nombre de Operador</label>
                <input id="name" type="text" class="auth-input" placeholder="IDENTIFICADOR..." autocomplete="name">
            </div>
            <div>
                <label for="email">Canal de Comunicación</label>
                <input id="email" type="email" class="auth-input" placeholder="EMAIL@DOMAIN.COM" autocomplete="email" inputmode="email">
            </div>
            <div>
                <label for="password">Código de Acceso</label>
                <div class="relative">
                    <input id="password" type="password" class="auth-input" placeholder="8+ CARACTERES" autocomplete="new-password">
                    <button type="button" onclick="togglePwd()" class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-600 hover:text-[#13ecd6] transition-colors">
                        <span class="material-icons-round text-xl" id="eye-icon">visibility</span>
                    </button>
                </div>
            </div>

            <div class="flex items-start gap-4 px-2">
                <div class="relative mt-1">
                    <input type="checkbox" id="terms" class="sr-only peer">
                    <div class="size-5 rounded-lg border-2 border-white/10 bg-white/5 peer-checked:bg-[#13ecd6] peer-checked:border-[#13ecd6] transition-all cursor-pointer flex items-center justify-center" onclick="this.previousElementSibling.click()">
                        <span class="material-icons-round text-black text-xs hidden peer-checked:block">check</span>
                    </div>
                </div>
                <label for="terms" class="normal-case text-[10px] text-zinc-500 font-bold leading-relaxed cursor-pointer m-0">
                    Confirmo los <button onclick="SGRouter.navigate('legal')" class="text-[#13ecd6] font-black uppercase tracking-tighter">Términos</button> y la <button onclick="SGRouter.navigate('legal')" class="text-[#13ecd6] font-black uppercase tracking-tighter">Privacidad</button>
                </label>
            </div>

            <button class="auth-btn tech-font" onclick="doRegister()">
                Generar Credenciales Alpha
            </button>
        </div>

        <p class="text-center text-[10px] font-bold text-zinc-600 uppercase tracking-widest reveal-node" style="animation-delay: 0.3s">
            ¿Ya posees acceso?
            <button onclick="SGRouter.navigate('auth')" class="text-[#13ecd6] font-black hover:text-white transition-colors ml-1 uppercase">
                Identificarse →
            </button>
        </p>
    </div>

    <script>
        function togglePwd() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            inp.type = inp.type === 'password' ? 'text' : 'password';
            icon.textContent = inp.type === 'password' ? 'visibility' : 'visibility_off';
        }
        
        function doRegister() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const pwd = document.getElementById('password').value;
            const terms = document.getElementById('terms').checked;

            if (!name || !email || !pwd) {
                SGRouter.showToast('PROTOCOL ERROR: Faltan datos', 'error');
                return;
            }
            if (!terms) {
                SGRouter.showToast('PROTOCOL ERROR: Acepta los términos', 'warning');
                return;
            }
            if (pwd.length < 8) {
                SGRouter.showToast('SECURITY ERROR: Clave insuficiente', 'error');
                return;
            }

            SGRouter.showToast('Identidad Alpha Creada ✓', 'success');
            // Redirección limpia v4.4
            setTimeout(() => SGRouter.navigate('onboarding'), 1000);
        }
    </script>
</div>
</body>
</html>
