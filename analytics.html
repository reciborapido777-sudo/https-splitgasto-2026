<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Métricas Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Gráficos Alpha: Densidad Visual Pura */
        .chart-frame { height: 280px; display: flex; align-items: flex-end; justify-content: space-around; padding-bottom: 25px; border-bottom: 1px solid var(--glass-border); }
        .bar-entity { 
            width: 45px; border-radius: 14px 14px 4px 4px; 
            animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            transform-origin: bottom; opacity: 0; transform: translateZ(0);
        }
        @keyframes growBar { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

        .bg-purple-deep { background: linear-gradient(to top, var(--purple-deep), rgba(168, 85, 247, 0.2)); }
        .bg-cyan-tech { background: linear-gradient(to top, var(--cian-tech), rgba(19, 236, 214, 0.2)); }

        /* Navigation Sync */
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: var(--cian-tech); }
    </style>

    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame">
    <div class="max-w-lg mx-auto px-4 py-6 space-y-8">
        
        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/60 backdrop-blur-xl z-50 -mx-4 px-4">
            <div class="flex items-center gap-4">
                <button onclick="SGRouter.back()" class="size-12 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all">
                    <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
                </button>
                <div>
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em]">Capital Intelligence</p>
                    <h1 class="text-xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Métricas</h1>
                </div>
            </div>
            <button onclick="SGRouter.navigate('dashboard')" class="px-4 py-2.5 glass-panel rounded-xl flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all">
                <span class="material-icons-round text-[#13ecd6] text-sm">dashboard</span>
                <span class="text-[9px] font-black uppercase tracking-widest text-zinc-400">Mando</span>
            </button>
        </header>

        <section class="glass-panel p-10 rounded-[3rem] space-y-10 reveal-node">
            <div class="space-y-2">
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.5em]">Crecimiento Trimestral</p>
                <h2 class="text-6xl font-black font-['Space_Grotesk'] tracking-tighter text-gradient-cyan money-display">+326,45€</h2>
            </div>

            <div class="chart-frame">
                <div class="flex flex-col items-center gap-4 w-full">
                    <div class="bar-entity bg-purple-deep" style="height: 110px; animation-delay: 0.1s"></div>
                    <span class="text-[8px] font-black text-zinc-600 uppercase">Ene</span>
                </div>
                <div class="flex flex-col items-center gap-4 w-full">
                    <div class="bar-entity bg-purple-deep" style="height: 165px; animation-delay: 0.2s"></div>
                    <span class="text-[8px] font-black text-zinc-600 uppercase">Feb</span>
                </div>
                <div class="flex flex-col items-center gap-4 w-full">
                    <div class="bar-entity bg-cyan-tech shadow-[0_0_30px_rgba(19,236,214,0.2)]" style="height: 240px; border: 1px solid rgba(19, 236, 214, 0.4); animation-delay: 0.3s"></div>
                    <span class="text-[8px] font-black text-white uppercase">Mar</span>
                </div>
            </div>
        </section>

        <main class="grid grid-cols-1 gap-4 reveal-node" style="animation-delay: 0.2s">
            <div onclick="SGRouter.navigate('vault')" class="glass-panel p-8 rounded-[2.5rem] border-[#a855f7]/15 bg-gradient-to-br from-[#a855f7]/5 to-transparent cursor-pointer hover:bg-white/5 transition-all">
                <div class="flex items-center gap-3 text-[#a855f7] mb-4">
                    <span class="material-icons-round">auto_awesome</span>
                    <h3 class="text-[10px] font-black font-['Space_Grotesk'] uppercase italic">Previsión Alpha</h3>
                </div>
                <p class="text-[11px] text-zinc-400 leading-relaxed font-bold uppercase tracking-tight">Ahorro estimado del <span class="text-white">12%</span> basado en flujo actual.</p>
            </div>
        </section>

        <section class="space-y-4 reveal-node" style="animation-delay:0.3s">
            <h2 class="text-lg font-black font-['Space_Grotesk'] uppercase italic tracking-tighter">Gasto por Nodo</h2>
            <div class="glass-panel p-6 rounded-[2rem] flex items-center gap-5">
                <div class="size-12 rounded-2xl bg-[#FF9D42]/10 flex items-center justify-center border border-[#FF9D42]/20 flex-shrink-0">
                    <span class="material-icons-round text-[#FF9D42]">restaurant</span>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between mb-2">
                        <p class="text-[9px] font-black uppercase text-zinc-500">Gastronomía</p>
                        <p class="text-[10px] font-black text-white money-display">312,40€</p>
                    </div>
                    <div class="h-1 bg-white/5 rounded-full overflow-hidden">
                        <div class="h-full bg-[#FF9D42] rounded-full" style="width:37%"></div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>
</div>
</body>
</html>
