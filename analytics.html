<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Plus+Jakarta+Sans:wght=800&family=Space_Grotesk:wght@500;700;900&display=swap');
        
        body {  
            background: #000; color: #fff; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden !important; width: 100% !important; margin: 0; padding: 0;
            box-sizing: border-box; touch-action: manipulation; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0);
        }

        .text-gradient-cyan { 
            background: linear-gradient(135deg, #13ecd6 0%, #10b981 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            display: inline-block;
            padding-right: 0.55em !important;
        }

        .chart-frame {
            height: 280px; display: flex; align-items: flex-end;
            justify-content: space-around; padding-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .bar-entity {
            width: 45px; border-radius: 14px 14px 4px 4px;
            animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: bottom; opacity: 0;
            transform: translateZ(0);
            will-change: transform;
        }

        @keyframes growBar { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

        .bg-purple-deep { background: linear-gradient(to top, #a855f7, rgba(168, 85, 247, 0.2)); }
        .bg-cyan-tech { background: linear-gradient(to top, #13ecd6, rgba(19, 236, 214, 0.2)); }

        .reveal-node { animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
        .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
        .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
        .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
        .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}

        .cat-icon-restaurant { background: rgba(255,157,66,0.1); border: 1px solid rgba(255,157,66,0.2); }
        .cat-icon-flight { background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.2); }
        .cat-icon-cart { background: rgba(19,236,214,0.1); border: 1px solid rgba(19,236,214,0.2); }
        .cat-icon-bolt { background: rgba(113,113,122,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .cat-icon-default { background: rgba(113,113,122,0.15); border: 1px solid rgba(255,255,255,0.05); }
</style>

    <script>
    (function() {
        // === AUTH GUARD ===
        if (!SGAuth || !SGAuth.isLoggedIn()) {
            SGRouter.showToast('Inicia sesión primero', 'error');
            setTimeout(function() { SGRouter.navigate('auth-login'); }, 1500);
            return;
        }

        const CATEGORY_MAP = {
            'food':          { icon: 'restaurant',    label: 'Gastronomía', color: '#FF9D42', iconClass: 'cat-icon-restaurant' },
            'transport':     { icon: 'directions_car', label: 'Transporte',  color: '#a855f7', iconClass: 'cat-icon-flight' },
            'travel':        { icon: 'flight',        label: 'Viajes',      color: '#a855f7', iconClass: 'cat-icon-flight' },
            'shopping':      { icon: 'shopping_cart',  label: 'Compras',     color: '#13ecd6', iconClass: 'cat-icon-cart' },
            'groceries':     { icon: 'shopping_cart',  label: 'Alimentación',color: '#13ecd6', iconClass: 'cat-icon-cart' },
            'entertainment': { icon: 'movie',         label: 'Ocio',        color: '#FF9D42', iconClass: 'cat-icon-restaurant' },
            'bills':         { icon: 'bolt',          label: 'Suministros',  color: '#71717a', iconClass: 'cat-icon-bolt' },
            'health':        { icon: 'local_hospital',label: 'Salud',       color: '#f43f5e', iconClass: 'cat-icon-default' },
            'other':         { icon: 'category',      label: 'Otros',       color: '#71717a', iconClass: 'cat-icon-default' }
        };

        function getCatMeta(cat) {
            return CATEGORY_MAP[cat] || CATEGORY_MAP['other'];
        }

        function formatMoney(val) {
            var abs = Math.abs(val);
            var formatted = abs.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return (val < 0 ? '-' : '+') + formatted + '€';
        }

        function renderCategories(expenses) {
            var container = document.getElementById('categories-container');
            if (!container) return;

            var catTotals = {};
            var grandTotal = 0;
            (expenses || []).forEach(function(exp) {
                var cat = exp.category || 'other';
                var amt = parseFloat(exp.amount) || 0;
                catTotals[cat] = (catTotals[cat] || 0) + amt;
                grandTotal += amt;
            });

            var entries = Object.entries(catTotals).sort(function(a, b) { return b[1] - a[1]; });

            if (entries.length === 0) {
                container.innerHTML = '<p class="text-zinc-600 text-[10px] font-black uppercase tracking-widest col-span-2 text-center py-8">Sin gastos registrados</p>';
                return;
            }

            var html = '';
            entries.forEach(function(entry) {
                var cat = entry[0];
                var total = entry[1];
                var meta = getCatMeta(cat);
                var pct = grandTotal > 0 ? Math.round((total / grandTotal) * 100) : 0;
                html += '<div class="glass-panel p-6 rounded-[2rem] flex items-center gap-5">' +
                    '<div class="size-12 rounded-2xl ' + meta.iconClass + ' flex items-center justify-center flex-shrink-0">' +
                        '<span class="material-icons-round" style="color:' + meta.color + '">' + meta.icon + '</span>' +
                    '</div>' +
                    '<div class="flex-1">' +
                        '<div class="flex justify-between mb-2">' +
                            '<p class="text-[10px] font-black uppercase text-zinc-400 tracking-widest">' + meta.label + '</p>' +
                            '<p class="text-[10px] font-black text-white money-display">' + total.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + '€</p>' +
                        '</div>' +
                        '<div class="h-1.5 bg-white/5 rounded-full overflow-hidden">' +
                            '<div class="h-full rounded-full" style="width:' + pct + '%;background:' + meta.color + '"></div>' +
                        '</div>' +
                        '<p class="text-[8px] text-zinc-700 uppercase mt-1">' + pct + '% del gasto total</p>' +
                    '</div>' +
                '</div>';
            });
            container.innerHTML = html;
        }

        function renderChart(expenses) {
            var chartEl = document.getElementById('chart-container');
            if (!chartEl) return;

            // Agrupar gastos por mes
            var monthTotals = {};
            var monthLabels = { '01': 'Ene', '02': 'Feb', '03': 'Mar', '04': 'Abr', '05': 'May', '06': 'Jun', '07': 'Jul', '08': 'Ago', '09': 'Sep', '10': 'Oct', '11': 'Nov', '12': 'Dic' };

            (expenses || []).forEach(function(exp) {
                var d = (exp.created_at || exp.date || '').substring(0, 7); // "2026-03"
                if (d) {
                    monthTotals[d] = (monthTotals[d] || 0) + (parseFloat(exp.amount) || 0);
                }
            });

            var months = Object.keys(monthTotals).sort();
            if (months.length === 0) {
                chartEl.innerHTML = '<p class="text-zinc-600 text-[10px] font-black uppercase tracking-widest self-center">Sin datos para gráfico</p>';
                return;
            }

            var maxVal = Math.max.apply(null, months.map(function(m) { return monthTotals[m]; }));
            if (maxVal === 0) maxVal = 1;

            var html = '';
            months.forEach(function(m, i) {
                var val = monthTotals[m];
                var h = Math.max(30, Math.round((val / maxVal) * 220));
                var monthNum = m.split('-')[1];
                var label = monthLabels[monthNum] || monthNum;
                var isLast = i === months.length - 1;
                var barClass = isLast ? 'bg-cyan-tech shadow-[0_0_40px_rgba(19,236,214,0.3)]' : 'bg-purple-deep';
                var borderStyle = isLast ? 'border:1px solid rgba(19,236,214,0.4)' : '';
                var labelColor = isLast ? 'text-white' : 'text-zinc-600';

                html += '<div class="flex flex-col items-center gap-6 w-full">' +
                    '<div class="bar-entity ' + barClass + '" style="height:' + h + 'px;animation-delay:' + (0.1 * (i + 1)) + 's;' + borderStyle + '"></div>' +
                    '<span class="text-[9px] font-black ' + labelColor + ' uppercase tracking-widest">' + label + '</span>' +
                '</div>';
            });
            chartEl.innerHTML = html;
        }

        function renderMembers(balancesData) {
            var container = document.getElementById('members-container');
            if (!container) return;

            var list = [];
            if (Array.isArray(balancesData)) {
                list = balancesData;
            } else if (balancesData && typeof balancesData === 'object') {
                if (Array.isArray(balancesData.balances)) {
                    list = balancesData.balances;
                } else {
                    Object.keys(balancesData).forEach(function(key) {
                        if (key === 'success' || key === 'group_id') return;
                        var val = parseFloat(balancesData[key]);
                        if (!isNaN(val)) {
                            list.push({ name: key, balance: val });
                        }
                    });
                }
            }

            if (list.length === 0) {
                container.innerHTML = '<p class="text-zinc-600 text-[10px] font-black uppercase tracking-widest text-center py-4">Sin balances pendientes</p>';
                return;
            }

            var html = '';
            list.forEach(function(b) {
                var name = b.name || b.user_name || b.userName || String(b.user_id || b.userId || 'Socio');
                var amount = parseFloat(b.balance || b.amount || 0);
                var isPositive = amount >= 0;
                var initials = name.substring(0, 2).toUpperCase();
                var barColor = isPositive ? 'background:linear-gradient(90deg,#13ecd6,#10b981)' : 'background:#FF9D42';
                var amtColor = isPositive ? '#13ecd6' : '#FF9D42';
                var barWidth = Math.min(Math.abs(amount) > 0 ? Math.max(10, Math.round((Math.abs(amount) / 200) * 100)) : 0, 100);
                var label = isPositive ? ' neto' : ' pendiente';

                html += '<div class="flex items-center gap-4">' +
                    '<img src="https://api.dicebear.com/9.x/initials/svg?seed=' + encodeURIComponent(initials) + '&backgroundColor=1a2a1a&fontFamily=Arial&fontSize=40" class="size-10 rounded-xl border border-white/10">' +
                    '<div class="flex-1">' +
                        '<div class="flex justify-between mb-1.5">' +
                            '<p class="text-[10px] font-black uppercase text-zinc-400">' + name + '</p>' +
                            '<p class="text-[10px] font-black money-display" style="color:' + amtColor + '">' + formatMoney(amount) + label + '</p>' +
                        '</div>' +
                        '<div class="h-1.5 bg-white/5 rounded-full overflow-hidden">' +
                            '<div class="h-full rounded-full" style="width:' + barWidth + '%;' + barColor + '"></div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            });
            container.innerHTML = html;
        }
 
        // === CARGA PRINCIPAL ===
        async function loadAnalytics() {
            try {
                // 1. Cargar grupos del usuario
                var groupsResult = await SGApi.getGroups();
                var groups = [];
                if (groupsResult && groupsResult.success && groupsResult.groups) {
                    groups = groupsResult.groups;
                }

                if (groups.length === 0) {
                    document.getElementById('total-balance').textContent = formatMoney(0);
                    document.getElementById('chart-container').innerHTML = '<p class="text-zinc-600 text-[10px] font-black uppercase tracking-widest self-center">Únete a un grupo para ver métricas</p>';
                    document.getElementById('categories-container').innerHTML = '<p class="text-zinc-600 text-[10px] font-black uppercase tracking-widest col-span-2 text-center py-8">Sin gastos registrados</p>';
                    document.getElementById('members-container').innerHTML = '<p class="text-zinc-600 text-[10px] font-black uppercase tracking-widest text-center py-4">Sin balances pendientes</p>';
                    return;
                }

                // 2. Cargar gastos y balances de TODOS los grupos
                var allExpenses = [];
                var allBalances = {};
                var netBalance = 0;

                for (var i = 0; i < groups.length; i++) {
                    var gid = groups[i].id || groups[i].group_id;

                    try {
                        var expResult = await SGApi.getExpenses(gid);
                        if (expResult && expResult.success && expResult.expenses) {
                            allExpenses = allExpenses.concat(expResult.expenses);
                        }
                    } catch(e) {}

                    try {
                        var balResult = await SGApi.getBalances(gid);
                        if (balResult) {
                            if (Array.isArray(balResult.balances)) {
                                balResult.balances.forEach(function(b) {
                                    var key = b.name || b.user_name || b.user_id || 'unknown';
                                    allBalances[key] = (allBalances[key] || 0) + parseFloat(b.balance || b.amount || 0);
                                });
                            } else {
                                Object.keys(balResult).forEach(function(k) {
                                    if (k === 'success' || k === 'group_id') return;
                                    var val = parseFloat(balResult[k]);
                                    if (!isNaN(val)) allBalances[k] = (allBalances[k] || 0) + val;
                                });
                            }
                        }
                    } catch(e) {}
                }

                // 3. Calcular balance neto
                Object.keys(allBalances).forEach(function(k) { netBalance += allBalances[k]; });

                // 4. Renderizar
                document.getElementById('total-balance').textContent = formatMoney(netBalance);
                renderChart(allExpenses);
                renderCategories(allExpenses);
                renderMembers(allBalances);

                // 5. Previsión
                var forecastEl = document.getElementById('forecast-text');
                if (forecastEl && allExpenses.length > 0) {
                    var totalExp = allExpenses.reduce(function(s, e) { return s + (parseFloat(e.amount) || 0); }, 0);
                    var uniqueMonths = new Set(allExpenses.map(function(e) { return (e.created_at || e.date || '').substring(0,7); }));
                    var saving = Math.round((totalExp / Math.max(1, uniqueMonths.size)) * 0.12);
                    forecastEl.innerHTML = 'El sistema estima un ahorro de <span class="text-white">' + saving.toLocaleString('es-ES') + '€</span> mensuales basado en su flujo de liquidación actual.';
                } else if (forecastEl) {
                    forecastEl.textContent = 'Datos insuficientes para generar previsión.';
                }

            } catch (e) {
                console.error('[Analytics] Load error:', e);
                document.getElementById('total-balance').textContent = 'Error';
            }
        }

        loadAnalytics();
    })();
    </script>
  
        <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
</div>
</body>
