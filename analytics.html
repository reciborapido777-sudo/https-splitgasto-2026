<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Métricas Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Gráficos Alpha: Densidad Visual Pura */
        .chart-frame { 
            height: 280px; display: flex; align-items: flex-end; 
            justify-content: space-around; padding-bottom: 25px; 
            border-bottom: 1px solid var(--glass-border); 
        }
        .bar-entity { 
            width: 45px; border-radius: 14px 14px 4px 4px; 
            animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            transform-origin: bottom; opacity: 0; transform: translateZ(0);
        }
        @keyframes growBar { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

        .bg-purple-gradient { background: linear-gradient(to top, var(--purple-deep), rgba(168, 85, 247, 0.1)); }
        .bg-cyan-gradient { background: linear-gradient(to top, var(--cian-tech), rgba(19, 236, 214, 0.1)); }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: var(--cian-tech); }
    </style>

    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame flex flex-col h-full">

    <header class="flex justify-between items-center p-6 shrink-0 sticky top-0 bg-black/80 backdrop-blur-xl z-50">
        <div class="flex items-center gap-4">
            <button onclick="SGRouter.back()" class="size-11 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all">
                <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
            </button>
            <div class="text-left">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.4em]">Capital Intelligence</p>
                <h1 class="text-sm font-black font-['Space_Grotesk'] tracking-widest uppercase italic text-white leading-none">Métricas</h1>
            </div>
        </div>
        <button onclick="SGRouter.navigate('dashboard')" class="px-4 py-2.5 glass-panel rounded-xl flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all border-white/5">
            <span class="material-icons-round text-[#13ecd6] text-sm">dashboard</span>
            <span class="text-[9px] font-black uppercase tracking-widest text-zinc-400">Mando</span>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto px-6 py-4 space-y-8 pb-28">

        <section class="glass-panel p-10 rounded-[3.5rem] space-y-10 reveal-node">
            <div class="space-y-2">
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.5em]">Crecimiento Alpha</p>
                <h2 class="text-5xl font-black font-['Space_Grotesk'] tracking-tighter italic text-white money-display">+326,45€</h2>
            </div>

            <div class="chart-frame">
                <div class="flex flex-col items-center gap-4 w-full">
                    <div class="bar-entity bg-purple-gradient" style="height: 110px; animation-delay: 0.1s"></div>
                    <span class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Ene</span>
                </div>
                <div class="flex flex-col items-center gap-4 w-full">
                    <div class="bar-entity bg-purple-gradient" style="height: 165px; animation-delay: 0.2s"></div>
                    <span class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Feb</span>
                </div>
                <div class="flex flex-col items-center gap-4 w-full">
                    <div class="bar-entity bg-cyan-gradient shadow-[0_0_30px_rgba(19,236,214,0.15)]" style="height: 240px; border: 1px solid rgba(19, 236, 214, 0.4); animation-delay: 0.3s"></div>
                    <span class="text-[8px] font-black text-[#13ecd6] uppercase tracking-widest">Mar</span>
                </div>
            </div>
        </section>

        <div onclick="SGRouter.navigate('vault')" class="glass-panel p-8 rounded-[2.5rem] border-[#a855f7]/15 bg-gradient-to-br from-[#a855f7]/5 to-transparent cursor-pointer reveal-node" style="animation-delay: 0.4s">
            <div class="flex items-center gap-3 text-[#a855f7] mb-4">
                <span class="material-icons-round">auto_awesome</span>
                <h3 class="text-[10px] font-black font-['Space_Grotesk'] uppercase italic tracking-widest">Previsión Alpha</h3>
            </div>
            <p class="text-[11px] text-zinc-400 leading-relaxed font-bold uppercase tracking-tight">
                Ahorro estimado del <span class="text-white">12%</span> basado en flujo actual detectado por el motor IA.
            </p>
        </div>

        <section class="space-y-5 reveal-node" style="animation-delay:0.5s">
            <h2 class="text-sm font-black font-['Space_Grotesk'] uppercase italic tracking-widest px-2">Gasto por Nodo</h2>
            <div class="glass-panel p-6 rounded-[2rem] flex items-center gap-6">
                <div class="size-12 rounded-2xl bg-[#FF9D42]/10 flex items-center justify-center border border-[#FF9D42]/20 flex-shrink-0">
                    <span class="material-icons-round text-[#FF9D42]">restaurant</span>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between mb-3">
                        <p class="text-[9px] font-black uppercase text-zinc-500 tracking-widest">Gastronomía</p>
                        <p class="text-sm font-black text-white font-['Space_Grotesk']">312,40€</p>
                    </div>
                    <div class="h-1.5 bg-white/5 rounded-full overflow-hidden">
                        <div class="h-full bg-[#FF9D42] rounded-full shadow-[0_0_10px_rgba(255,157,66,0.2)]" style="width:37%"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item active">
                <span class="material-icons-round">auto_stories</span>
                <p>Bóveda</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>
</div>
</body>
</html>
