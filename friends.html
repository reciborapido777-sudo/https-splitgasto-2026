<!DOCTYPE html>
<html lang="es" style="background-color:#000">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Amigos | SplitGasto 2026</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SplitGasto">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@700;900&display=swap');
        html,body{ background:#000;color:#fff;font-family:'Inter',sans-serif;margin:0;padding:0;overscroll-behavior:contain; touch-action: manipulation; }
        .glass-panel{background:rgba(255,255,255,.02);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:20px}
        .friend-card{background:#0a0a0a;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s}
        .friend-card:active{transform:scale(.98)}
        .friend-card:hover{background:#111}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
        .nav-item span{font-size:20px;color:#4a4a4a;transition:color .2s}
        .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
        .nav-item.active span,.nav-item.active p{color:#13ecd6}
        .nav-item:hover span,.nav-item:hover p{color:#fff}
        .balance-pos{color:#13ecd6}
        .balance-neg{color:#FF9D42}
        .balance-zero{color:#4a4a4a}
        .search-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:14px 16px 14px 46px;color:#fff;font-size:14px;font-weight:500;outline:none;transition:border-color .3s;box-sizing:border-box}
        .search-input:focus{border-color:rgba(19,236,214,.3)}
        .search-input::placeholder{color:#3a3a3a}
    </style>

    <script src="engine/desktop-fix.js" defer></script>
    <script src="engine/router.js" defer></script>
    <script src="engine/auth.js"></script>
    <script src="engine/api.js"></script>
    <script src="engine/i18n.js" defer></script>
</head>
<body class="app-shell pb-28">
<div class="app-frame">
    <div class="max-w-lg mx-auto px-4 py-6 space-y-5">

        <header class="flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-xl z-50 -mx-4 px-4 py-3">
            <button onclick="SGRouter.back()" class="size-11 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all">
                <span class="material-icons-round text-zinc-400">arrow_back_ios</span>
            </button>
            <div class="text-center">
                <h1 class="text-sm font-black uppercase tracking-wider">Mis Amigos</h1>
                <p class="text-[9px] text-zinc-500" id="friends-count-subtitle">Cargando...</p>
            </div>
            <button onclick="SGRouter.navigate('invite','friends')" class="size-11 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all">
                <span class="material-icons-round text-[#13ecd6]">person_add</span>
            </button>
        </header>

        <div class="relative">
            <span class="material-icons-round absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600 text-lg">search</span>
            <input type="search" class="search-input" placeholder="Buscar amigo..." inputmode="search">
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="glass-panel p-4 text-center">
                <p class="text-[#13ecd6] text-lg font-black font-['Space_Grotesk']">+0,00€</p>
                <p class="text-[9px] text-zinc-500 uppercase tracking-wider mt-1">Te deben</p>
            </div>
            <div class="glass-panel p-4 text-center">
                <p class="text-[#FF9D42] text-lg font-black font-['Space_Grotesk']">-0,00€</p>
                <p class="text-[9px] text-zinc-500 uppercase tracking-wider mt-1">Debes</p>
            </div>
            <div class="glass-panel p-4 text-center">
                <p class="text-white text-lg font-black font-['Space_Grotesk']">0</p>
                <p class="text-[9px] text-zinc-500 uppercase tracking-wider mt-1">Amigos</p>
            </div>
        </div>

        <div id="friends-container" class="space-y-2">
            <p class="text-xs text-zinc-600 text-center py-6" id="friends-loading">Cargando amigos…</p>
        </div>

        <div class="glass-panel p-5 border-dashed border-[#13ecd6]/20 text-center space-y-3" style="border-style:dashed">
            <span class="material-icons-round text-[#13ecd6] text-3xl">group_add</span>
            <div>
                <p class="font-bold text-sm">Invita a tus amigos</p>
                <p class="text-[11px] text-zinc-500 mt-1">Gana 1 mes Premium por cada amigo que se una</p>
            </div>
            <button onclick="SGRouter.navigate('invite','friends')" class="w-full py-3 rounded-2xl bg-[#13ecd6]/10 border border-[#13ecd6]/20 text-[#13ecd6] text-[11px] font-black uppercase tracking-wider hover:bg-[#13ecd6]/20 transition-all active:scale-95">
                Invitar amigos →
            </button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p data-i18n="nav.dashboard">Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p data-i18n="nav.groups">Grupos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p data-i18n="nav.expenses">Gastos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p data-i18n="nav.metrics">Métricas</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p data-i18n="nav.profile">Perfil</p>
            </button>
        </div>
    </nav>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!SGAuth || !SGAuth.isLoggedIn()) {
        SGRouter.showToast(t('activity.loginRequired', null, 'Inicia sesión primero'), 'error');
        setTimeout(() => SGRouter.navigate('auth-login'), 1500);
        return;
      }
      
      const container = document.getElementById('friends-container');
      const loadingEl = document.getElementById('friends-loading');
      const myUid = SGAuth.getUserId();
      
      try {
        const groupsRes = await SGApi.getGroups();
        if (!groupsRes?.success || !groupsRes.groups?.length) {
          if (container) container.innerHTML = '<p class="text-xs text-zinc-600 text-center py-6">Sin grupos todavía</p>';
          document.getElementById('friends-count-subtitle').textContent = '0 contactos';
          return;
        }
        
        const groups = groupsRes.groups;
        
        // Cargar miembros y balances de todos los grupos en paralelo
        const allData = await Promise.all(groups.map(g => Promise.all([
          SGApi.getGroupMembers(g.id).catch(() => null),
          SGApi.getBalances(g.id).catch(() => null)
        ])));
        
        const friendMap = new Map();
        
        groups.forEach((g, idx) => {
          const [memRes, balRes] = allData[idx];
          const members = (memRes?.success && memRes.members) ? memRes.members : [];
          const balances = (balRes?.success && balRes.balances) ? balRes.balances : {};
          
          members.forEach(m => {
            if (!m.id || String(m.id) === String(myUid)) return;
            
            if (!friendMap.has(m.id)) {
              friendMap.set(m.id, {
                id: m.id,
                name: m.name || 'Socio',
                initials: (m.name || 'SG').slice(0, 2).toUpperCase(),
                totalBalance: 0,
                groupCount: 0,
                lastGroup: g.name,
                lastGroupId: g.id
              });
            }
            
            const f = friendMap.get(m.id);
            f.groupCount += 1;
            const bal = parseFloat(balances[m.id]) || 0;
            f.totalBalance += bal;
          });
        });
        
        const friends = Array.from(friendMap.values());
        document.getElementById('friends-count-subtitle').textContent = `${friends.length} contacto${friends.length!==1?'s':''}`;
        
        const withDebt = friends.filter(f => Math.abs(f.totalBalance) > 0.01);
        const noDebt = friends.filter(f => Math.abs(f.totalBalance) <= 0.01);
        
        // Actualizar chips resumen
        const totalOwed = friends.reduce((s, f) => f.totalBalance > 0 ? s + f.totalBalance : s, 0);
        const totalDue = friends.reduce((s, f) => f.totalBalance < 0 ? s + Math.abs(f.totalBalance) : s, 0);
        
        const chips = document.querySelectorAll('.grid.grid-cols-3 .text-lg');
        if (chips[0]) chips[0].textContent = '+' + totalOwed.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + '€';
        if (chips[1]) chips[1].textContent = '-' + totalDue.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + '€';
        if (chips[2]) chips[2].textContent = friends.length;
        
        function renderFriendCard(f) {
          const isPositive = f.totalBalance > 0.01;
          const isNegative = f.totalBalance < -0.01;
          const balClass = isPositive ? 'balance-pos' : (isNegative ? 'balance-neg' : 'balance-zero');
          const balLabel = isPositive ? 'te debe' : (isNegative ? 'debes' : 'saldo');
          const balSign = isPositive ? '+' : (isNegative ? '-' : '');
          const absBal = Math.abs(f.totalBalance).toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + '€';
          
          const bgColors = ['1a2a1a','0d1f2d','1a0d1f','1a1a0d','0d1a1a'];
          const bg = bgColors[Math.abs(f.name.charCodeAt(0)) % bgColors.length];
          
          return `
            <div class="friend-card" onclick="window.location.href='liquidation.html?groupId=${encodeURIComponent(f.lastGroupId)}&to=${encodeURIComponent(f.id)}&amount=${encodeURIComponent(Math.abs(f.totalBalance).toFixed(2))}'">
              <img src="https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(f.initials)}&backgroundColor=${bg}&fontSize=40" class="size-11 rounded-xl" alt="">
              <div class="flex-1">
                <p class="font-bold text-sm">${f.name}</p>
                <p class="text-[10px] text-zinc-500">${f.lastGroup} · ${f.groupCount} grupo${f.groupCount!==1?'s':''}</p>
              </div>
              <div class="text-right">
                <p class="font-black text-sm ${balClass}">${balSign}${absBal}</p>
                <p class="text-[9px] text-zinc-600">${balLabel}</p>
              </div>
            </div>`;
        }
        
        let html = '';
        if (withDebt.length > 0) {
          html += `<p class="text-[9px] font-black text-zinc-600 uppercase tracking-[.4em] px-1">Deudas Pendientes</p>`;
          html += withDebt.map(renderFriendCard).join('');
        }
        if (noDebt.length > 0) {
          html += `<p class="text-[9px] font-black text-zinc-600 uppercase tracking-[.4em] px-1 pt-4">Sin deudas</p>`;
          html += noDebt.map(renderFriendCard).join('');
        }
        
        if (friends.length === 0) {
          html = '<p class="text-xs text-zinc-600 text-center py-6">No hay otros socios en tus grupos</p>';
        }
        
        if (container) container.innerHTML = html;
      } catch (e) {
        console.error('Friends load error:', e);
        if (container) container.innerHTML = '<p class="text-xs text-zinc-600 text-center py-6">Error al cargar amigos</p>';
      }
    });
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
</div>
</body>
</html>
