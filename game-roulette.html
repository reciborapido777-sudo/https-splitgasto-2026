<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Ruleta Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        #roulette-wrapper {
            position: relative; width: 320px; height: 320px;
            margin: 0 auto; perspective: 1200px;
        }
        #wheel-3d {
            width: 100%; height: 100%; transform-style: preserve-3d;
            transform: rotateX(20deg); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        canvas#wheel {
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.05);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.15);
        }
        #pointer {
            position: absolute; top: -20px; left: 50%;
            transform: translateX(-50%); z-index: 50;
            filter: drop-shadow(0 0 15px var(--cian-tech));
        }
        .spin-btn {
            background: linear-gradient(135deg, var(--cian-tech) 0%, #0dbfb0 100%);
            color: #000; font-weight: 900; letter-spacing: 0.25em;
            box-shadow: 0 10px 40px rgba(19, 236, 214, 0.25);
            transition: var(--transition-alpha);
        }
        .spin-btn:active { transform: scale(0.94) rotate(-1deg); }
        .spin-btn:disabled { opacity: 0.5; filter: grayscale(1); }
    </style>
    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame">
    <div class="max-w-lg mx-auto px-4 py-6 space-y-10">

        <header class="flex justify-between items-center py-4">
            <button onclick="SGRouter.back()" class="size-12 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all">
                <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
            </button>
            <div class="text-center">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.4em]">Protocolo de Azar</p>
                <h1 class="text-lg font-black font-['Space_Grotesk'] tracking-widest uppercase italic text-white">Ruleta Alpha</h1>
            </div>
            <div class="size-12"></div>
        </header>

        <section class="flex flex-col items-center py-4 reveal-node">
            <div id="roulette-wrapper">
                <div id="pointer">
                    <svg width="32" height="32" viewBox="0 0 32 32">
                        <path d="M16 0 L30 24 L16 18 L2 24 Z" fill="#13ecd6"/>
                    </svg>
                </div>
                <div id="wheel-3d">
                    <canvas id="wheel" width="320" height="320"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-6 mt-12 w-full glass-panel p-6 rounded-[2.5rem] text-center border-[#a855f7]/10">
                <div>
                    <p class="text-xl font-black font-['Space_Grotesk'] text-[#13ecd6]" id="spin-count">0</p>
                    <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Giros</p>
                </div>
                <div class="border-x border-white/5">
                    <p class="text-xl font-black font-['Space_Grotesk'] text-white" id="last-winner">—</p>
                    <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Último</p>
                </div>
                <div>
                    <p class="text-xl font-black font-['Space_Grotesk'] text-[#FF9D42]">84,20€</p>
                    <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest">En Juego</p>
                </div>
            </div>
        </section>

        <button id="spin-btn" class="spin-btn w-full py-6 rounded-[2rem] reveal-node" onclick="spinWheel()">
            <span class="flex items-center justify-center gap-3">
                <span class="material-icons-round">bolt</span>
                EJECUTAR GIRO ALPHA
            </span>
        </button>
    </div>

    <script>
        const players = [
            {name:'Commander', color:'#13ecd6'}, {name:'Mario', color:'#a855f7'},
            {name:'Elena', color:'#FF9D42'}, {name:'Sofia', color:'#ec4899'}
        ];
        let currentAngle = 0;
        let isSpinning = false;
        let spinCounter = 0;
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');

        // Motor Sónico Alpha
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClick(vol = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playWin() {
            [440, 554, 659].forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i*0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i*0.1 + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i*0.1); osc.stop(audioCtx.currentTime + i*0.1 + 0.3);
            });
        }

        function drawWheel(angle = 0) {
            ctx.clearRect(0,0,320,320);
            const slice = (Math.PI*2)/players.length;
            players.forEach((p, i) => {
                const start = angle + i * slice;
                ctx.beginPath();
                ctx.moveTo(160, 160);
                ctx.arc(160, 160, 155, start, start + slice);
                ctx.fillStyle = p.color + '15';
                ctx.fill();
                ctx.strokeStyle = p.color + '40';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(160 + Math.cos(start + slice/2)*110, 160 + Math.sin(start + slice/2)*110);
                ctx.rotate(start + slice/2 + Math.PI/2);
                ctx.fillStyle = p.color;
                ctx.font = '900 12px Space Grotesk';
                ctx.textAlign = 'center';
                ctx.fillText(p.name.toUpperCase(), 0, 0);
                ctx.restore();
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            
            const winnerIdx = Math.floor(Math.random() * players.length);
            const slice = (Math.PI*2)/players.length;
            const extraSpins = (Math.PI*2*8);
            const targetAngle = extraSpins + (Math.PI*1.5 - (winnerIdx*slice + slice/2));
            
            const startTime = performance.now();
            const duration = 4000;
            let lastClickAngle = 0;

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - t, 4);
                const currentPos = targetAngle * ease;
                
                drawWheel(currentPos);

                // Lógica de sonido: Clic cada vez que pasa un sector
                const currentAngleMod = currentPos % (Math.PI * 2);
                if (Math.abs(currentAngleMod - lastClickAngle) > slice) {
                    playClick(0.15 * (1 - t)); // El sonido se debilita al frenar
                    lastClickAngle = currentAngleMod;
                }

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById('spin-btn').disabled = false;
                    spinCounter++;
                    document.getElementById('spin-count').innerText = spinCounter;
                    document.getElementById('last-winner').innerText = players[winnerIdx].name;
                    playWin();
                    if(window.SGRouter) SGRouter.showToast(`OBJETIVO: ${players[winnerIdx].name}`, 'premium');
                }
            }
            requestAnimationFrame(animate);
        }
        drawWheel(0);
    </script>
</div>
</body>
</html>
