<style>
  :root { --cyan:#13ecd6; --purple:#a855f7; --orange:#FF9D42; }
  * { font-family:'Manrope',sans-serif; box-sizing:border-box; }
  body { background:#0a0a0a; min-height:100dvh; overflow-x:hidden; }

  /* 3D Canvas Wrapper */
  #roulette-wrapper {
    position:relative;
    width:320px; height:360px;   /* extra height for pointer above */
    margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
  }
  /* Static pointer — sits above the wheel, NOT inside 3D container */
  #pointer-wrap {
    position:relative;
    z-index:20;
    margin-bottom:-6px;
  }
  #wheel-3d {
    width:300px; height:300px;
    position:relative;
    perspective:700px;
    transform-style:preserve-3d;
    transform: rotateX(18deg);
    transition: transform 0.3s ease;
    flex-shrink:0;
  }
  canvas#wheel {
    display:block;
    border-radius:50%;
    box-shadow:0 0 0 6px rgba(19,236,214,0.15),
               0 0 60px rgba(19,236,214,0.4),
               0 20px 50px rgba(0,0,0,0.9),
               inset 0 0 20px rgba(0,0,0,0.5);
    transition:box-shadow 0.3s;
  }
  canvas#wheel.spinning {
    box-shadow:0 0 0 6px rgba(19,236,214,0.35),
               0 0 100px rgba(19,236,214,0.8),
               0 30px 70px rgba(0,0,0,0.95),
               inset 0 0 30px rgba(0,0,0,0.6);
  }
  #wheel-shadow {
    position:absolute;
    bottom:-22px; left:50%;
    transform:translateX(-50%);
    width:85%; height:35px;
    background:radial-gradient(ellipse, rgba(0,0,0,0.75) 0%, transparent 70%);
    filter:blur(12px);
    z-index:-1;
  }
  /* Pointer: static, above wheel */
  #pointer {
    position:relative;
    z-index:10;
    filter:drop-shadow(0 3px 10px rgba(19,236,214,0.9));
    animation: pointerPulse 1.8s ease-in-out infinite;
  }
  @keyframes pointerPulse {
    0%, 100% { filter: drop-shadow(0 3px 8px rgba(19,236,214,0.7)); transform:translateY(0); }
    50% { filter: drop-shadow(0 5px 18px rgba(19,236,214,1)); transform:translateY(-2px); }
  }
  #center-hub {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:52px; height:52px;
    background:radial-gradient(circle at 35% 35%, #2a2a2a 0%, #0e0e0e 100%);
    border:3px solid var(--cyan);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    box-shadow:0 0 25px rgba(19,236,214,0.7),
               inset 0 1px 3px rgba(255,255,255,0.15);
  }

  /* Glass panels */
  .glass { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); border-radius:24px; }

  /* Result banner */
  #result-banner {
    background:linear-gradient(135deg, rgba(19,236,214,0.15), rgba(168,85,247,0.1));
    border:1px solid rgba(19,236,214,0.4);
    border-radius:20px;
    animation:pulse-glow 2s ease infinite;
  }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 20px rgba(19,236,214,0.3)} 50%{box-shadow:0 0 40px rgba(19,236,214,0.6)} }

  /* Spin button */
  #spin-btn {
    background:linear-gradient(135deg, var(--cyan), #0fbfaf);
    color:#0a0a0a;
    border-radius:50px;
    font-weight:800;
    font-size:1.1rem;
    letter-spacing:0.05em;
    transition:all 0.2s;
    box-shadow:0 8px 32px rgba(19,236,214,0.4);
  }
  #spin-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 40px rgba(19,236,214,0.6); }
  #spin-btn:active:not(:disabled) { transform:scale(0.97); }
  #spin-btn:disabled { opacity:0.5; cursor:not-allowed; }

  /* Player chips */
  .player-chip {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:50px;
    padding:6px 14px;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s;
    display:flex; align-items:center; gap:8px;
  }
  .player-chip:hover { background:rgba(255,255,255,0.1); }
  .player-chip.active { border-color:var(--cyan); background:rgba(19,236,214,0.12); color:var(--cyan); }
  .player-chip .dot { width:8px; height:8px; border-radius:50%; }

  /* Bottom nav */
  .bottom-nav { background:rgba(10,10,10,0.95); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.06); }

  /* Confetti */
  .confetti-piece {
    position:fixed;
    width:10px; height:10px;
    top:-20px;
    border-radius:2px;
    animation:confetti-fall linear forwards;
    z-index:100;
    pointer-events:none;
  }
  @keyframes confetti-fall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    100% { transform:translateY(110vh) rotate(720deg); opacity:0; }
  }

        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}

        .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const COLORS = [
  '#13ecd6','#a855f7','#FF9D42','#ec4899','#3b82f6','#22c55e',
  '#f59e0b','#ef4444','#8b5cf6','#06b6d4'
];

let players = [
  {name:'Commander', color:'#13ecd6', active:true},
  {name:'Mario', color:'#a855f7', active:true},
  {name:'Elena', color:'#FF9D42', active:true},
  {name:'Sofia', color:'#ec4899', active:true},
];

let currentAngle = 0;
let spinCount = 0;
let isSpinning = false;
let lastWinner = null;
let history = [];

// ─── AUDIO ENGINE (delegated to engine/audio.js) ──────────────────────────────
function playTick(frequency, duration) { if(window.SGAudio) SGAudio.tick((frequency||800) / 1200); }
function playWinSound() { if(window.SGAudio) SGAudio.victory(); }
// NOTE: maybePlayTick is defined below in SPIN LOGIC section
// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const SIZE = 300;
canvas.width = SIZE;
canvas.height = SIZE;

function getActivePlayers() { return players.filter(p => p.active); }

function drawWheel(angle = 0) {
  const active = getActivePlayers();
  if (active.length === 0) return;
  ctx.clearRect(0, 0, SIZE, SIZE);
  const cx = SIZE/2, cy = SIZE/2;
  const rOuter = SIZE/2 - 3;   // main wheel radius
  const rInner = 28;            // hub radius
  const rLabel = rOuter * 0.68; // label radius
  const rDot   = rOuter - 12;   // pin dot radius
  const rRim   = rOuter + 1;    // metallic rim outer edge
  const rBand  = rOuter - 18;   // inner band radius (alternating dark/light)
  const slice = (Math.PI * 2) / active.length;

  /* ── 1. Segments ── */
  active.forEach((p, i) => {
    const start = angle + i * slice;
    const end   = start + slice;
    const mid   = start + slice / 2;

    // Base fill: alternating darker/lighter for realism
    const darken = i % 2 === 0;
    const rad = ctx.createRadialGradient(cx, cy, rInner, cx, cy, rOuter);
    rad.addColorStop(0,   darken ? p.color + '18' : p.color + '28');
    rad.addColorStop(0.6, darken ? p.color + '30' : p.color + '48');
    rad.addColorStop(1,   darken ? p.color + '50' : p.color + '70');
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, rOuter, start, end);
    ctx.closePath();
    ctx.fillStyle = rad;
    ctx.fill();

    // Separator line
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(start) * rInner, cy + Math.sin(start) * rInner);
    ctx.lineTo(cx + Math.cos(start) * rOuter, cy + Math.sin(start) * rOuter);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Highlight arc near outer rim
    ctx.beginPath();
    ctx.arc(cx, cy, rOuter - 2, start + 0.02, end - 0.02);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 4;
    ctx.globalAlpha = 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Inner band arc (alternating)
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(start) * rBand, cy + Math.sin(start) * rBand);
    ctx.arc(cx, cy, rBand, start, end);
    ctx.closePath();
    ctx.fillStyle = darken ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.04)';
    ctx.fill();

    /* Label */
    const name = p.name.length > 7 ? p.name.slice(0, 6) + '…' : p.name;
    const lx = cx + Math.cos(mid) * rLabel;
    const ly = cy + Math.sin(mid) * rLabel;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(mid + Math.PI / 2);
    // Text shadow
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Manrope, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    /* Pin dot at rim */
    const dx = cx + Math.cos(mid) * rDot;
    const dy = cy + Math.sin(mid) * rDot;
    ctx.beginPath();
    ctx.arc(dx, dy, 5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Pin highlight
    ctx.beginPath();
    ctx.arc(dx - 1.5, dy - 1.5, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();
  });

  /* ── 2. Outer metallic rim ── */
  const rimGrad = ctx.createLinearGradient(0, 0, SIZE, SIZE);
  rimGrad.addColorStop(0,   'rgba(255,255,255,0.30)');
  rimGrad.addColorStop(0.25,'rgba(255,255,255,0.08)');
  rimGrad.addColorStop(0.5, 'rgba(255,255,255,0.22)');
  rimGrad.addColorStop(0.75,'rgba(255,255,255,0.06)');
  rimGrad.addColorStop(1,   'rgba(255,255,255,0.28)');

  ctx.beginPath();
  ctx.arc(cx, cy, rOuter, 0, Math.PI * 2);
  ctx.strokeStyle = rimGrad;
  ctx.lineWidth = 6;
  ctx.stroke();

  // Outer glow ring
  ctx.beginPath();
  ctx.arc(cx, cy, rOuter + 2, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(19,236,214,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* ── 3. Hub ── */
  const hubGrad = ctx.createRadialGradient(cx-8, cy-8, 2, cx, cy, rInner);
  hubGrad.addColorStop(0, '#3a3a3a');
  hubGrad.addColorStop(0.5, '#1a1a1a');
  hubGrad.addColorStop(1, '#0a0a0a');
  ctx.beginPath();
  ctx.arc(cx, cy, rInner, 0, Math.PI * 2);
  ctx.fillStyle = hubGrad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, rInner, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(19,236,214,0.6)';
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

// ─── TICK SOUND ───────────────────────────────────────────────────────────────
let lastTickAngle = 0;
let lastTickTime  = 0;

function maybePlayTick(angle, numSegments) {
  if (!window.SGAudio) return;
  const slice = (Math.PI * 2) / numSegments;
  // Fire a tick every time we cross a segment boundary
  const crossed = Math.floor(angle / slice);
  const lastCrossed = Math.floor(lastTickAngle / slice);
  if (crossed !== lastCrossed) {
    // Speed = angle delta per ms (estimated)
    const now = performance.now();
    const dt = now - lastTickTime;
    const angularSpeed = dt > 0 ? Math.abs(angle - lastTickAngle) / dt : 0.02;
    // Pitch: faster spin → higher frequency (map 0.005–0.03 rad/ms to 0.1–1.0)
    const speed = Math.min(Math.max((angularSpeed - 0.005) / 0.025, 0), 1);
    SGAudio.tick(speed);
    lastTickTime = now;
  }
  lastTickAngle = angle;
}

// ─── SPIN LOGIC ──────────────────────────────────────────────────────────────
function spinWheel() {
  const active = getActivePlayers();
  if (active.length < 2) { SGRouter.showToast('Añade al menos 2 jugadores', 'warning'); return; }
  if (isSpinning) return;

  // Resume AudioContext on user interaction (browser autoplay policy)
  if (window.SGAudio) { SGAudio.resume(); SGAudio.click(); }

  isSpinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('result-banner').classList.add('hidden');
  canvas.classList.add('spinning');

  // Pick random winner
  const winnerIdx = Math.floor(Math.random() * active.length);
  const slice = (Math.PI * 2) / active.length;

  // Target: winner segment center at the pointer (top = -π/2).
  // currentAngle is the rotation offset applied when drawing.
  // Segment i center is at: currentAngle + i*slice + slice/2
  // We want that to equal -π/2 (mod 2π) → i.e. angle after spin:
  //   finalAngle = -π/2 - (winnerIdx*slice + slice/2)  + k*2π
  const targetSliceCenter = winnerIdx * slice + slice / 2;
  const spins = 6 + Math.floor(Math.random() * 4); // 6–9 full rotations
  const rawTarget = -Math.PI / 2 - targetSliceCenter;
  // Ensure the fractional delta is always positive (JS % can be negative)
  const delta = ((rawTarget - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const totalAngle = spins * Math.PI * 2 + delta;
  const finalAngle = currentAngle + totalAngle;

  const duration = 4500 + Math.random() * 1500;
  const t0 = performance.now();
  const startAngle = currentAngle;

  lastTickAngle = currentAngle;
  lastTickTime  = t0;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = now - t0;
    const t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + totalAngle * easeOut(t);
    drawWheel(currentAngle);
    maybePlayTick(currentAngle, active.length);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      // Normalise to [0, 2π)
      currentAngle = ((finalAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      isSpinning = false;
      canvas.classList.remove('spinning');
      document.getElementById('spin-btn').disabled = false;
      playWinSound();
      showResult(active[winnerIdx]);
    }
  }
  requestAnimationFrame(animate);
}

function showResult(winner) {
  spinCount++;
  lastWinner = winner.name;
  document.getElementById('spin-count').textContent = spinCount;
  document.getElementById('last-winner').textContent = winner.name;

  const banner = document.getElementById('result-banner');
  document.getElementById('result-name').textContent = '🎯 ' + winner.name;
  document.getElementById('result-name').style.color = winner.color;
  document.getElementById('result-sub').textContent = 'paga la cuenta de esta noche';
  banner.classList.remove('hidden');

  // Add to history
  const time = new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'});
  history.unshift({name: winner.name, color: winner.color, time});
  renderHistory();

  // Confetti!
  launchConfetti(winner.color);

  SGRouter.showToast(`¡${winner.name} paga hoy! 🎉`, 'success');
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (history.length === 0) {
    list.innerHTML = '<p class="text-xs opacity-30 text-center py-2">Sin giros aún</p>';
    return;
  }
  list.innerHTML = history.slice(0,5).map((h,i) => `
    <div class="flex items-center justify-between py-2 ${i>0?'border-t border-white/5':''}">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full" style="background:${h.color}"></div>
        <span class="text-sm font-semibold">${h.name}</span>
      </div>
      <span class="text-xs opacity-40">${h.time}</span>
    </div>`).join('');
}

function confirmPayment() {
  if (!lastWinner) return;
  SGRouter.showToast(`Pago confirmado para ${lastWinner} ✓`, 'success');
  document.getElementById('result-banner').classList.add('hidden');
  setTimeout(() => SGRouter.navigate('split', 'game-roulette'), 1200);
}

function eliminateWinner() {
  if (!lastWinner) return;
  const p = players.find(pl => pl.name === lastWinner);
  if (p) p.active = false;
  renderPlayers();
  drawWheel(currentAngle);
  document.getElementById('result-banner').classList.add('hidden');
  SGRouter.showToast(`${lastWinner} eliminado de la ruleta`, 'info');
  updatePlayerCount();
}

// ─── PLAYERS ─────────────────────────────────────────────────────────────────
function renderPlayers() {
  const container = document.getElementById('players-container');
  container.innerHTML = players.map((p, i) => `
    <div class="player-chip ${p.active?'active':''}" onclick="togglePlayer(${i})">
      <div class="dot" style="background:${p.color}"></div>
      <span>${p.name}</span>
      ${!p.active ? '<span style="opacity:0.4;font-size:10px">OFF</span>' : ''}
    </div>`).join('');
  updatePlayerCount();
}

function togglePlayer(idx) {
  if (isSpinning) return;
  const active = getActivePlayers();
  if (active.length <= 2 && players[idx].active) {
    SGRouter.showToast('Mínimo 2 jugadores', 'warning');
    return;
  }
  players[idx].active = !players[idx].active;
  renderPlayers();
  drawWheel(currentAngle);
}

function updatePlayerCount() {
  const n = getActivePlayers().length;
  document.getElementById('player-count').textContent = `${n} jugador${n!==1?'es':''}`;
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
document.getElementById('add-player-btn').addEventListener('click', () => {
  document.getElementById('add-modal').style.display = 'flex';
});
function closeModal() {
  document.getElementById('add-modal').style.display = 'none';
  document.getElementById('new-player-input').value = '';
}
function addPlayerFromModal() {
  const name = document.getElementById('new-player-input').value.trim();
  if (!name) return;
  const color = COLORS[players.length % COLORS.length];
  players.push({name, color, active:true});
  renderPlayers();
  drawWheel(currentAngle);
  closeModal();
  SGRouter.showToast(`${name} añadido`, 'success');
}
document.getElementById('new-player-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPlayerFromModal();
});

// ─── CONFETTI ────────────────────────────────────────────────────────────────
function launchConfetti(color) {
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random()*100}vw;
      background:${Math.random()>0.5?color:COLORS[Math.floor(Math.random()*COLORS.length)]};
      width:${6+Math.random()*10}px;
      height:${6+Math.random()*10}px;
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.5}s;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderPlayers();
drawWheel(0);
</script>

        <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
