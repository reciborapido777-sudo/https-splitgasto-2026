<!DOCTYPE html>
<html lang="es" class="dark" style="background-color:#0a0a0a">
<head>
<meta charset="UTF-8"/>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>

<style>
  :root { --cyan:#13ecd6; --purple:#a855f7; --orange:#FF9D42; }
  * { font-family:'Manrope',sans-serif; box-sizing:border-box; }
  body { background:#0a0a0a; min-height:100dvh; overflow-x:hidden; touch-action: pan-y; /* FIX Android scroll */ }

  /* ── Roulette container ── */
  #roulette-wrapper {
    position:relative;
    /* Use 100% width capped at 320px so it never overflows on small iOS screens.
       The old fixed 320px caused the glow shadow to be clipped by overflow-x:hidden
       on devices narrower than 360px. */
    width:min(320px, 100%);
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    /* Padding ensures the canvas glow (50px spread) is not clipped */
    padding:0 4px;
  }

  /* ── Pointer: STATIC triangle above the canvas, pointing DOWN ── */
  #pointer-wrap {
    position:relative;
    z-index:20;
    /* Negative bottom margin so pointer tip overlaps canvas top */
    margin-bottom:-4px;
    line-height:0;
  }
  #pointer {
    display:block;
    filter:drop-shadow(0 4px 12px rgba(19,236,214,0.9));
    animation:pointerPulse 2s ease-in-out infinite;
  }
  @keyframes pointerPulse {
    0%,100% { filter:drop-shadow(0 3px 8px rgba(19,236,214,0.7)); transform:translateY(0); }
    50%      { filter:drop-shadow(0 6px 20px rgba(19,236,214,1));  transform:translateY(-3px); }
  }

  /* ── Canvas & glow ── */
  #wheel-canvas-wrap {
    position:relative;
    /* Responsive: shrink below 300px only on very small screens */
    width:min(300px, calc(100% - 8px));
    height:min(300px, calc(100vw - 40px));
    flex-shrink:0;
    /* manipulation: permite scroll vertical Y pinch-zoom, bloquea sólo el
       long-press del sistema. pan-y bloqueaba el pinch-zoom (bug reportado). */
    touch-action: manipulation;
  }
  canvas#wheel {
    display:block;
    width:100% !important;
    height:100% !important;
    border-radius:50%;
    /* manipulation: scroll 1-dedo + zoom, sin delay 300ms */
    touch-action: manipulation;
    box-shadow:
      0 0 0 5px rgba(19,236,214,0.12),
      0 0 50px rgba(19,236,214,0.35),
      0 24px 60px rgba(0,0,0,0.95);
    transition:box-shadow 0.3s;
  }
  canvas#wheel.spinning {
    box-shadow:
      0 0 0 7px rgba(19,236,214,0.3),
      0 0 90px rgba(19,236,214,0.75),
      0 30px 80px rgba(0,0,0,0.99);
  }
  #wheel-shadow {
    position:absolute;
    bottom:-18px; left:50%;
    transform:translateX(-50%);
    width:80%; height:28px;
    background:radial-gradient(ellipse, rgba(0,0,0,0.8) 0%, transparent 70%);
    filter:blur(10px);
    z-index:-1;
  }
  #center-hub {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:52px; height:52px;
    background:radial-gradient(circle at 35% 35%, #2e2e2e 0%, #111 100%);
    border:3px solid var(--cyan);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    box-shadow:0 0 28px rgba(19,236,214,0.7), inset 0 1px 4px rgba(255,255,255,0.18);
  }

  /* ── Glass panels ── */
  .glass { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); border-radius:24px; }

  /* ── Result banner ── */
  #result-banner {
    background:linear-gradient(135deg, rgba(19,236,214,0.15), rgba(168,85,247,0.08));
    border:1px solid rgba(19,236,214,0.4);
    border-radius:20px;
    animation:pulse-glow 2s ease infinite;
  }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 20px rgba(19,236,214,0.25)} 50%{box-shadow:0 0 45px rgba(19,236,214,0.6)} }

  /* ── Spin button ── */
  #spin-btn {
    background:linear-gradient(135deg, var(--cyan), #0fbfaf);
    color:#0a0a0a;
    border-radius:50px;
    font-weight:800;
    font-size:1.1rem;
    letter-spacing:0.05em;
    transition:all 0.2s;
    box-shadow:0 8px 32px rgba(19,236,214,0.4);
  }
  #spin-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 40px rgba(19,236,214,0.6); }
  #spin-btn:active:not(:disabled) { transform:scale(0.97); }
  #spin-btn:disabled { opacity:0.5; cursor:not-allowed; }

  /* ── Player chips ── */
  .player-chip {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:50px;
    padding:6px 14px;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s;
    display:flex; align-items:center; gap:8px;
  }
  .player-chip:hover { background:rgba(255,255,255,0.1); }
  .player-chip.active { border-color:var(--cyan); background:rgba(19,236,214,0.12); color:var(--cyan); }
  .player-chip .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* ── Bottom nav ── */
  .bottom-nav { background:rgba(10,10,10,0.95); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.06); }

  /* ── Confetti ── */
  .confetti-piece { position:fixed; width:10px; height:10px; top:-20px; border-radius:2px; animation:confetti-fall linear forwards; z-index:100; pointer-events:none; }
  @keyframes confetti-fall { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }

  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
  .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
  .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
  .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
  .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
</style>

<!-- Main -->
<!-- px-3 instead of px-4 gives 6px more side room for the glow shadow on small iOS screens -->
<main class="max-w-md mx-auto px-3 pt-6 space-y-6">

  <!-- Group selector — FIX: dinámico, carga grupos reales -->
  <div class="glass p-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0" style="background:rgba(168,85,247,0.2)">🎮</div>
      <div class="flex-1 min-w-0">
        <p class="text-[9px] font-black uppercase tracking-widest opacity-40 mb-1">Grupo</p>
        <select id="group-select" class="w-full bg-transparent text-white font-bold text-sm outline-none cursor-pointer"
          style="border:none;background:transparent" onchange="onGroupChange(this.value)">
          <option value="">Cargando grupos…</option>
        </select>
      </div>

    <p class="text-xs opacity-40 mt-2 pl-13" id="group-member-count">— participantes</p>

  <!-- Roulette Wheel (flat, no 3D tilt) -->
  <div class="flex flex-col items-center py-4">
    <div id="roulette-wrapper">

      <!-- Pointer: static triangle, tip pointing DOWN toward canvas top -->
      <div id="pointer-wrap">
        <svg id="pointer" width="32" height="36" viewBox="0 0 32 36">
          <!--
            Triangle: tip at bottom center (16,36), base at top.
            This tip will visually touch the wheel's top edge.
          -->
          <defs>
            <linearGradient id="ptrG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4ffff0"/>
              <stop offset="100%" stop-color="#09b8a0"/>
            </linearGradient>
            <filter id="ptrBlur">
              <feGaussianBlur stdDeviation="1.5" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur"/>
            </filter>
          </defs>
          <!-- Shadow polygon -->
          <polygon points="16,36 30,6 16,14 2,6" fill="rgba(0,0,0,0.4)" transform="translate(0,2)"/>
          <!-- Main pointer -->
          <polygon points="16,36 30,6 16,14 2,6" fill="url(#ptrG)"/>
          <!-- Highlight stripe -->
          <polygon points="16,36 16,14 2,6" fill="rgba(255,255,255,0.15)"/>
          <!-- Base circle -->
          <circle cx="16" cy="7" r="5" fill="#fff" opacity="0.9"/>
          <circle cx="16" cy="7" r="3" fill="var(--cyan)"/>
        </svg>
      </div>

      <!-- Wheel canvas (flat, no perspective tilt) -->
      <div id="wheel-canvas-wrap">
        <canvas id="wheel" width="300" height="300"></canvas>
        <div id="wheel-shadow"></div>
        <div id="center-hub">
          <span class="material-icons-round" style="color:var(--cyan);font-size:22px">payments</span>
        </div>
      </div>
    </div>

    <!-- Spin stats -->
    <div class="flex gap-6 mt-5 text-center">
      <div>
        <p class="text-lg font-bold" style="color:var(--cyan)" id="spin-count">0</p>
        <p class="text-xs opacity-40">Giros</p>

  <!-- Result banner -->

<!-- Add Player Modal -->
<div id="add-modal" class="fixed inset-0 z-50 hidden items-center justify-center" style="background:rgba(0,0,0,0.85)">
  <div class="glass p-6 mx-4 w-full max-w-sm">

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const COLORS = [
  '#13ecd6','#a855f7','#FF9D42','#ec4899','#3b82f6','#22c55e',
  '#f59e0b','#ef4444','#8b5cf6','#06b6d4'
];

// FIX: players arrancará vacío; se llena con miembros reales del grupo
let players = [];

let currentAngle = 0;   // wheel rotation offset in radians
let spinCount = 0;
let isSpinning = false;
let lastWinner = null;
let history = [];

// ── AUDIO SHIMS ───────────────────────────────────────────────────────────────
function playTick(speed) { if (window.SGAudio) SGAudio.tick(speed); }
function playWinSound()  { if (window.SGAudio) SGAudio.victory(); }

// ── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('wheel');
const ctx    = canvas.getContext('2d');
const SIZE   = 300;
canvas.width  = SIZE;
canvas.height = SIZE;

function getActivePlayers() { return players.filter(p => p.active); }

// ── DRAW WHEEL ────────────────────────────────────────────────────────────────
// angle = rotation offset (radians). Segment i starts at angle + i*slice.
// The POINTER TIP is at the TOP of the canvas = angle 270° = -π/2 in canvas coords.
// We want winner segment center exactly at -π/2 (top).
function drawWheel(angle) {
  const active = getActivePlayers();
  if (!active.length) return;
  ctx.clearRect(0, 0, SIZE, SIZE);

  const cx     = SIZE / 2;
  const cy     = SIZE / 2;
  const R      = SIZE / 2 - 4;    // wheel outer radius
  const rHub   = 26;              // hub radius
  const rLabel = R * 0.65;        // label radius
  const rDot   = R - 14;         // rim pin dot radius
  const rBand  = R * 0.58;        // inner band divider
  const slice  = (Math.PI * 2) / active.length;

  // ── 1. Segments ──────────────────────────────────────────────────────────
  active.forEach((p, i) => {
    const a0 = angle + i * slice;
    const a1 = a0 + slice;
    const am = a0 + slice / 2;
    const dark = i % 2 === 0;

    // Radial gradient fill
    const grad = ctx.createRadialGradient(cx, cy, rHub, cx, cy, R);
    grad.addColorStop(0,   (dark ? p.color + '22' : p.color + '33'));
    grad.addColorStop(0.55,(dark ? p.color + '38' : p.color + '55'));
    grad.addColorStop(1,   (dark ? p.color + '60' : p.color + '80'));

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Subtle inner band overlay
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a0) * rHub, cy + Math.sin(a0) * rHub);
    ctx.arc(cx, cy, rBand, a0, a1);
    ctx.closePath();
    ctx.fillStyle = dark ? 'rgba(0,0,0,0.18)' : 'rgba(255,255,255,0.05)';
    ctx.fill();

    // Separator line
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a0) * rHub, cy + Math.sin(a0) * rHub);
    ctx.lineTo(cx + Math.cos(a0) * R,    cy + Math.sin(a0) * R);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Outer colour arc highlight
    ctx.beginPath();
    ctx.arc(cx, cy, R - 2, a0 + 0.03, a1 - 0.03);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 5;
    ctx.globalAlpha = 0.55;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Label
    const name = p.name.length > 7 ? p.name.slice(0, 6) + '…' : p.name;
    ctx.save();
    ctx.translate(
      cx + Math.cos(am) * rLabel,
      cy + Math.sin(am) * rLabel
    );
    ctx.rotate(am + Math.PI / 2);
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur  = 6;
    ctx.fillStyle   = '#fff';
    ctx.font        = 'bold 11.5px Manrope, sans-serif';
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, 0, 0);
    ctx.shadowBlur  = 0;
    ctx.restore();

    // Rim pin dot
    const dx = cx + Math.cos(am) * rDot;
    const dy = cy + Math.sin(am) * rDot;
    ctx.beginPath();
    ctx.arc(dx, dy, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = 12;
    ctx.fill();
    ctx.shadowBlur  = 0;
    // Pin highlight
    ctx.beginPath();
    ctx.arc(dx - 1.5, dy - 1.5, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fill();
  });

  // ── 2. Metallic rim ──────────────────────────────────────────────────────
  const rimGrad = ctx.createLinearGradient(0, 0, SIZE, SIZE);
  rimGrad.addColorStop(0,    'rgba(255,255,255,0.32)');
  rimGrad.addColorStop(0.25, 'rgba(255,255,255,0.10)');
  rimGrad.addColorStop(0.5,  'rgba(255,255,255,0.24)');
  rimGrad.addColorStop(0.75, 'rgba(255,255,255,0.07)');
  rimGrad.addColorStop(1,    'rgba(255,255,255,0.30)');

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = rimGrad;
  ctx.lineWidth   = 7;
  ctx.stroke();

  // Cyan outer glow ring
  ctx.beginPath();
  ctx.arc(cx, cy, R + 1, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(19,236,214,0.22)';
  ctx.lineWidth   = 2;
  ctx.stroke();

  // ── 3. Hub ───────────────────────────────────────────────────────────────
  const hubGrad = ctx.createRadialGradient(cx - 8, cy - 8, 2, cx, cy, rHub);
  hubGrad.addColorStop(0,   '#383838');
  hubGrad.addColorStop(0.5, '#1c1c1c');
  hubGrad.addColorStop(1,   '#0a0a0a');

  ctx.beginPath();
  ctx.arc(cx, cy, rHub, 0, Math.PI * 2);
  ctx.fillStyle = hubGrad;
  ctx.fill();

  // Hub ring
  ctx.beginPath();
  ctx.arc(cx, cy, rHub, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(19,236,214,0.65)';
  ctx.lineWidth   = 2.5;
  ctx.stroke();

  // Hub inner shine
  ctx.beginPath();
  ctx.arc(cx - 5, cy - 5, rHub * 0.45, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fill();
}

// ── TICK SOUND ────────────────────────────────────────────────────────────────
let lastTickAngle = 0;
let lastTickTime  = 0;

function maybePlayTick(angle, numSegments) {
  if (!window.SGAudio) return;
  const slice      = (Math.PI * 2) / numSegments;
  const crossed    = Math.floor(angle / slice);
  const lastCrossed = Math.floor(lastTickAngle / slice);
  if (crossed !== lastCrossed) {
    const now  = performance.now();
    const dt   = Math.max(now - lastTickTime, 1);
    const angSpeed = Math.abs(angle - lastTickAngle) / dt;
    // Map 0.005–0.03 rad/ms → speed 0–1
    const speed = Math.min(Math.max((angSpeed - 0.005) / 0.025, 0), 1);
    SGAudio.tick(speed);
    lastTickTime = now;
  }
  lastTickAngle = angle;
}

// ── SPIN LOGIC ────────────────────────────────────────────────────────────────
// Pointer tip is at TOP of canvas = canvas angle -π/2 (270°).
// Segment i spans [currentAngle + i*slice,  currentAngle + (i+1)*slice].
// Winner segment center = currentAngle + winnerIdx*slice + slice/2.
// We need:  finalAngle + winnerIdx*slice + slice/2  ≡  -π/2  (mod 2π)
// → finalAngle = -π/2 - winnerIdx*slice - slice/2  + k*2π
// We spin clockwise (angle increases) so delta must be positive.
function spinWheel() {
  const active = getActivePlayers();
  if (active.length < 2) {
    SGRouter.showToast('Añade al menos 2 jugadores', 'warning');
    return;
  }
  if (isSpinning) return;

  if (window.SGAudio) { SGAudio.resume(); SGAudio.click(); }

  isSpinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('result-banner').classList.add('hidden');
  canvas.classList.add('spinning');

  const winnerIdx = Math.floor(Math.random() * active.length);
  const slice     = (Math.PI * 2) / active.length;
  const spins     = 6 + Math.floor(Math.random() * 4); // 6–9 full turns

  // Target angle where winner ends up at top
  const rawTarget = -Math.PI / 2 - winnerIdx * slice - slice / 2;
  // Delta is always positive (forward spin only)
  const delta      = ((rawTarget - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const totalAngle = spins * Math.PI * 2 + delta;
  const finalAngle = currentAngle + totalAngle;

  const duration  = 4500 + Math.random() * 1500; // 4.5–6 s
  const t0        = performance.now();
  const startAngle = currentAngle;

  lastTickAngle = currentAngle;
  lastTickTime  = t0;

  // Ease-out quartic (starts fast, decelerates smoothly)
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = now - t0;
    const t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + totalAngle * easeOut(t);
    drawWheel(currentAngle);
    maybePlayTick(currentAngle, active.length);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      // Normalize to [0, 2π)
      currentAngle = ((finalAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      drawWheel(currentAngle);
      isSpinning = false;
      canvas.classList.remove('spinning');
      document.getElementById('spin-btn').disabled = false;
      playWinSound();
      showResult(active[winnerIdx]);
    }
  }
  requestAnimationFrame(animate);
}

function showResult(winner) {
  spinCount++;
  lastWinner = winner.name;
  document.getElementById('spin-count').textContent = spinCount;
  document.getElementById('last-winner').textContent = winner.name;

  const banner = document.getElementById('result-banner');
  document.getElementById('result-name').textContent = '🎯 ' + winner.name;
  document.getElementById('result-name').style.color  = winner.color;
  document.getElementById('result-sub').textContent   = 'paga la cuenta de esta noche';
  banner.classList.remove('hidden');

  const time = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  history.unshift({name: winner.name, color: winner.color, time});
  renderHistory();
  launchConfetti(winner.color);
  SGRouter.showToast(`¡${winner.name} paga hoy! 🎉`, 'success');
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!history.length) {
    list.innerHTML = '<p class="text-xs opacity-30 text-center py-2">Sin giros aún</p>';
    return;
  }
  list.innerHTML = history.slice(0, 5).map((h, i) => `
    <div class="flex items-center justify-between py-2 ${i > 0 ? 'border-t border-white/5' : ''}">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full" style="background:${h.color}"></div>
        <span class="text-sm font-semibold">${h.name}</span>
      </div>
      <span class="text-xs opacity-40">${h.time}</span>
    </div>`).join('');
}

function confirmPayment() {
  if (!lastWinner) return;
  SGRouter.showToast(`Pago confirmado para ${lastWinner} ✓`, 'success');
  document.getElementById('result-banner').classList.add('hidden');
  setTimeout(() => SGRouter.navigate('split', 'game-roulette'), 1200);
}

function eliminateWinner() {
  if (!lastWinner) return;
  const p = players.find(pl => pl.name === lastWinner);
  if (p) p.active = false;
  renderPlayers();
  drawWheel(currentAngle);
  document.getElementById('result-banner').classList.add('hidden');
  SGRouter.showToast(`${lastWinner} eliminado de la ruleta`, 'info');
  updatePlayerCount();
}

// ── PLAYERS ───────────────────────────────────────────────────────────────────
function renderPlayers() {
  const container = document.getElementById('players-container');
  container.innerHTML = players.map((p, i) => `
    <div class="player-chip ${p.active ? 'active' : ''}" onclick="togglePlayer(${i})">
      <div class="dot" style="background:${p.color}"></div>
      <span>${p.name}</span>
      ${!p.active ? '<span style="opacity:0.4;font-size:10px">OFF</span>' : ''}
    </div>`).join('');
  updatePlayerCount();
}

function togglePlayer(idx) {
  if (isSpinning) return;
  const active = getActivePlayers();
  if (active.length <= 2 && players[idx].active) {
    SGRouter.showToast('Mínimo 2 jugadores', 'warning');
    return;
  }
  players[idx].active = !players[idx].active;
  renderPlayers();
  drawWheel(currentAngle);
}

function updatePlayerCount() {
  const n = getActivePlayers().length;
  document.getElementById('player-count').textContent = `${n} jugador${n !== 1 ? 'es' : ''}`;
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
document.getElementById('add-player-btn').addEventListener('click', () => {
  document.getElementById('add-modal').style.display = 'flex';
});
function closeModal() {
  document.getElementById('add-modal').style.display = 'none';
  document.getElementById('new-player-input').value  = '';
}
function addPlayerFromModal() {
  const name = document.getElementById('new-player-input').value.trim();
  if (!name) return;
  const color = COLORS[players.length % COLORS.length];
  players.push({name, color, active: true});
  renderPlayers();
  drawWheel(currentAngle);
  closeModal();
  SGRouter.showToast(`${name} añadido`, 'success');
}
document.getElementById('new-player-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPlayerFromModal();
});

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function launchConfetti(color) {
  for (let i = 0; i < 45; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random() * 100}vw;
      background:${Math.random() > 0.5 ? color : COLORS[Math.floor(Math.random() * COLORS.length)]};
      width:${6 + Math.random() * 10}px;
      height:${6 + Math.random() * 10}px;
      animation-duration:${1.5 + Math.random() * 2}s;
      animation-delay:${Math.random() * 0.5}s;
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// ── FIX: LOAD GROUPS FROM API ────────────────────────────────────────────────
async function loadRouletteGroups() {
  const sel = document.getElementById('group-select');

  // Esperar a que SGAuth y SGApi estén disponibles (pueden tardar en cargarse vía SPA)
  let retries = 0;
  while ((!window.SGAuth || !window.SGApi) && retries < 20) {
    await new Promise(r => setTimeout(r, 150));
    retries++;
  }

  if (!window.SGAuth || !window.SGApi || !SGAuth.isLoggedIn()) {
    if (sel) sel.innerHTML = '<option value="">Sin sesión — añade jugadores manualmente</option>';
    players = [
      {name:'Jugador 1', color:'#13ecd6', active:true},
      {name:'Jugador 2', color:'#a855f7', active:true},
    ];
    renderPlayers(); drawWheel(0); updatePlayerCount();
    return;
  }

  try { await fetch('/api/db/repair-memberships', { method: 'POST', headers: { 'Authorization': `Bearer ${SGAuth.getToken()}` } }); } catch {}

  try {
    const res = await SGApi.getGroups();
    if (res && res.success && res.groups && res.groups.length > 0) {
      sel.innerHTML = res.groups.map(g =>
        `<option value="${g.id}">${g.name}</option>`
      ).join('');
      await onGroupChange(res.groups[0].id);
    } else {
      sel.innerHTML = '<option value="">Sin grupos — añade jugadores manualmente</option>';
      players = [{name:'Jugador 1', color:'#13ecd6', active:true},{name:'Jugador 2', color:'#a855f7', active:true}];
      renderPlayers(); drawWheel(0); updatePlayerCount();
    }
  } catch(e) {
    console.error('loadRouletteGroups error:', e);
    if (sel) sel.innerHTML = '<option value="">Error al cargar — añade jugadores manualmente</option>';
    players = [{name:'Jugador 1', color:'#13ecd6', active:true},{name:'Jugador 2', color:'#a855f7', active:true}];
    renderPlayers(); drawWheel(0); updatePlayerCount();
  }
}

async function onGroupChange(groupId) {
  if (!groupId) return;
  const countEl   = document.getElementById('group-member-count');
  const totalEl   = document.getElementById('group-total');
  if (countEl) countEl.textContent = 'Cargando miembros…';
  if (totalEl) totalEl.textContent = '—';
  try {
    // Cargar miembros y balances en paralelo
    const [membersRes, balRes] = await Promise.all([
      SGApi.getGroupMembers(groupId).catch(() => null),
      SGApi.getBalances(groupId).catch(() => null)
    ]);
    if (membersRes && membersRes.success && membersRes.members && membersRes.members.length > 0) {
      players = membersRes.members.map((m, i) => ({
        name: m.name || `Jugador ${i+1}`,
        color: COLORS[i % COLORS.length],
        active: true
      }));
      if (countEl) countEl.textContent = `${players.length} participante${players.length!==1?'s':''}`;
    } else {
      players = [{name:'Jugador 1', color:'#13ecd6', active:true},{name:'Jugador 2', color:'#a855f7', active:true}];
      if (countEl) countEl.textContent = '2 participantes (por defecto)';
    }
    // Actualizar "En juego" con el total real de gastos del grupo
    if (balRes && balRes.success && typeof balRes.totalAmount === 'number') {
      if (totalEl) totalEl.textContent = balRes.totalAmount.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
    } else {
      if (totalEl) totalEl.textContent = '0,00 €';
    }
  } catch(e) {
    players = [{name:'Jugador 1', color:'#13ecd6', active:true},{name:'Jugador 2', color:'#a855f7', active:true}];
    if (countEl) countEl.textContent = '2 participantes (por defecto)';
    if (totalEl) totalEl.textContent = '0,00 €';
  }
  renderPlayers();
  drawWheel(0);
  updatePlayerCount();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadRouletteGroups();
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .then(reg => {
                reg.update().catch(() => {});
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    if (!sw) return;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                            sw.postMessage({ type: 'SKIP_WAITING' });
                        }
                    });
                });
            })
            .catch(e => console.warn('[SW] Failed:', e));
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) { refreshing = true; window.location.reload(); }
        });
    });
}
</script>
