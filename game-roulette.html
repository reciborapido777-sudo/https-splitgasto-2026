<style>
  :root { --cyan:#13ecd6; --purple:#a855f7; --orange:#FF9D42; }
  * { font-family:'Plus Jakarta Sans',sans-serif; box-sizing:border-box; }
  h1, h2, h3, .font-space { font-family:'Space Grotesk',sans-serif; }
  body { background:#000; min-height:100dvh; overflow-x:hidden; touch-action: pan-y; }

  /* ── Roulette container ── */
  #roulette-wrapper {
    position:relative;
    width:min(320px, 100%);
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    padding:0 4px;
  }

  /* ── Pointer: STATIC triangle above the canvas ── */
  #pointer-wrap {
    position:relative;
    z-index:20;
    margin-bottom:-4px;
    line-height:0;
  }
  #pointer {
    display:block;
    filter:drop-shadow(0 4px 12px rgba(19,236,214,0.9));
    animation:pointerPulse 2s ease-in-out infinite;
  }
  @keyframes pointerPulse {
    0%,100% { filter:drop-shadow(0 3px 8px rgba(19,236,214,0.7)); transform:translateY(0); }
    50%      { filter:drop-shadow(0 6px 20px rgba(19,236,214,1));  transform:translateY(-3px); }
  }

  /* ── Canvas & glow — Estilo Glassmorphism Híbrido ── */
  #wheel-canvas-wrap {
    position:relative;
    width:min(300px, calc(100% - 8px));
    height:min(300px, calc(100vw - 40px));
    flex-shrink:0;
    touch-action: manipulation;
  }
  canvas#wheel {
    display:block;
    width:100% !important;
    height:100% !important;
    border-radius:50%;
    touch-action: manipulation;
    box-shadow:
      0 0 0 5px rgba(19,236,214,0.12),
      0 0 50px rgba(19,236,214,0.35),
      0 24px 60px rgba(0,0,0,0.95);
    transition:box-shadow 0.3s;
  }
  canvas#wheel.spinning {
    box-shadow:
      0 0 0 7px rgba(19,236,214,0.3),
      0 0 90px rgba(19,236,214,0.75),
      0 30px 80px rgba(0,0,0,0.99);
  }
  #wheel-shadow {
    position:absolute;
    bottom:-18px; left:50%;
    transform:translateX(-50%);
    width:80%; height:28px;
    background:radial-gradient(ellipse, rgba(0,0,0,0.8) 0%, transparent 70%);
    filter:blur(10px);
    z-index:-1;
  }
  #center-hub {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:52px; height:52px;
    background:radial-gradient(circle at 35% 35%, #2e2e2e 0%, #111 100%);
    border:3px solid var(--cyan);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    box-shadow:0 0 28px rgba(19,236,214,0.7), inset 0 1px 4px rgba(255,255,255,0.18);
  }

  /* ── Paneles Híbridos backdrop-filter: blur(30px) ── */
  .glass { background:rgba(255,255,255,0.04); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.05); border-radius:24px; }

  /* ── Result banner ── */
  #result-banner {
    background:linear-gradient(135deg, rgba(19,236,214,0.15), rgba(168,85,247,0.08));
    border:1px solid rgba(19,236,214,0.4);
    border-radius:20px;
    animation:pulse-glow 2s ease infinite;
  }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 20px rgba(19,236,214,0.25)} 50%{box-shadow:0 0 45px rgba(19,236,214,0.6)} }

  /* ── Spin button ── */
  #spin-btn {
    background:linear-gradient(135deg, var(--cyan), #0fbfaf);
    color:#0a0a0a;
    border-radius:50px;
    font-weight:800;
    font-size:1.1rem;
    letter-spacing:0.05em;
    transition:all 0.2s;
    box-shadow:0 8px 32px rgba(19,236,214,0.4);
  }
  #spin-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 40px rgba(19,236,214,0.6); }
  #spin-btn:active:not(:disabled) { transform:scale(0.97); }
  #spin-btn:disabled { opacity:0.5; cursor:not-allowed; }

  /* ── Player chips ── */
  .player-chip {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:50px;
    padding:6px 14px;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s;
    display:flex; align-items:center; gap:8px;
  }
  .player-chip:hover { background:rgba(255,255,255,0.1); }
  .player-chip.active { border-color:var(--cyan); background:rgba(19,236,214,0.12); color:var(--cyan); }
  .player-chip .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* ── Confetti ── */
  .confetti-piece { position:fixed; width:10px; height:10px; top:-20px; border-radius:2px; animation:confetti-fall linear forwards; z-index:100; pointer-events:none; }
  @keyframes confetti-fall { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }

  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
  .nav-item span.material-icons-round{font-size:20px;color:#4a4a4a;transition:color .2s}
  .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
  .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
  .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
</style>

<script>
const COLORS = [
  '#13ecd6','#a855f7','#FF9D42','#ec4899','#3b82f6','#22c55e',
  '#f59e0b','#ef4444','#8b5cf6','#06b6d4'
];

let players = [];
let currentAngle = 0;   
let spinCount = 0;
let isSpinning = false;
let lastWinner = null;
let history = [];

function playTick(speed) { if (window.SGAudio) SGAudio.tick(speed); }
function playWinSound()  { if (window.SGAudio) SGAudio.victory(); }

const canvas = document.getElementById('wheel');
const ctx    = canvas.getContext('2d');
const SIZE   = 300;
canvas.width  = SIZE;
canvas.height = SIZE;

function getActivePlayers() { return players.filter(p => p.active); }

function drawWheel(angle) {
  const active = getActivePlayers();
  if (!active.length) return;
  ctx.clearRect(0, 0, SIZE, SIZE);

  const cx     = SIZE / 2;
  const cy     = SIZE / 2;
  const R      = SIZE / 2 - 4;    
  const rHub   = 26;              
  const rLabel = R * 0.65;        
  const rDot   = R - 14;         
  const rBand  = R * 0.58;        
  const slice  = (Math.PI * 2) / active.length;

  active.forEach((p, i) => {
    // CORRECCIÓN RADIAL DEFINITIVA: Alineación ortogonal matemática del lienzo
    const a0 = angle + i * slice - Math.PI / 2;
    const a1 = a0 + slice;
    const am = a0 + slice / 2;
    const dark = i % 2 === 0;

    const grad = ctx.createRadialGradient(cx, cy, rHub, cx, cy, R);
    grad.addColorStop(0,   (dark ? p.color + '22' : p.color + '33'));
    grad.addColorStop(0.55,(dark ? p.color + '38' : p.color + '55'));
    grad.addColorStop(1,   (dark ? p.color + '60' : p.color + '80'));

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a0) * rHub, cy + Math.sin(a0) * rHub);
    ctx.arc(cx, cy, rBand, a0, a1);
    ctx.closePath();
    ctx.fillStyle = dark ? 'rgba(0,0,0,0.18)' : 'rgba(255,255,255,0.05)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a0) * rHub, cy + Math.sin(a0) * rHub);
    ctx.lineTo(cx + Math.cos(a0) * R,    cy + Math.sin(a0) * R);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, R - 2, a0 + 0.03, a1 - 0.03);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 5;
    ctx.globalAlpha = 0.55;
    ctx.stroke();
    ctx.globalAlpha = 1;

    const name = p.name.length > 7 ? p.name.slice(0, 6) + '…' : p.name;
    ctx.save();
    ctx.translate(cx + Math.cos(am) * rLabel, cy + Math.sin(am) * rLabel);
    ctx.rotate(am + Math.PI / 2);
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur  = 6;
    ctx.fillStyle   = '#fff';
    ctx.font        = 'bold 11.5px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, 0, 0);
    ctx.shadowBlur  = 0;
    ctx.restore();

    const dx = cx + Math.cos(am) * rDot;
    const dy = cy + Math.sin(am) * rDot;
    ctx.beginPath();
    ctx.arc(dx, dy, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = 12;
    ctx.fill();
    ctx.shadowBlur  = 0;

    ctx.beginPath();
    ctx.arc(dx - 1.5, dy - 1.5, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fill();
  });

  const rimGrad = ctx.createLinearGradient(0, 0, SIZE, SIZE);
  rimGrad.addColorStop(0,    'rgba(255,255,255,0.32)');
  rimGrad.addColorStop(0.25, 'rgba(255,255,255,0.10)');
  rimGrad.addColorStop(0.5,  'rgba(255,255,255,0.24)');
  rimGrad.addColorStop(0.75, 'rgba(255,255,255,0.07)');
  rimGrad.addColorStop(1,    'rgba(255,255,255,0.30)');

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = rimGrad;
  ctx.lineWidth   = 7;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R + 1, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(19,236,214,0.22)';
  ctx.lineWidth   = 2;
  ctx.stroke();

  const hubGrad = ctx.createRadialGradient(cx - 8, cy - 8, 2, cx, cy, rHub);
  hubGrad.addColorStop(0,   '#383838');
  hubGrad.addColorStop(0.5, '#1c1c1c');
  hubGrad.addColorStop(1,   '#0a0a0a');

  ctx.beginPath();
  ctx.arc(cx, cy, rHub, 0, Math.PI * 2);
  ctx.fillStyle = hubGrad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, rHub, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(19,236,214,0.65)';
  ctx.lineWidth   = 2.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx - 5, cy - 5, rHub * 0.45, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fill();
}

let lastTickAngle = 0;
let lastTickTime  = 0;

function maybePlayTick(angle, numSegments) {
  if (!window.SGAudio) return;
  const slice       = (Math.PI * 2) / numSegments;
  const crossed     = Math.floor(angle / slice);
  const lastCrossed = Math.floor(lastTickAngle / slice);
  if (crossed !== lastCrossed) {
    const now  = performance.now();
    const dt   = Math.max(now - lastTickTime, 1);
    const angSpeed = Math.abs(angle - lastTickAngle) / dt;
    const speed = Math.min(Math.max((angSpeed - 0.005) / 0.025, 0), 1);
    SGAudio.tick(speed);
    lastTickTime = now;
  }
  lastTickAngle = angle;
}

function spinWheel() {
  const active = getActivePlayers();
  if (active.length < 2) {
    if (window.SGRouter) SGRouter.showToast('Añade al menos 2 jugadores', 'warning');
    return;
  }
  if (isSpinning) return;

  if (window.SGAudio) { SGAudio.resume(); SGAudio.click(); }

  isSpinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('result-banner').classList.add('hidden');
  canvas.classList.add('spinning');

  const winnerIdx = Math.floor(Math.random() * active.length);
  const slice     = (Math.PI * 2) / active.length;
  const spins     = 6 + Math.floor(Math.random() * 4); 

  const rawTarget = -winnerIdx * slice - slice / 2;
  const delta      = ((rawTarget - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const totalAngle = spins * Math.PI * 2 + delta;
  const finalAngle = currentAngle + totalAngle;

  const duration  = 4500 + Math.random() * 1500; 
  const t0        = performance.now();
  const startAngle = currentAngle;

  lastTickAngle = currentAngle;
  lastTickTime  = t0;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = now - t0;
    const t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + totalAngle * easeOut(t);
    drawWheel(currentAngle);
    maybePlayTick(currentAngle, active.length);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = ((finalAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      drawWheel(currentAngle);
      isSpinning = false;
      canvas.classList.remove('spinning');
      document.getElementById('spin-btn').disabled = false;
      playWinSound();
      showResult(active[winnerIdx]); // Inyección atómica del resultado
    }
  }
  requestAnimationFrame(animate);
}

function showResult(winner) {
  spinCount++;
  lastWinner = winner.name;
  document.getElementById('spin-count').textContent = spinCount;
  document.getElementById('last-winner').textContent = winner.name;

  const banner = document.getElementById('result-banner');
  document.getElementById('result-name').textContent = '🎯 ' + winner.name;
  document.getElementById('result-name').style.color  = winner.color;
  banner.classList.remove('hidden');

  const time = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  history.unshift({name: winner.name, color: winner.color, time});
  renderHistory();
  
  // RESTAURACIÓN ABSOLUTA DEL CONFETI PARTICIPANTE
  launchConfetti(winner.color);
  
  if (window.SGRouter) SGRouter.showToast(`¡${winner.name} paga hoy! 🎉`, 'success');
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!history.length) {
    list.innerHTML = '<p class="text-xs opacity-30 text-center py-2">Sin giros aún</p>';
    return;
  }
  list.innerHTML = history.slice(0, 5).map((h, i) => `
    <div class="flex items-center justify-between py-2 ${i > 0 ? 'border-t border-white/5' : ''}">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full" style="background:${h.color}"></div>
        <span class="text-sm font-semibold">${h.name}</span>
      </div>
      <span class="text-xs opacity-40">${h.time}</span>
    </div>`).join('');
}

function confirmPayment() {
  if (!lastWinner) return;
  if (window.SGRouter) {
    SGRouter.showToast(`Pago confirmado para ${lastWinner} ✓`, 'success');
    document.getElementById('result-banner').classList.add('hidden');
    setTimeout(() => SGRouter.navigate('split', 'game-roulette'), 1200);
  }
}

function eliminateWinner() {
  if (!lastWinner) return;
  const p = players.find(pl => pl.name === lastWinner);
  if (p) p.active = false;
  renderPlayers();
  drawWheel(currentAngle);
  document.getElementById('result-banner').classList.add('hidden');
  if (window.SGRouter) SGRouter.showToast(`${lastWinner} eliminado de la ruleta`, 'info');
}

function renderPlayers() {
  const container = document.getElementById('players-container');
  if (!container) return;
  if (!players.length) {
    container.innerHTML = '<p class="text-xs opacity-30">No hay participantes en este grupo.</p>';
    return;
  }
  container.innerHTML = players.map((p, i) => `
    <div class="player-chip ${p.active ? 'active' : ''}" onclick="togglePlayer(${i})">
      <div class="dot" style="background:${p.color}"></div>
      <span>${p.name}</span>
      ${!p.active ? '<span style="opacity:0.4;font-size:10px">OFF</span>' : ''}
    </div>`).join('');
  updatePlayerCount();
}

function togglePlayer(idx) {
  if (isSpinning) return;
  const active = getActivePlayers();
  if (active.length <= 2 && players[idx].active) {
    if (window.SGRouter) SGRouter.showToast('Mínimo 2 jugadores', 'warning');
    return;
  }
  players[idx].active = !players[idx].active;
  renderPlayers();
  drawWheel(currentAngle);
}

function updatePlayerCount() {
  const countEl = document.getElementById('player-count');
  if (!countEl) return;
  const n = getActivePlayers().length;
  countEl.textContent = `${n} jugador${n !== 1 ? 'es' : ''}`;
}

document.getElementById('add-player-btn').addEventListener('click', () => {
  document.getElementById('add-modal').style.display = 'flex';
});
function closeModal() {
  document.getElementById('add-modal').style.display = 'none';
  document.getElementById('new-player-input').value  = '';
}
function addPlayerFromModal() {
  const name = document.getElementById('new-player-input').value.trim();
  if (!name) return;
  const color = COLORS[players.length % COLORS.length];
  players.push({name, color, active: true});
  renderPlayers();
  drawWheel(currentAngle);
  closeModal();
  if (window.SGRouter) SGRouter.showToast(`${name} añadido`, 'success');
}
document.getElementById('new-player-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPlayerFromModal();
});

// INTEGRIDAD DE ACTIVOS ANIMADOS: Regeneración simétrica de partículas de confeti
function launchConfetti(color) {
  for (let i = 0; i < 45; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random() * 100}vw;
      background:${Math.random() > 0.5 ? color : COLORS[Math.floor(Math.random() * COLORS.length)]};
      width:${6 + Math.random() * 10}px;
      height:${6 + Math.random() * 10}px;
      animation-duration:${1.5 + Math.random() * 2}s;
      animation-delay:${Math.random() * 0.5}s;
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// ── CAPTURA DIRECTA CORE EXCLUSIVA (Blindaje definitivo contra promesas muertas) ──
function getStandaloneToken() {
  try {
    const keys = ['sg_auth_token', 'token', 'sg_session', 'session', 'jwt'];
    for (const key of keys) {
      const val = localStorage.getItem(key) || sessionStorage.getItem(key);
      if (val && val.length > 20) return val; 
    }
    if (window.SGAuth && typeof window.SGAuth.getToken === 'function') {
      return window.SGAuth.getToken();
    }
  } catch (err) {
    console.error("[Ruleta] Error leyendo persistencia:", err);
  }
  return null;
}

async function loadRouletteGroups() {
  const sel = document.getElementById('group-select');
  if (!sel) {
    requestAnimationFrame(loadRouletteGroups);
    return;
  }

  const token = getStandaloneToken();
  if (!token) {
    setDefaultPlayers();
    return;
  }
  
  try {
    await fetch('/api/db/repair-memberships', { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` },
      cache: 'no-store'
    }).catch(() => {});

    const response = await fetch('/api/db/groups', {
      method: 'GET',
      headers: { 
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      cache: 'no-store'
    });

    if (!response.ok) {
      setDefaultPlayers();
      return;
    }

    const res = await response.json();
    
    if (res && res.success && res.groups && res.groups.length > 0) {
      sel.innerHTML = res.groups.map(g =>
        `<option value="${g.id}">${g.name}</option>`
      ).join('');
      await onGroupChange(res.groups[0].id);
    } else {
      sel.innerHTML = '<option value="">Crea un grupo para sincronizar</option>';
      setDefaultPlayers();
    }
  } catch(e) {
    console.error('[Ruleta] Excepción de red:', e);
    setDefaultPlayers();
  }
}

async function onGroupChange(groupId) {
  if (!groupId) return;
  const token = getStandaloneToken();
  const countEl = document.getElementById('group-member-count');
  const totalEl = document.getElementById('group-total');
  
  if (countEl) countEl.textContent = 'Sincronizando participantes…';
  if (totalEl) totalEl.textContent = '—';
  
  try {
    const [mResp, bResp] = await Promise.all([
      fetch(`/api/db/group-members?groupId=${groupId}`, { headers: { 'Authorization': `Bearer ${token}` }, cache: 'no-store' }),
      fetch(`/api/db/balances?groupId=${groupId}`, { headers: { 'Authorization': `Bearer ${token}` }, cache: 'no-store' })
    ]);

    const membersRes = await mResp.json();
    const balRes = await bResp.json();
    
    if (membersRes && membersRes.success && membersRes.members && membersRes.members.length > 0) {
      players = membersRes.members.map((m, i) => ({
        name: m.name || `Jugador ${i+1}`,
        color: COLORS[i % COLORS.length],
        active: true
      }));
      if (countEl) countEl.textContent = `${players.length} participante${players.length!==1?'s':''}`;
    } else {
      setDefaultPlayers();
    }
    
    if (balRes && balRes.success && typeof balRes.totalAmount === 'number') {
      if (totalEl) totalEl.textContent = balRes.totalAmount.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
    } else {
      if (totalEl) totalEl.textContent = '0,00 €';
    }
  } catch(e) {
    console.error('[Ruleta] Error mapeando grupo:', e);
    setDefaultPlayers();
  }
  renderPlayers();
  drawWheel(0);
}

function setDefaultPlayers() {
  players = [
    {name:'Jugador 1', color:'#13ecd6', active:true},
    {name:'Jugador 2', color:'#a855f7', active:true},
  ];
  renderPlayers();
  drawWheel(0);
}

requestAnimationFrame(loadRouletteGroups);
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .then(reg => {
                reg.update().catch(() => {});
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    if (!sw) return;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                            sw.postMessage({ type: 'SKIP_WAITING' });
                        }
                    });
                });
            })
            .catch(e => console.warn('[SW] Failed:', e));
    });
}
</script>
