<!DOCTYPE html>
<html lang="es" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner | SplitGasto 2026</title>
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body { background:#000; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; min-height:100dvh; overflow-x:hidden!important; overscroll-behavior:contain; touch-action:manipulation; }
        .camera-container { position:relative; width:100%; aspect-ratio:3/4; background:#111; border-radius:24px; overflow:hidden; }
        .camera-container video { width:100%; height:100%; object-fit:cover; }
        .camera-container canvas { display:none; }
        .scan-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
        .scan-frame { width:80%; height:70%; border:2px solid rgba(19,236,214,0.4); border-radius:16px; position:relative; }
        .scan-line { position:absolute; left:5%; right:5%; height:2px; background:linear-gradient(90deg,transparent,#13ecd6,transparent); animation:scanMove 2s ease-in-out infinite; }
        @keyframes scanMove { 0%,100%{top:10%} 50%{top:85%} }
        .shutter-btn { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,#13ecd6,#10b981); border:4px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; outline:none; }
        .shutter-btn:active { transform:scale(.9); }
        .shutter-btn:disabled { opacity:.4; cursor:not-allowed; }
        .result-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:20px; backdrop-filter:blur(20px); }
        .glass-panel { background:rgba(255,255,255,0.02); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.05); }
        .loading-spinner { width:40px; height:40px; border:3px solid rgba(19,236,214,0.2); border-top-color:#13ecd6; border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="engine/desktop-fix.js" defer></script>
    <script src="engine/router.js" defer></script>
    <script src="engine/auth.js"></script>
    <script src="engine/api.js"></script>
    <script src="engine/i18n.js" defer></script>
</head>
<body class="app-shell">
<div class="app-frame p-4 space-y-4" style="max-width:480px;margin:0 auto">
    <header class="flex items-center justify-between">
        <button onclick="SGRouter.back()" class="size-10 rounded-xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all">
            <span class="material-icons-round text-zinc-500">arrow_back</span>
        </button>
        <h1 class="text-sm font-black tracking-widest uppercase text-zinc-400">Escáner IA</h1>
        <div class="size-10"></div>
    </header>

    <div id="cameraView">
        <div class="camera-container">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="cameraCanvas"></canvas>
            <div class="scan-overlay"><div class="scan-frame"><div class="scan-line"></div></div></div>
        </div>
        <div class="flex items-center justify-center gap-6 py-6">
            <button onclick="switchCamera()" class="size-12 rounded-xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all">
                <span class="material-icons-round text-zinc-400">flip_camera_ios</span>
            </button>
            <button id="captureBtn" onclick="captureAndScan()" class="shutter-btn">
                <span class="material-icons-round text-black text-3xl">photo_camera</span>
            </button>
            <label class="size-12 rounded-xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all cursor-pointer">
                <span class="material-icons-round text-zinc-400">attach_file</span>
                <input type="file" accept="image/*" onchange="uploadAndScan(event)" class="hidden">
            </label>
        </div>
        <p class="text-center text-[9px] font-bold text-zinc-600 uppercase tracking-widest">Apunta al recibo y pulsa el botón</p>
    </div>

    <div id="loadingView" style="display:none" class="flex flex-col items-center justify-center py-20 space-y-4">
        <div class="loading-spinner"></div>
        <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Analizando recibo con IA...</p>
    </div>

    <div id="errorView" style="display:none" class="flex flex-col items-center justify-center py-20 space-y-4">
        <span class="material-icons-round text-red-500 text-5xl">error_outline</span>
        <p id="errorMsg" class="text-sm text-zinc-400 text-center"></p>
        <button onclick="resetScanner()" class="px-6 py-3 glass-panel rounded-xl text-[10px] font-bold uppercase tracking-widest text-zinc-400 hover:text-white transition-all">Reintentar</button> 
    </div>

    <div id="resultView" style="display:none" class="space-y-4">
        <div class="result-card space-y-3">
            <div class="flex items-center gap-2">
                <span class="material-icons-round text-[#13ecd6] text-lg">receipt_long</span>
                <p class="text-[9px] font-black text-zinc-500 uppercase tracking-widest">Datos extraídos</p>
            </div>
            <div id="resultContent"></div>
        </div>
        <button id="saveExpenseBtn" onclick="saveScannedExpense()" class="w-full py-4 rounded-2xl font-black text-[10px] uppercase tracking-[0.3em] active:scale-95 transition-all" style="background:linear-gradient(135deg,#13ecd6,#10b981);color:#000">
            <span class="flex items-center justify-center gap-2"><span class="material-icons-round text-sm">add_circle</span>Guardar como Gasto</span>
        </button>
        <button onclick="resetScanner()" class="w-full py-4 glass-panel rounded-2xl font-black text-[10px] uppercase tracking-[0.3em] hover:bg-white/5 transition-all active:scale-95 text-zinc-400">Escanear otro recibo</button>
    </div>
    
    <script>
    let stream = null, facingMode = 'environment';
    let lastScanData = null;

    async function startCamera() {
        try {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode, width: { ideal: 1280 }, height: { ideal: 960 } }
            });
            document.getElementById('cameraVideo').srcObject = stream;
        } catch(e) {
            console.warn('Cámara no disponible:', e);
            SGRouter.showToast('Cámara no disponible — usa archivo', 'warning');
        }
    }

    function switchCamera() {
        facingMode = facingMode === 'environment' ? 'user' : 'environment';
        startCamera();
    }

    function showView(id) {
        ['cameraView','loadingView','resultView','errorView'].forEach(v => {
            const el = document.getElementById(v);
            if (el) el.style.display = (v === id) ? '' : 'none';
        });
    }

    async function captureAndScan() {
        const v = document.getElementById('cameraVideo');
        const c = document.getElementById('cameraCanvas');
        c.width  = v.videoWidth  || 640;
        c.height = v.videoHeight || 480;
        c.getContext('2d').drawImage(v, 0, 0);
        await scanTicket(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    }

    async function uploadAndScan(e) {
        const f = e.target.files[0];
        if (!f) return;
        const b = await new Promise((resolve, reject) => {
            const rd = new FileReader();
            rd.onload  = () => resolve(rd.result.split(',')[1]);
            rd.onerror = reject;
            rd.readAsDataURL(f);
        });
        await scanTicket(b);
    }

    async function scanTicket(b64) {
        showView('loadingView');
        document.getElementById('captureBtn').disabled = true;
        lastScanData = null;
        try {
            const r = await SGApi.aiScanTicket(b64);
            if (r.success && r.data) {
                lastScanData = r.data.raw || r.data;
                displayResult(lastScanData);
                showView('resultView');
            } else {
                document.getElementById('errorMsg').textContent = r.error || 'No se pudo leer el recibo';
                showView('errorView');
            }
        } catch(e) {
            document.getElementById('errorMsg').textContent = 'Error de conexión con la IA';
            showView('errorView');
        }
        document.getElementById('captureBtn').disabled = false;
    }

    function displayResult(d) {
        const c = document.getElementById('resultContent');
        const items = (d.items || []).map(i =>
            '<div class="flex justify-between text-xs py-0.5">' +
            '<span class="text-zinc-400">' + (i.name || '—') + '</span>' +
            '<span class="text-white font-bold">' + (i.price || 0) + ' ' + (d.currency || 'EUR') + '</span>' +
            '</div>'
        ).join('');
        c.innerHTML =
            '<div class="space-y-2">' +
            '<div class="flex justify-between"><span class="text-[9px] font-bold text-zinc-600 uppercase tracking-widest">Comercio</span><span class="text-sm font-black text-white">' + (d.merchant || '—') + '</span></div>' +
            '<div class="flex justify-between"><span class="text-[9px] font-bold text-zinc-600 uppercase tracking-widest">Fecha</span><span class="text-sm text-zinc-300">' + (d.date || '—') + '</span></div>' +
            '<div class="flex justify-between"><span class="text-[9px] font-bold text-zinc-600 uppercase tracking-widest">Categoría</span><span class="text-sm text-[#13ecd6] font-bold">' + (d.category || '—') + '</span></div>' +
            (items ? '<div class="border-t border-white/5 pt-2 space-y-1">' + items + '</div>' : '') +
            '<div class="flex justify-between border-t border-white/10 pt-2"><span class="text-[9px] font-bold text-zinc-600 uppercase tracking-widest">TOTAL</span><span class="text-lg font-black text-[#13ecd6]">' + (d.total || 0) + ' ' + (d.currency || 'EUR') + '</span></div>' +
            '</div>';
    }

    async function saveScannedExpense() {
        if (!lastScanData) { SGRouter.showToast('Sin datos para guardar', 'warning'); return; }
        const btn = document.getElementById('saveExpenseBtn');
        if (btn) btn.disabled = true;

        const amount   = parseFloat(lastScanData.total) || 0;
        const desc     = (lastScanData.merchant || 'Recibo escaneado');
        const category = lastScanData.category || 'other';
        const currency = lastScanData.currency || 'EUR';

        if (amount <= 0) {
            SGRouter.showToast('El total no se detectó — edita manualmente', 'warning');
            setTimeout(() => SGRouter.navigate('add-expense', 'receipt'), 1000);
            return;
        }

        let groupId = null;
        const params = new URLSearchParams(window.location.search);
        groupId = params.get('groupId');

        if (!groupId) {
            try {
                const groupsResult = await SGApi.getGroups();
                if (groupsResult && groupsResult.success && groupsResult.groups && groupsResult.groups.length > 0) {
                    if (groupsResult.groups.length === 1) {
                        groupId = groupsResult.groups[0].id;
                    } else {
                        groupId = await new Promise((resolve) => {
                            const mid = 'select-group-modal';
                            const existing = document.getElementById(mid); if (existing) existing.remove();
                            const m = document.createElement('div');
                            m.id = mid;
                            m.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px)';
                            const btns = groupsResult.groups.map((g, i) =>
                                `<button data-idx="${i}" style="width:100%;text-align:left;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:6px">${g.name}</button>`
                            ).join('');
                            m.innerHTML = `<div style="background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:24px;max-width:340px;width:90%">
                              <h3 style="font-size:15px;font-weight:800;margin-bottom:16px;text-align:center">Selecciona un grupo</h3>
                              <div id="group-sel-list">${btns}</div>
                              <button onclick="document.getElementById('${mid}').remove()" style="width:100%;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#999;font-weight:700;font-size:13px;cursor:pointer;margin-top:4px">Cancelar</button>
                            </div>`;
                            document.body.appendChild(m);
                            document.getElementById('group-sel-list').addEventListener('click', (e) => {
                                const btnSel = e.target.closest('[data-idx]');
                                if (btnSel) {
                                    m.remove();
                                    resolve(groupsResult.groups[parseInt(btnSel.dataset.idx)].id);
                                }
                            });
                            m.addEventListener('click', (e) => { if (e.target === m) { m.remove(); resolve(null); } });
                        });
                    }
                }
            } catch (e) {
                console.error('Error loading groups for scan:', e);
            }
        }

        if (!groupId) {
            SGRouter.showToast('Selecciona un grupo primero', 'warning');
            setTimeout(() => SGRouter.navigate('add-expense', 'receipt'), 1000);
            if (btn) btn.disabled = false;
            return;
        }

        // PARCHEADO: Lógica de guardado asíncrono condicional y reajuste de estado
        try {
            const result = await SGApi.addExpense(groupId, amount, currency, category, desc, 'equal');
            if (result && result.success) {
                let groupName = 'Grupo';
                try {
                    const groupsRes = await SGApi.getGroups();
                    if (groupsRes?.success && groupsRes.groups) {
                        const found = groupsRes.groups.find(g => g.id === groupId);
                        if (found) groupName = found.name;
                    }
                } catch {}
    
                sessionStorage.setItem('sg_success_ticket', JSON.stringify({
                    type: 'expense',
                    txid: result.id || crypto.randomUUID(),
                    timestamp: new Date().toISOString(),
                    groupId: groupId,
                    groupName: groupName,
                    description: desc,
                    amount: amount,
                    currency: currency,
                    splitMethod: 'equal',
                    receiptKey: result.receiptKey || null
                }));
                sessionStorage.setItem('sg_expense_added', Date.now());
                fetch('/api/db/purge-cache', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${SGAuth.getToken()}` }
                }).catch(() => {});
                SGRouter.showToast('Gasto guardado ✓', 'success');
                setTimeout(() => SGRouter.navigate('success', 'receipt'), 1200);
            } else {
                SGRouter.showToast(result?.error || 'Error al guardar', 'error');
                if (btn) btn.disabled = false;
            }
        } catch (e) {
            console.error('saveScannedExpense error:', e);
            SGRouter.showToast('Error de conexión', 'error');
            if (btn) btn.disabled = false;
        }
    }

    function resetScanner() {
        lastScanData = null;
        showView('cameraView');
        startCamera();
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (!SGAuth.isLoggedIn()) {
            SGRouter.showToast('Inicia sesión para usar el escáner', 'error');
            // PARCHEADO: Corrección de inconsistencia de enrutamiento (I8)
            setTimeout(() => SGRouter.navigate('auth'), 1500);
        } else {
            startCamera();
        }
    });
    </script>
    <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});r.addEventListener('updatefound',()=>{const s=r.installing;if(!s)return;s.addEventListener('statechange',()=>{if(s.state==='installed'&&navigator.serviceWorker.controller)s.postMessage({type:'SKIP_WAITING'});});});}).catch(e=>console.warn('[SW] Failed:',e));let ref=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!ref){ref=true;window.location.reload();}});});}
    </script>
</div>
</body>
</html>
