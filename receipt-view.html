        html, body { 
            background: #000; color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif;

            box-sizing: border-box;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0); 
        }

        .receipt-image-container {
            position: relative; height: 380px; border-radius: 3.5rem;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            background: #050505;
            transform: translateZ(0);
        }

        .receipt-image {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.5;
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
        }

        .ocr-scanner-line {
            position: absolute; top: 20%; left: 0; width: 100%; height: 2px;
            background: linear-gradient(to right, transparent, #13ecd6, transparent);
            box-shadow: 0 0 20px #13ecd6;
            animation: scanMove 4s infinite ease-in-out; z-index: 20;
            transform: translateZ(0); /* Aceleración GPU */
        }

        @keyframes scanMove {
            0% { top: 10%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 70%; opacity: 0; }
        }

        .item-row {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
            padding: 1.25rem 0.5rem; display: flex;
            justify-content: space-between; align-items: center;
        }

        .money-display { 
            display: inline-block; 
            padding-right: 0.55em !important; /* Sincronizado v1.62 */
            white-space: nowrap; 
            font-family: 'Space Grotesk', sans-serif;
        }

        .text-gradient-cyan { 
            background: linear-gradient(135deg, #13ecd6 0%, #10b981 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }

        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    <!-- Desktop Frame Fix: makes fixed elements behave on desktop -->
    <script>
    (function(){
        function applyDesktopFix(){
            if(window.innerWidth < 768) return;
            var frame = document.querySelector('.app-frame');
            if(!frame) return;
            // Make frame the scroll container
            frame.style.overflowY = 'auto';
            frame.style.overflowX = 'hidden';
            // Convert fixed bottom elements to sticky
            var fixedEls = frame.querySelectorAll('[class*="fixed bottom"]');
            fixedEls.forEach(function(el){
                el.style.position = 'sticky';
                el.style.bottom = '0';
                el.style.left = 'auto';
                el.style.width = '100%';
                el.style.zIndex = '50';
            });
            // Convert fixed top elements to sticky
            var fixedTopEls = frame.querySelectorAll('[class*="fixed top"]');
            fixedTopEls.forEach(function(el){
                el.style.position = 'sticky';
                el.style.top = '0';
                el.style.left = 'auto';
                el.style.width = '100%';
                el.style.zIndex = '50';
            });
        }
        // Run on load and resize
        if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', applyDesktopFix);
        } else {
            applyDesktopFix();
        }
        window.addEventListener('resize', applyDesktopFix);
    })();
    </script>

        <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
