<!DOCTYPE html>
<html lang="es" class="app-shell" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Evidencia Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&display=swap');
        
        body { background:#000; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; }
        .tech-font { font-family: 'Space Grotesk', sans-serif; }

        /* Contenedor de Evidencia Visual */
        .receipt-image-container {
            position: relative; height: 320px; border-radius: 3rem;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            background: #050505; transform: translateZ(0);
        }
        .receipt-image {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.4;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        /* Animación de Escaneo IA Alpha */
        .ocr-scanner-line {
            position: absolute; top: 20%; left: 0; width: 100%; height: 2px;
            background: linear-gradient(to right, transparent, #13ecd6, transparent);
            box-shadow: 0 0 20px #13ecd6;
            animation: scanMove 4s infinite ease-in-out; z-index: 20;
        }
        @keyframes scanMove {
            0% { top: 10%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 80%; opacity: 0; }
        }

        .item-row {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
            padding: 1.25rem 0; display: flex;
            justify-content: space-between; align-items: center;
        }

        .text-gradient-cyan {
            background: linear-gradient(to right, #13ecd6, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; background:none; border:none; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: #13ecd6; }

        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>

    <script src="engine/router.js" defer></script>
</head>
<body class="app-shell bg-black">
<div class="app-frame">
    <div class="max-w-lg mx-auto px-5 py-6 space-y-8 pb-32">

        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/60 backdrop-blur-xl z-50 -mx-5 px-5 border-b border-white/5">
            <div class="flex items-center gap-4">
                <button onclick="SGRouter.back()" class="size-12 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all border border-white/5">
                    <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
                </button>
                <div class="text-left">
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em]">Audit Evidence</p>
                    <h1 class="text-xl font-black tech-font tracking-tighter uppercase italic leading-none">Evidencia Alpha</h1>
                </div>
            </div>
            <button onclick="SGRouter.navigate('dashboard')" class="size-12 glass-panel rounded-xl flex items-center justify-center text-[#13ecd6] border border-white/5 active:scale-95 transition-all">
                <span class="material-icons-round text-lg">dashboard</span>
            </button>
        </header>

        <section class="receipt-image-container reveal-node shadow-2xl">
            <div class="ocr-scanner-line"></div>
            <img src="https://images.unsplash.com/photo-1556742044-3c52d6e88c62?q=80&w=1200" class="receipt-image" alt="Receipt Preview">
            <div class="absolute bottom-8 left-8 right-8">
                <div class="flex items-center gap-2 mb-3">
                    <span class="px-2.5 py-1 bg-[#13ecd6]/10 text-[#13ecd6] text-[7px] font-black uppercase rounded-full border border-[#13ecd6]/20">Escaneo Verificado</span>
                </div>
                <h2 class="text-3xl font-black tech-font uppercase italic leading-none tracking-tighter">Sushi Kyoto Pro</h2>
                <p class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest mt-2">ID: REC-2026-ALPHA</p>
            </div>
        </section>

        <section class="glass-panel p-8 rounded-[3rem] border-[#13ecd6]/10 space-y-8 reveal-node" style="animation-delay: 0.1s">
            <div class="space-y-1">
                <p class="text-[9px] font-black text-zinc-500 uppercase tracking-[0.5em]">Total Extraído</p>
                <h3 class="text-6xl font-black tech-font text-gradient-cyan italic tracking-tighter">25,56€</h3>
            </div>

            <div class="space-y-1 border-t border-white/5 pt-4">
                <div class="item-row">
                    <p class="text-[10px] font-black text-zinc-400 uppercase tracking-wider">2x Combo Nigiri Alpha</p>
                    <p class="text-sm font-black tech-font text-white">18,50€</p>
                </div>
                <div class="item-row">
                    <p class="text-[10px] font-black text-zinc-400 uppercase tracking-wider">1x Gyoza Auditoría</p>
                    <p class="text-sm font-black tech-font text-white">7,06€</p>
                </div>
            </div>
        </section>

        <footer class="flex flex-col gap-4 reveal-node" style="animation-delay: 0.2s">
            <button onclick="SGRouter.navigate('split')" class="w-full py-6 bg-white text-black rounded-[2rem] font-black text-[10px] uppercase tracking-[0.5em] active:scale-95 transition-all shadow-xl">
                Procesar Reparto Táctico
            </button>
            <button onclick="SGRouter.back()" class="w-full py-6 glass-panel text-zinc-500 rounded-[2rem] font-black text-[10px] uppercase tracking-[0.5em] hover:text-white transition-all border border-white/5">
                Cerrar Evidencia
            </button>
        </footer>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item active">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>
</div>
</body>
</html>
