name: Deploy SplitGasto 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar dist
        run: |
          mkdir -p dist
          # Copia archivos excluyendo los que no quieres subir como assets
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "dist" \
            ! -name "proyecto" \
            ! -name "proyecto_new" \
            ! -name "screenshots" \
            ! -name "DEPLOY.sh" \
            ! -name "_worker.js" \
            -exec cp -r {} dist/ \;
          rm -rf dist/.git dist/.github
          echo "Archivos en dist:"
          ls -la dist/

      - name: Install Wrangler v4
        run: npm install -g wrangler@4

      - name: Deploy a Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
