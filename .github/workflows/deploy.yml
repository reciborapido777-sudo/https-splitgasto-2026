name: Deploy SplitGasto 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy a Cloudflare Workers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar dist (excluir .git y carpetas grandes)
        run: |
          mkdir dist
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "dist" \
            ! -name "proyecto" \
            ! -name "proyecto_new" \
            ! -name "screenshots" \
            ! -name "DEPLOY.sh" \
            -exec cp -r {} dist/ \;
          echo "Archivos: $(find dist/ -type f | wc -l)"

      - name: Deploy a Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@latest --silent
          wrangler deploy --name=https-splitgasto-2026
