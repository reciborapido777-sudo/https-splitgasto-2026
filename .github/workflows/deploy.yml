name: Deploy SplitGasto 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu

    name: Deploy a Cloudflare Workers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar dist
        run: |
          mkdir -p dist
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "dist" \
            ! -name "proyecto" \
            ! -name "proyecto_new" \
            ! -name "screenshots" \
            ! -name "DEPLOY.sh" \
            -exec cp -r {} dist/ \;
          rm -rf dist/.git dist/.github
          echo "✅ Archivos en dist/: $(find dist/ -type f | wc -l) — $(du -sh dist/ | cut -f1)"
          ls dist/

      - name: Deploy a Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
