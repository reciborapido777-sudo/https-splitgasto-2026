name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy SplitGasto 2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (excluir .git y artefactos)
        run: |
          mkdir -p dist
          rsync -av --exclude=dist --exclude=.git --exclude=.github . dist/
          find dist/ -name "*.pack" -delete
          find dist/ -name "*.idx" -delete
          echo "✅ Archivos: $(find dist/ -type f | wc -l)"

      - name: Deploy to Cloudflare Pages
        uses: AliSoftware/cloudflare-pages-deploy@v1.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: splitgasto
          directory: dist
          githubtokenForPreview: ${{ secrets.GITHUB_TOKEN }}
