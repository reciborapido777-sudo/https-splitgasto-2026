name: Deploy SplitGasto 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    name: Deploy a Cloudflare Workers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Ajusta según la versión que uses localmente

      - name: Install dependencies
        run: npm ci

      - name: Preparar dist
        run: |
          mkdir -p dist
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "dist" \
            ! -name "proyecto" \
            ! -name "proyecto_new" \
            ! -name "screenshots" \
            ! -name "DEPLOY.sh" \
            -exec cp -r {} dist/ \;
          rm -rf dist/.git dist/.github
          echo "✅ Archivos en dist/: $(find dist/ -type f | wc -l) — $(du -sh dist/ | cut -f1)"
          ls dist/

      - name: Check dist directory before deploy
        run: ls -la dist

      - name: Install Wrangler v4
        run: npm install -g wrangler@4

      - name: Check Wrangler version
        run: wrangler --version

      - name: Deploy a Cloudflare Workers
        run: wrangler deploy --verbose
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
