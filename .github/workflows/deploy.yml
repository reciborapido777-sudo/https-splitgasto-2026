name: Deploy SplitGasto 2026

on:
  push:
    branches: [main]
  workflow_dispatch:              
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar dist
        run: |
          mkdir -p dist
          echo "_worker.js" > .assetsignore
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "dist" \
            ! -name "proyecto" \
            ! -name "proyecto_new" \
            ! -name "screenshots" \
            ! -name "DEPLOY.sh" \
            ! -name "_worker.js" \
            -exec cp -r {} dist/ \;
          mv .assetsignore dist/
          rm -rf dist/.git dist/.github
          echo "✅ Archivos en dist/: $(find dist/ -type f | wc -l) — $(du -sh dist/ | cut -f1)"
          ls dist/

      - name: Install Wrangler v4
        run: npm install -g wrangler@4

      - name: Check Wrangler version
        run: wrangler --version

      - name: Deploy a Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
