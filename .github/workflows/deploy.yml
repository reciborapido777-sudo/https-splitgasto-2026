name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy SplitGasto 2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpeta dist (excluir .git y carpetas grandes)
        run: |
          mkdir dist
          find . -maxdepth 1 \
            ! -name '.' \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'dist' \
            ! -name 'proyecto' \
            ! -name 'proyecto_new' \
            ! -name 'screenshots' \
            ! -name 'DEPLOY.sh' \
            -exec cp -r {} dist/ \;
          echo "✅ Archivos: $(find dist/ -type f | wc -l) — $(du -sh dist/ | cut -f1)"
          ls dist/

      - name: Deploy a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@latest --silent
          wrangler pages deploy dist \
            --project-name=splitgasto \
            --commit-dirty=true
