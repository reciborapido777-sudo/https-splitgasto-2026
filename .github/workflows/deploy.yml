name: Deploy SplitGasto 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar archivos
        run: |
          echo "=== Raíz del repositorio ==="
          ls -la
          echo "=== .assetsignore ==="
          cat .assetsignore
          echo "Total HTML: $(find . -maxdepth 1 -name '*.html' | wc -l)"

      - name: Install Wrangler v4
        run: npm install -g wrangler@4

      - name: Deploy a Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
