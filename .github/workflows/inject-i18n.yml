name: Inject i18n.js into all HTML

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Insert engine/i18n.js before </head>
        run: |
          TARGET='    <script src="engine/i18n.js" defer></script>'
          for file in $(find . -name "*.html" -not -path "./node_modules/*" -not -path "./.git/*"); do
            if grep -q 'engine/i18n.js' "$file"; then
              echo "⏭️  Skip (ya tiene i18n): $file"
            elif grep -q '</head>' "$file"; then
              sed -i "s|</head>|$TARGET\n</head>|" "$file"
              echo "✅ Modificado: $file"
            else
              echo "⚠️  Skip (sin </head>): $file"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "feat(i18n): cargar engine/i18n.js en todos los HTML" && git push)
