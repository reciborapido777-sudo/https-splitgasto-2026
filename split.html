<!DOCTYPE html>
<html lang="es" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Reparto Elite | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        .control-display {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1) 0%, rgba(19, 236, 214, 0.05) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-btn { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .game-btn:active { transform: scale(0.95); }
        
        .active-glow {
            border-color: #a855f7 !important;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
            background: rgba(168, 85, 247, 0.08) !important;
        }

        .participant-row {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            z-index: 1;
        }
        .participant-row:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .participant-row:hover .avatar-img {
            filter: grayscale(0) !important;
            border-color: #13ecd6 !important;
            box-shadow: 0 0 20px rgba(19, 236, 214, 0.2);
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SplitGasto">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <script src="engine/router.js"></script>
    <script src="engine/desktop-fix.js" defer></script>
    <script src="engine/auth.js"></script>
    <script src="engine/api.js"></script>
</head>
<body class="app-shell pb-32">
<div class="app-frame">
    <div class="max-w-7xl mx-auto px-6 py-8 space-y-10">
        
        <header class="flex justify-between items-center py-4 reveal">
            <div class="flex items-center gap-6">
                <button onclick="SGRouter.back()" class="size-14 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all shadow-xl">
                    <span class="material-icons-round text-zinc-500 text-3xl">arrow_back</span>
                </button>
                
                <div class="flex items-center gap-4 cursor-pointer group" onclick="SGRouter.navigate('profile', 'split')">
                    <div class="relative">
                        <div class="absolute -inset-1 bg-[#FF9D42] rounded-xl blur opacity-20 group-hover:opacity-40 transition-all"></div>
                        <img src="https://api.dicebear.com/9.x/initials/svg?seed=SG&backgroundColor=1a2a1a&fontFamily=Arial&fontSize=40" class="relative size-12 rounded-xl border border-[#FF9D42]/30 group-hover:border-[#FF9D42] transition-all" alt="Comandante">
                    </div>
                    <div>
                        <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em] mb-0.5">Socio Fundador</p>
                        <h1 class="text-base font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Perfil Alpha</h1>
                    </div>
                </div>
            </div>

            <button onclick="SGRouter.navigate('dashboard', 'split')" class="px-5 py-3 rounded-2xl glass-panel flex items-center gap-3 border-white/5 hover:bg-white/10 transition-all">
                <span class="material-icons-round text-[#13ecd6] text-sm">dashboard</span>
                <span class="text-[9px] font-black uppercase tracking-widest text-zinc-400">Mando</span>
            </button>
        </header>

        <section class="space-y-6 reveal" style="animation-delay: 0.1s">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div onclick="updateControl(this, 'Ruleta')" class="game-btn glass-panel p-6 flex flex-col items-center gap-3 cursor-pointer group">
                    <span class="material-icons-round text-[#a855f7] text-2xl group-hover:rotate-180 transition-transform duration-700">autorenew</span>
                    <span class="text-[9px] font-black uppercase tracking-widest text-zinc-500 group-hover:text-white transition-colors">Ruleta Alpha</span>
                </div>
                <div onclick="updateControl(this, 'Carta Alta')" class="game-btn glass-panel p-6 flex flex-col items-center gap-3 cursor-pointer group">
                    <span class="material-icons-round text-[#a855f7] text-2xl group-hover:-translate-y-1 transition-transform">style</span>
                    <span class="text-[9px] font-black uppercase tracking-widest text-zinc-500 group-hover:text-white transition-colors">Carta Alta</span>
                </div>
                <div onclick="updateControl(this, 'Dardos')" class="game-btn glass-panel p-6 flex flex-col items-center gap-3 cursor-pointer group">
                    <span class="material-icons-round text-[#a855f7] text-2xl group-hover:scale-125 transition-transform">ads_click</span>
                    <span class="text-[9px] font-black uppercase tracking-widest text-zinc-500 group-hover:text-white transition-colors">Dardos</span>
                </div>
                <div onclick="updateControl(this, 'Moneda')" class="game-btn glass-panel p-6 flex flex-col items-center gap-3 cursor-pointer group">
                    <span class="material-icons-round text-[#a855f7] text-2xl group-hover:animate-bounce">monetization_on</span>
                    <span class="text-[9px] font-black uppercase tracking-widest text-zinc-500 group-hover:text-white transition-colors">Moneda</span>
                </div>
            </div>

            <div id="game-control-panel" class="control-display p-8 rounded-[2.5rem] flex flex-col md:flex-row justify-between items-center gap-6 border-white/10 shadow-2xl">
                <div class="flex items-center gap-5">
                    <div class="size-12 rounded-full bg-[#a855f7]/20 flex items-center justify-center border border-[#a855f7]/30 shadow-[0_0_20px_rgba(168,85,247,0.2)]">
                        <span id="game-icon" class="material-icons-round text-[#a855f7] animate-pulse">psychology</span>
                    </div>
                    <div>
                        <p class="text-[9px] font-black text-zinc-500 uppercase tracking-widest">Estado de Ejecución</p>
                        <h4 id="active-game-label" class="text-xl font-black font-['Space_Grotesk'] uppercase italic">Seleccione Juego</h4>
                    </div>
                </div>
                <button onclick="executeSplit()" class="w-full md:w-auto px-10 py-5 bg-white text-black rounded-2xl font-black text-[10px] uppercase tracking-[0.4em] hover:bg-[#13ecd6] transition-all active:scale-95 shadow-xl">
                    Ejecutar Reparto
                </button>
            </div>
        </section>

        <!-- Selector de grupo -->
        <section class="glass-panel p-5 rounded-[2rem] reveal" style="animation-delay: 0.15s">
          <div class="flex items-center gap-4">
            <div class="size-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:rgba(168,85,247,0.15)">
              <span class="material-icons-round text-[#a855f7]">groups_3</span>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-[9px] font-black text-zinc-600 uppercase tracking-widest mb-1">Grupo Activo</p>
              <select id="split-group-selector" class="w-full bg-transparent text-white font-black text-base outline-none cursor-pointer"
                style="border:none;background:transparent;font-family:'Space_Grotesk',sans-serif"
                onchange="onSplitGroupChange(this.value)">
                <option value="">Cargando grupos…</option>
              </select>
            </div>
            <button onclick="SGRouter.navigate('add-expense','split')"
              class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all"
              style="background:rgba(19,236,214,0.1);color:#13ecd6;border:1px solid rgba(19,236,214,0.2)">
              <span class="material-icons-round text-sm">add</span>
              Gasto
            </button>
          </div>
        </section>

        <main class="glass-panel p-10 rounded-[3.5rem] border-[#13ecd6]/10 space-y-8 reveal" style="animation-delay: 0.2s">
            <div class="flex justify-between items-center border-b border-white/5 pb-6">
                <div class="flex items-center gap-4">
                    <span class="size-3 bg-[#13ecd6] rounded-full animate-pulse"></span>
                    <h2 id="split-group-name" class="text-3xl font-black font-['Space_Grotesk'] uppercase italic tracking-tighter leading-none">Cargando…</h2>
                </div>
                <p id="split-total" class="text-4xl font-black font-['Space_Grotesk'] text-[#13ecd6] money-display leading-none">0,00€</p>
            </div>
            <div id="split-participants" class="grid grid-cols-1 gap-4">
                <p class="text-xs text-zinc-600 text-center py-6">Cargando participantes…</p>
            </div>
        </main>

<script>
let _splitGroups = [];
let _currentGroupId = null;

async function initSplit() {
  if (!SGAuth || !SGAuth.isLoggedIn()) {
    SGRouter.showToast('Inicia sesión primero', 'error');
    setTimeout(() => SGRouter.navigate('auth-login'), 1500);
    return;
  }

  // Leer el perfil del usuario para el header
  SGApi.getProfile().then(profile => {
    if (profile?.success && profile.profile) {
      const p = profile.profile;
      const headerName = document.querySelector('header h1');
      if (headerName) headerName.textContent = p.name || 'Perfil Alpha';
      const headerAvatar = document.querySelector('header img[alt="Comandante"]');
      if (headerAvatar && p.name) {
        const seed = encodeURIComponent(p.name.slice(0,2).toUpperCase());
        headerAvatar.src = `https://api.dicebear.com/9.x/initials/svg?seed=${seed}&backgroundColor=1a2a1a&fontFamily=Arial&fontSize=40`;
      }
    }
  }).catch(() => {});

  // Cargar lista de grupos
  const groupsResult = await SGApi.getGroups().catch(() => null);
  _splitGroups = (groupsResult?.success && groupsResult.groups) ? groupsResult.groups : [];

  const sel = document.getElementById('split-group-selector');
  const nameEl = document.getElementById('split-group-name');
  const contEl = document.getElementById('split-participants');

  if (_splitGroups.length === 0) {
    if (sel) sel.innerHTML = '<option value="">Sin grupos</option>';
    if (nameEl) nameEl.textContent = 'Sin grupos';
    if (contEl) contEl.innerHTML = `<div class="text-center py-8 space-y-3">
      <p class="text-zinc-500 text-sm">No tienes grupos todavía</p>
      <button onclick="SGRouter.navigate('create-group','split')" class="px-5 py-2 rounded-xl text-sm font-bold" style="background:rgba(19,236,214,0.1);color:#13ecd6">
        + Crear grupo
      </button>
    </div>`;
    return;
  }

  // Poblar selector
  if (sel) {
    sel.innerHTML = _splitGroups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
  }

  // Determinar grupo inicial: URL param > primer grupo
  const params = new URLSearchParams(window.location.search);
  let groupId = params.get('groupId');
  if (!groupId || !_splitGroups.find(g => String(g.id) === String(groupId))) {
    groupId = _splitGroups[0].id;
  }

  if (sel) sel.value = groupId;
  await loadGroupData(groupId);
}

async function onSplitGroupChange(groupId) {
  if (!groupId) return;
  _currentGroupId = groupId;
  // Actualizar la URL sin recargar la página
  const newUrl = window.location.pathname + '?groupId=' + groupId + '&from=split';
  window.history.replaceState({}, '', newUrl);
  await loadGroupData(groupId);
}

async function loadGroupData(groupId) {
  _currentGroupId = groupId;
  const group = _splitGroups.find(g => String(g.id) === String(groupId)) || _splitGroups[0];
  const myUid = SGAuth.getUserId();

  const nameEl  = document.getElementById('split-group-name');
  const totalEl = document.getElementById('split-total');
  const contEl  = document.getElementById('split-participants');

  if (nameEl) nameEl.textContent = group.name;
  if (contEl) contEl.innerHTML = '<p class="text-xs text-zinc-600 text-center py-6">Cargando…</p>';

  try {
    const [memResult, expResult, balResult] = await Promise.all([
      SGApi.getGroupMembers(group.id).catch(() => null),
      SGApi.getExpenses(group.id).catch(() => null),
      SGApi.getBalances(group.id).catch(() => null)
    ]);

    // Total gastos del grupo
    const expenses = (expResult?.success && expResult.expenses) ? expResult.expenses : [];
    const total = expenses.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
    if (totalEl) totalEl.textContent = total.toLocaleString('es-ES', { minimumFractionDigits:2, maximumFractionDigits:2 }) + '€';

    // Balances
    const balancesRaw = (balResult?.success && balResult.balances) ? balResult.balances : {};

    // Miembros con nombres reales
    const members = (memResult?.success && memResult.members && memResult.members.length > 0)
      ? memResult.members
      : Object.keys(balancesRaw).map(id => ({ id, name: null, role: 'member' }));

    if (members.length === 0) {
      if (contEl) contEl.innerHTML = `<div class="text-center py-6 space-y-3">
        <p class="text-zinc-600 text-xs">Sin participantes en este grupo</p>
        <p class="text-zinc-700 text-xs">Ve a Crear Grupo para añadir miembros por email</p>
      </div>`;
      return;
    }

    const perPerson = members.length > 0 ? total / members.length : total;
    const colors = ['#FF9D42', '#a855f7', '#13ecd6', '#ec4899', '#22c55e', '#3b82f6'];

    // Comprobar si soy admin
    const myMember = members.find(m => String(m.id) === String(myUid));
    const isAdmin = myMember?.role === 'admin';

    if (contEl) contEl.innerHTML = members.map((m, i) => {
      const isMe     = String(m.id) === String(myUid);
      const name     = isMe ? (m.name || 'Tú') : (m.name || `Socio ${i+1}`);
      const initials = name.slice(0,2).toUpperCase();
      const color    = colors[i % colors.length];
      const bal      = parseFloat(balancesRaw[m.id]) || 0;
      const balSign  = bal >= 0 ? '+' : '';
      const balColor = bal > 0.01 ? '#13ecd6' : (bal < -0.01 ? '#ef4444' : '#6b7280');
      const roleLabel = m.role === 'admin' ? 'Admin' : (isMe ? 'Usted' : 'Socio');

      // Mostrar botón eliminar miembro solo si soy admin y no es el propio admin
      const canRemove = isAdmin && !isMe;

      return `
        <div class="participant-row flex items-center justify-between p-5 glass-panel rounded-2xl border-white/5">
          <div class="flex items-center gap-4">
            <div class="avatar-img size-10 rounded-xl border flex items-center justify-center font-black text-sm transition-all"
                 style="background:${color}22;color:${color};border-color:${color}33">${initials}</div>
            <div>
              <p class="text-[8px] font-black text-zinc-500 uppercase tracking-widest leading-none">${roleLabel}</p>
              <p class="text-xs font-black uppercase text-white">${name}</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <p class="font-black font-['Space_Grotesk'] money-display leading-none ${isMe ? 'text-white' : 'text-zinc-400'}">
                ${perPerson.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}€
              </p>
              <p class="text-[8px] font-black uppercase tracking-widest mt-0.5" style="color:${balColor}">
                ${balSign}${bal.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}€
              </p>
            </div>
            ${canRemove ? `
            <button onclick="removeMemberFromGroup('${group.id}','${m.id}','${name}')"
              class="size-8 flex items-center justify-center rounded-xl transition-all hover:bg-red-500/20"
              title="Eliminar miembro" style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15)">
              <span class="material-icons-round text-red-400 text-sm">person_remove</span>
            </button>` : ''}
          </div>
        </div>`;
    }).join('');

  } catch (e) {
    console.error('Split loadGroupData error:', e);
    if (contEl) contEl.innerHTML = '<p class="text-xs text-zinc-600 text-center py-6">Error al cargar datos</p>';
  }
}

function _closeSplitModal(id) { const el = document.getElementById(id); if (el) el.remove(); }

function removeMemberFromGroup(groupId, memberId, memberName) {
  const modalId = 'remove-member-modal';
  _closeSplitModal(modalId);
  const safeName = String(memberName).replace(/</g, '&lt;');
  const modal = document.createElement('div');
  modal.id = modalId;
  modal.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px)';
  modal.innerHTML = `
    <div style="background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:28px;max-width:340px;width:90%;text-align:center">
      <span class="material-icons-round" style="font-size:36px;color:#ef4444;margin-bottom:10px;display:block">person_remove</span>
      <h3 style="font-size:15px;font-weight:800;margin-bottom:4px">Eliminar participante</h3>
      <p style="font-size:13px;color:#aaa;margin-bottom:6px">${safeName}</p>
      <p style="font-size:11px;color:#666;margin-bottom:20px">Sus gastos se mantendrán en el grupo.</p>
      <div style="display:flex;gap:10px">
        <button onclick="_closeSplitModal('${modalId}')" style="flex:1;padding:11px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#999;font-weight:700;font-size:13px;cursor:pointer">Cancelar</button>
        <button id="confirm-remove-member-btn" style="flex:1;padding:11px;border-radius:14px;border:none;background:#ef4444;color:#fff;font-weight:800;font-size:13px;cursor:pointer">Eliminar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', (e) => { if (e.target === modal) _closeSplitModal(modalId); });
  document.getElementById('confirm-remove-member-btn').addEventListener('click', async () => {
    _closeSplitModal(modalId);
    try {
      const res = await SGApi.removeGroupMember(groupId, memberId);
      if (res && res.success) {
        SGRouter.showToast(`${memberName} eliminado del grupo`, 'success');
        await loadGroupData(groupId);
      } else {
        SGRouter.showToast(res?.error || 'Error al eliminar miembro', 'error');
      }
    } catch(e) {
      SGRouter.showToast('Error de conexión', 'error');
    }
  });
}

initSplit();

// Recargar al volver con bfcache o tras añadir miembro
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    initSplit();
  } else {
    try {
      const flag = sessionStorage.getItem('sg_member_added');
      if (flag) {
        sessionStorage.removeItem('sg_member_added');
        // Pequeño delay para asegurar propagación D1
        setTimeout(() => initSplit(), 300);
      }
    } catch {}
  }
});
</script>
<script>
    let selectedGame = null;

    function updateControl(element, game) {
        document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active-glow'));
        selectedGame = game;
        element.classList.add('active-glow');
        
        const label = document.getElementById('active-game-label');
        const icon = document.getElementById('game-icon');
        
        label.innerText = game.toUpperCase() + ' ACTIVA';
        label.style.color = '#a855f7';
        
        const icons = {
            'Ruleta': 'autorenew', 'Carta Alta': 'style', 'Dardos': 'ads_click', 'Moneda': 'monetization_on'
        };
        icon.innerText = icons[game] || 'psychology';
        
        SGRouter.showToast(`${game} lista para ejecución`, 'info');
    }

    const gameRoutes = {
        'Ruleta': 'game-roulette',
        'Carta Alta': 'game-cards',
        'Dardos': 'game-darts',
        'Moneda': 'game-coin'
    };

    function executeSplit() {
        if (!selectedGame) {
            SGRouter.showToast('Seleccione un protocolo de azar', 'error');
            return;
        }
        const route = gameRoutes[selectedGame];
        SGRouter.showToast(`Lanzando ${selectedGame}…`, 'premium');
        setTimeout(() => SGRouter.navigate(route, 'split'), 600);
    }
</script>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
</div>
</body>
</html>
