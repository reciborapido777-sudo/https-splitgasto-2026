<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Motor de Reparto | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Estilos del Motor de Azar */
        .control-display {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1) 0%, rgba(19, 236, 214, 0.05) 100%);
            border: 1px solid var(--glass-border);
            transition: var(--transition-alpha);
        }

        .game-btn { transition: var(--transition-alpha); cursor: pointer; }
        .active-glow {
            border-color: var(--purple-deep) !important;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
            background: rgba(168, 85, 247, 0.08) !important;
        }

        .participant-row { transition: var(--transition-alpha); border: 1px solid var(--glass-border); }
        .participant-row:hover { background: rgba(255, 255, 255, 0.04); transform: translateY(-4px); }
        
        /* Navigation Sync */
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: var(--cian-tech); }
    </style>

    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame">
    <div class="max-w-lg mx-auto px-4 py-6 space-y-8">
        
        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/80 backdrop-blur-xl z-50 -mx-4 px-4">
            <div class="flex items-center gap-4">
                <button onclick="SGRouter.back()" class="size-12 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all">
                    <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
                </button>
                <div class="flex items-center gap-3 cursor-pointer" onclick="SGRouter.navigate('profile')">
                    <img src="https://api.dicebear.com/9.x/initials/svg?seed=SG&backgroundColor=1a2a1a" class="size-10 rounded-xl border border-[#FF9D42]/30" alt="">
                    <div>
                        <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.4em]">Comandante</p>
                        <h1 class="text-sm font-black font-['Space_Grotesk'] uppercase italic leading-none">Perfil Alpha</h1>
                    </div>
                </div>
            </div>
            <button onclick="SGRouter.navigate('dashboard')" class="px-4 py-2.5 rounded-xl glass-panel text-[#13ecd6] border-white/5 active:scale-95 transition-all">
                <span class="material-icons-round text-lg">dashboard</span>
            </button>
        </header>

        <section class="grid grid-cols-4 gap-3 reveal-node">
            <div onclick="updateControl(this, 'Ruleta')" class="game-btn glass-panel p-4 flex flex-col items-center gap-2 rounded-2xl">
                <span class="material-icons-round text-[#a855f7] text-xl">autorenew</span>
                <p class="text-[7px] font-black uppercase text-zinc-500">Ruleta</p>
            </div>
            <div onclick="updateControl(this, 'Carta Alta')" class="game-btn glass-panel p-4 flex flex-col items-center gap-2 rounded-2xl">
                <span class="material-icons-round text-[#a855f7] text-xl">style</span>
                <p class="text-[7px] font-black uppercase text-zinc-500">Cartas</p>
            </div>
            <div onclick="updateControl(this, 'Dardos')" class="game-btn glass-panel p-4 flex flex-col items-center gap-2 rounded-2xl">
                <span class="material-icons-round text-[#a855f7] text-xl">ads_click</span>
                <p class="text-[7px] font-black uppercase text-zinc-500">Dardos</p>
            </div>
            <div onclick="updateControl(this, 'Moneda')" class="game-btn glass-panel p-4 flex flex-col items-center gap-2 rounded-2xl">
                <span class="material-icons-round text-[#a855f7] text-xl">monetization_on</span>
                <p class="text-[7px] font-black uppercase text-zinc-500">Moneda</p>
            </div>
        </section>

        <div id="game-control-panel" class="control-display p-6 rounded-[2.5rem] flex flex-col gap-6 reveal-node" style="animation-delay: 0.1s">
            <div class="flex items-center gap-4">
                <div class="size-10 rounded-full bg-[#a855f7]/20 flex items-center justify-center border border-[#a855f7]/30">
                    <span id="game-icon" class="material-icons-round text-[#a855f7] text-lg animate-pulse">psychology</span>
                </div>
                <div>
                    <p class="text-[8px] font-black text-zinc-500 uppercase tracking-widest">Protocolo Seleccionado</p>
                    <h4 id="active-game-label" class="text-base font-black font-['Space_Grotesk'] uppercase italic">Esperando...</h4>
                </div>
            </div>
            <button onclick="executeSplit()" class="w-full py-4 bg-white text-black rounded-2xl font-black text-[10px] uppercase tracking-[0.4em] active:scale-95 transition-all shadow-xl">
                Ejecutar Reparto
            </button>
        </div>

        <main class="glass-panel p-6 rounded-[3rem] space-y-6 reveal-node" style="animation-delay: 0.2s">
            <div class="flex justify-between items-end border-b border-white/5 pb-4">
                <h2 class="text-xl font-black font-['Space_Grotesk'] uppercase italic tracking-tighter">Sushi Kyoto Pro</h2>
                <p class="text-2xl font-black font-['Space_Grotesk'] text-[#13ecd6] money-display">25,56€</p>
            </div>
            
            <div class="space-y-3">
                <div class="participant-row flex items-center justify-between p-4 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <img src="https://api.dicebear.com/9.x/initials/svg?seed=SG&backgroundColor=1a2a1a" class="size-10 rounded-xl border border-[#FF9D42]/30">
                        <div>
                            <p class="text-[7px] font-black text-zinc-500 uppercase leading-none">Usted</p>
                            <p class="text-xs font-black uppercase text-white">Comandante</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-black font-['Space_Grotesk'] money-display text-white">8,52€</p>
                        <span class="text-[7px] font-black text-[#13ecd6] uppercase tracking-widest">Liquidado</span>
                    </div>
                </div>

                <div class="participant-row flex items-center justify-between p-4 rounded-2xl opacity-60">
                    <div class="flex items-center gap-4">
                        <img src="https://api.dicebear.com/9.x/initials/svg?seed=MR&backgroundColor=0a2a1a" class="size-10 rounded-xl">
                        <p class="text-xs font-black uppercase">Mario</p>
                    </div>
                    <p class="font-black font-['Space_Grotesk'] money-display text-zinc-400">8,52€</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let selectedGame = null;
        const gameIcons = { 'Ruleta': 'autorenew', 'Carta Alta': 'style', 'Dardos': 'ads_click', 'Moneda': 'monetization_on' };
        const gameRoutes = { 'Ruleta': 'game-roulette', 'Carta Alta': 'game-cards', 'Dardos': 'game-darts', 'Moneda': 'game-coin' };

        function updateControl(element, game) {
            document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active-glow'));
            selectedGame = game;
            element.classList.add('active-glow');
            
            document.getElementById('active-game-label').innerText = game.toUpperCase() + ' ACTIVA';
            document.getElementById('game-icon').innerText = gameIcons[game];
            SGRouter.showToast(`${game} lista`, 'info');
        }

        function executeSplit() {
            if (!selectedGame) {
                SGRouter.showToast('Seleccione protocolo', 'error');
                return;
            }
            SGRouter.showToast(`Iniciando ${selectedGame}`, 'premium');
            setTimeout(() => SGRouter.navigate(gameRoutes[selectedGame]), 600);
        }
    </script>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item active" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>
</div>
</body>
</html>
