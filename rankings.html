<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Rankings Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Estética de Clasificación de Élite */
        .podium-block {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            border-radius: 1.5rem 1.5rem 0 0; position: relative;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            border: 1px solid var(--glass-border); border-bottom: none;
        }
        
        .medal-badge {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; position: absolute; top: -20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .gold { background: linear-gradient(135deg, #D4AF37, #FFD700); color: #000; }
        .silver { background: linear-gradient(135deg, #C0C0C0, #E8E8E8); color: #000; }
        .bronze { background: linear-gradient(135deg, #CD7F32, #A0522D); color: #fff; }

        .xp-bar { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .xp-fill { 
            height: 100%; background: linear-gradient(90deg, var(--cian-tech), var(--purple-deep));
            box-shadow: 0 0 15px var(--cian-tech);
        }

        .rank-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            transition: var(--transition-alpha);
        }
        .rank-card.is-me { border-color: var(--cian-tech); background: rgba(19, 236, 214, 0.03); }

        .achievement-slot {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            filter: grayscale(1); opacity: 0.5;
        }
        .achievement-slot.unlocked { filter: grayscale(0); opacity: 1; border-color: #D4AF37/30; }
    </style>
    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame">
    
    <header class="flex justify-between items-center px-6 py-5 sticky top-0 z-50 bg-black/80 backdrop-blur-xl border-b border-white/5">
        <button onclick="SGRouter.back()" class="size-11 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all">
            <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
        </button>
        <div class="text-center">
            <p class="text-[8px] font-black text-[#D4AF37] uppercase tracking-[0.4em]">Jerarquía Alpha</p>
            <h1 class="text-sm font-black font-['Space_Grotesk'] tracking-widest uppercase italic text-white">Rankings Global</h1>
        </div>
        <div class="size-11 glass-panel rounded-2xl flex items-center justify-center">
            <span class="material-icons-round text-lg text-[#D4AF37]">workspace_premium</span>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-6 py-6 space-y-8">

        <section class="rank-card is-me p-6 rounded-[2.5rem] reveal-node">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                    <div class="size-14 rounded-2xl bg-[#13ecd6]/10 flex items-center justify-center border border-[#13ecd6]/20">
                        <span class="text-xl font-black text-[#13ecd6]">C</span>
                    </div>
                    <div>
                        <h2 class="font-black text-white italic tracking-wide">Commander</h2>
                        <p class="text-[9px] font-bold text-[#13ecd6] uppercase tracking-widest">Socio Fundador • LVL 12</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-3xl font-black text-[#13ecd6] italic">#7</p>
                    <p class="text-[8px] font-black text-zinc-600 uppercase">Global</p>
                </div>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between text-[9px] font-black text-zinc-500 uppercase tracking-tighter">
                    <span>8.420 / 10.000 XP</span>
                    <span class="text-[#13ecd6]">84% PROGRESO</span>
                </div>
                <div class="xp-bar"><div class="xp-fill" style="width: 84%"></div></div>
            </div>
        </section>

        <nav class="flex p-1.5 glass-panel rounded-2xl reveal-node" style="animation-delay: 0.1s">
            <button class="flex-1 py-3 text-[9px] font-black uppercase tracking-widest text-[#13ecd6] bg-[#13ecd6]/10 rounded-xl">Global</button>
            <button class="flex-1 py-3 text-[9px] font-black uppercase tracking-widest text-zinc-500">Semanal</button>
            <button class="flex-1 py-3 text-[9px] font-black uppercase tracking-widest text-zinc-500">Logros</button>
        </nav>

        <section class="flex items-end justify-center gap-4 h-48 pt-8 reveal-node" style="animation-delay: 0.2s">
            <div class="flex flex-col items-center gap-3">
                <div class="size-10 rounded-full glass-panel border-zinc-500/30 flex items-center justify-center font-bold text-zinc-400">M</div>
                <div class="podium-block w-24 h-24">
                    <div class="medal-badge silver text-lg italic">2</div>
                    <p class="text-[9px] font-black text-zinc-400 pb-4">7.890 XP</p>
                </div>
            </div>
            <div class="flex flex-col items-center gap-3">
                <div class="size-12 rounded-full glass-panel border-[#D4AF37]/30 flex items-center justify-center text-xl">🏆</div>
                <div class="podium-block w-28 h-32 border-[#D4AF37]/20">
                    <div class="medal-badge gold text-xl italic">1</div>
                    <p class="text-[10px] font-black text-[#D4AF37] pb-5">12.450 XP</p>
                </div>
            </div>
            <div class="flex flex-col items-center gap-3">
                <div class="size-10 rounded-full glass-panel border-[#FF9D42]/30 flex items-center justify-center font-bold text-[#FF9D42]">E</div>
                <div class="podium-block w-24 h-20">
                    <div class="medal-badge bronze text-lg italic">3</div>
                    <p class="text-[9px] font-black text-[#FF9D42] pb-4">6.210 XP</p>
                </div>
            </div>
        </section>

        <section class="space-y-3 reveal-node" style="animation-delay: 0.3s">
            <div class="rank-card p-4 rounded-2xl flex items-center gap-4">
                <span class="w-6 text-[10px] font-black text-zinc-600">#4</span>
                <div class="size-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-500 font-bold">C</div>
                <div class="flex-1">
                    <h3 class="text-xs font-black text-white">CryptoKing</h3>
                    <p class="text-[9px] text-zinc-500 font-bold uppercase">Nivel 9 • Ballena</p>
                </div>
                <p class="text-xs font-black text-white">5.840 XP</p>
            </div>
            </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item active">
                <span class="material-icons-round">emoji_events</span>
                <p>Rankings</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('vault')">
                <span class="material-icons-round">auto_stories</span>
                <p>Bóveda</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>
</div>
</body>
</html>
