<!DOCTYPE html>
<html lang="es" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Transacción | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Plus+Jakarta+Sans:wght@800&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {  
            background: #000; color: #fff; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; margin: 0; 
            overflow-x: hidden !important;
            box-sizing: border-box;
            overscroll-behavior: contain; touch-action: manipulation; 
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transform: translateZ(0);
        }

        .ticket-container {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .ticket-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #13ecd6, #10b981, #13ecd6);
            opacity: 0.6;
        }

        .success-glow {
            position: relative;
            width: 100px; height: 100px;
            background: rgba(19, 236, 214, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(19, 236, 214, 0.25);
            box-shadow: 0 0 40px rgba(19, 236, 214, 0.08);
            animation: pulseSuccess 3s infinite ease-in-out;
            transform: translateZ(0);
        }

        @keyframes pulseSuccess {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(19, 236, 214, 0.05); }
            50% { transform: scale(1.06); box-shadow: 0 0 50px rgba(19, 236, 214, 0.2); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(19, 236, 214, 0.05); }
        }

        .text-gradient-cyan { 
            background: linear-gradient(135deg, #13ecd6 0%, #10b981 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .audit-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 16px;
        }
        .audit-row:last-child { border-bottom: none; }
        
        .audit-label {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #52525b;
            white-space: nowrap;
            padding-top: 2px;
        }
        
        .audit-value {
            font-size: 13px;
            font-weight: 700;
            color: #e4e4e7;
            text-align: right;
            word-break: break-word;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .audit-value.txid {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.05em;
            color: #71717a;
        }
        
        .audit-value.balance-zero {
            color: #13ecd6;
            font-weight: 900;
        }
        
        .audit-value.timestamp {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #a1a1aa;
        }

        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .btn-premium-cyan:hover {
            background: #13ecd6;
            color: #000;
            box-shadow: 0 0 40px rgba(19, 236, 214, 0.4);
        }
    
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
        .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
        .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
        .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
        .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
        
        .badge-type {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
    </style>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SplitGasto">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <script src="engine/router.js"></script>
    <script src="engine/desktop-fix.js" defer></script>
    <script src="engine/auth.js"></script>
    <script src="engine/i18n.js"></script>
</head>
<body class="app-shell pb-32">  <!-- quitar p-6 y text-center -->
<div class="app-frame">
    <div class="max-w-md mx-auto px-4 sm:px-6 py-8 space-y-8">  <!-- añadir px-4 sm:px-6 y py-8 -->

        <!-- Header Visual -->
        <div class="reveal-node flex flex-col items-center space-y-5 pt-4">
            <div class="success-glow">
                <span class="material-icons-round text-[#13ecd6] text-5xl">receipt_long</span>
            </div>
            <div class="space-y-2">
                <div class="flex items-center justify-center gap-2">
                    <span class="badge-type bg-[#13ecd6]/10 text-[#13ecd6] border border-[#13ecd6]/20">
                        <span class="material-icons-round text-[10px]">verified</span>
                        Ticket Auditado
                    </span>
                </div>
                <h1 class="text-3xl md:text-4xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic text-white leading-none">
                    Transacción<br><span class="text-gradient-cyan">Confirmada</span>
                </h1>
            </div>
        </div>

        <!-- TICKET DE TRANSACCIÓN -->
        <section class="ticket-container p-6 sm:p-8 space-y-1 reveal-node text-left" style="animation-delay: 0.15s">
            
            <!-- Tipo de operación -->
            <div class="audit-row">
                <span class="audit-label">Operación</span>
                <span class="audit-value" id="ticket-type">—</span>
            </div>
            
            <!-- TXID -->
            <div class="audit-row">
                <span class="audit-label">ID Transacción</span>
                <span class="audit-value txid" id="ticket-txid">—</span>
            </div>
            
            <!-- Timestamp exacto -->
            <div class="audit-row">
                <span class="audit-label">Timestamp UTC</span>
                <span class="audit-value timestamp" id="ticket-timestamp">—</span>
            </div>
            
            <!-- Grupo -->
            <div class="audit-row">
                <span class="audit-label">Nodo / Grupo</span>
                <span class="audit-value" id="ticket-group">—</span>
            </div>
            
            <!-- Descripción -->
            <div class="audit-row" id="row-description" style="display:none">
                <span class="audit-label">Concepto</span>
                <span class="audit-value" id="ticket-description">—</span>
            </div>
            
            <!-- Monto -->
            <div class="audit-row">
                <span class="audit-label">Importe</span>
                <span class="audit-value text-gradient-cyan" id="ticket-amount">—</span>
            </div>
            
            <!-- Método / Split -->
            <div class="audit-row" id="row-split" style="display:none">
                <span class="audit-label">Método de Split</span>
                <span class="audit-value" id="ticket-split">—</span>
            </div>
            
            <!-- Participantes / Deudor-Acreedor -->
            <div class="audit-row" id="row-participants" style="display:none">
                <span class="audit-label" id="label-participants">Participantes</span>
                <span class="audit-value" id="ticket-participants">—</span>
            </div>
            
            <!-- BALANCE RESULTANTE (clave para liquidaciones) -->
            <div class="audit-row" id="row-balance" style="display:none">
                <span class="audit-label">Balance Resultante</span>
                <span class="audit-value balance-zero" id="ticket-balance">—</span>
            </div>
            
            <!-- Estado del sistema -->
            <div class="audit-row" style="border-bottom:none; padding-top:16px; margin-top:8px; border-top:1px solid rgba(255,255,255,0.06)">
                <span class="audit-label">Estado del Sistema</span>
                <span class="audit-value" style="color:#13ecd6; font-size:11px">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#13ecd6] mr-1.5 animate-pulse"></span>
                    Confirmado en D1
                </span>
            </div>
        </section>

        <!-- Botones -->
        <footer class="w-full max-w-xs mx-auto space-y-3 reveal-node pb-24" style="animation-delay: 0.3s">
            <button onclick="SGRouter.navigate('dashboard', 'success')" class="w-full py-5 bg-white text-black rounded-[2rem] font-black text-xs uppercase tracking-[0.5em] btn-premium-cyan transition-all shadow-2xl active:scale-95">
                Volver al Dashboard
            </button>
            <button onclick="downloadTicketPDF()" class="w-full py-4 glass-panel rounded-[2rem] text-zinc-400 font-black text-[10px] uppercase tracking-[0.4em] hover:text-white transition-all flex items-center justify-center gap-2">
                <span class="material-icons-round text-sm">download</span>
                Descargar PDF
            </button>
            <button onclick="SGRouter.navigate('activity', 'success')" class="w-full py-4 glass-panel rounded-[2rem] text-zinc-600 font-black text-[10px] uppercase tracking-[0.4em] hover:text-white transition-all">
                Ver en Historial
            </button>
        </footer>
    </div>

    <script>
    let _ticketDataForPDF = {};
    (function() {
        // Lee el ticket completo desde sessionStorage
        var ticket = null;
        try { ticket = JSON.parse(sessionStorage.getItem('sg_success_ticket') || 'null'); } catch(e) {}
        
        // Fallback: leer formato antiguo si existe
        var legacy = null;
        try { legacy = JSON.parse(sessionStorage.getItem('sg_last_expense') || 'null'); } catch(e) {}
        
        function setText(id, text) {
            var el = document.getElementById(id);
            if (el) el.textContent = text || '—';
        }
        
        function showRow(id) {
            var el = document.getElementById(id);
            if (el) el.style.display = 'flex';
        }
        
        // Formatear moneda
        function fmtMoney(amount, currency) {
            var c = currency || 'EUR';
            var symbols = { EUR: '€', USD: '$', GBP: '£', MXN: 'MX$', ARS: 'AR$', CLP: 'CLP', COP: 'COP', PEN: 'S/', BRL: 'R$' };
            var sym = symbols[c] || '€';
            var n = parseFloat(amount) || 0;
            return n.toLocaleString(getUserLocale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + sym;
        }
        
        // Formatear fecha ISO a legible
        function fmtTimestamp(iso) {
            if (!iso) return '—';
            var d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
                return d.toLocaleString(getUserLocale(), {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            }) + ' UTC';
        }
        
        if (ticket) {
            // ===== NUEVO FORMATO: TICKET COMPLETO =====
            
            // Tipo de operación
            var typeLabels = { 
                expense: 'Registro de Gasto', 
                settlement: 'Liquidación de Deuda', 
                invite: 'Invitación Enviada',
                generic: 'Operación Confirmada' 
            };
            setText('ticket-type', typeLabels[ticket.type] || ticket.type || 'Operación');
            
            // TXID
            setText('ticket-txid', ticket.txid || ticket.id || 'N/A');
            
            // Timestamp
            setText('ticket-timestamp', fmtTimestamp(ticket.timestamp) || fmtTimestamp(new Date().toISOString()));
            
            // Grupo
            setText('ticket-group', ticket.groupName || ticket.groupId || '—');
            
            // Descripción (opcional)
            if (ticket.description) {
                setText('ticket-description', ticket.description);
                showRow('row-description');
            }
            
            // Monto
            setText('ticket-amount', fmtMoney(ticket.amount, ticket.currency));
            
            // Split method (solo gastos)
            if (ticket.type === 'expense' && ticket.splitMethod) {
                var splitLabels = { equal: 'Simétrica Alpha', percentage: 'Porcentual', exact: 'Exacta', shares: 'Por Partes' };
                setText('ticket-split', splitLabels[ticket.splitMethod] || ticket.splitMethod);
                showRow('row-split');
            }
            
            // Participantes / Deudor-Acreedor
            if (ticket.type === 'settlement' && ticket.fromUser && ticket.toUser) {
                setText('label-participants', 'Liquidación');
                setText('ticket-participants', (ticket.fromUserName || ticket.fromUser) + ' → ' + (ticket.toUserName || ticket.toUser));
                showRow('row-participants');
            } else if (ticket.participants) {
                setText('label-participants', 'Participantes');
                setText('ticket-participants', ticket.participants);
                showRow('row-participants');
            }
            
            // Balance resultante (crucial para liquidaciones)
            if (ticket.balanceAfter !== undefined && ticket.balanceAfter !== null) {
                var b = parseFloat(ticket.balanceAfter) || 0;
                var balEl = document.getElementById('ticket-balance');
                if (ticket.type === 'settlement' && b === 0) {
                    balEl.textContent = t('success.debtSettled', null, 'Deuda saldada');
                    balEl.classList.add('balance-zero');
                } else {
                    balEl.textContent = fmtMoney(b, ticket.currency);
                    if (b === 0) balEl.classList.add('balance-zero');
                }
                showRow('row-balance');
            }
            
            // Limpiar ticket para que no se muestre al recargar
            _ticketDataForPDF = ticket || {};
            sessionStorage.removeItem('sg_success_ticket');
            
        } else if (legacy) {
            // ===== COMPATIBILIDAD: FORMATO ANTIGUO =====
            setText('ticket-type', 'Registro de Gasto');
            setText('ticket-txid', legacy.id || 'N/A');
            setText('ticket-timestamp', fmtTimestamp(new Date().toISOString()));
            setText('ticket-group', legacy.groupName || legacy.groupId || '—');
            setText('ticket-amount', fmtMoney(legacy.amount));
            
            if (legacy.splitMethod) {
                var splitLabels = { equal: 'Simétrica Alpha', percentage: 'Porcentual', exact: 'Exacta', shares: 'Por Partes' };
                setText('ticket-split', splitLabels[legacy.splitMethod] || legacy.splitMethod);
                showRow('row-split');
            }
            
            sessionStorage.removeItem('sg_last_expense');
        } else {
            // Sin datos: mostrar genérico
            setText('ticket-type', 'Operación Confirmada');
            setText('ticket-txid', '—');
            setText('ticket-timestamp', fmtTimestamp(new Date().toISOString()));
            setText('ticket-group', 'SplitGasto 2026');
            setText('ticket-amount', '✓');
        }
    })();
    </script>
    
    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item " onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
        </nav>

        <script>
        function downloadTicketPDF() {
            const ticket = _ticketDataForPDF;        
            const w = window.open('', '_blank');
            if (!w) {
                SGRouter.showToast('Permite popups para descargar', 'warning');
                return;
            }
        
            const amount = parseFloat(ticket.amount || 0).toFixed(2);
            const currency = ticket.currency || 'EUR';
            const symbols = { EUR: '€', USD: '$', GBP: '£' };
            const sym = symbols[currency] || '€';
        
            w.document.write(`
                <!DOCTYPE html><html><head><title>SplitGasto — Ticket</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: 'Helvetica Neue', sans-serif; padding: 40px; color: #000; }
                    .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #13ecd6; padding-bottom: 20px; }
                    .header h1 { font-size: 28px; font-weight: 900; }
                    .header p { font-size: 12px; color: #666; margin-top: 5px; }
                    .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
                    .label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #666; }
                    .value { font-size: 14px; font-weight: 700; }
                    .total { font-size: 24px; color: #13ecd6; font-weight: 900; }
                    .footer { margin-top: 40px; text-align: center; font-size: 10px; color: #999; }
                </style></head><body>
                <div class="header">
                    <h1>SplitGasto 2026</h1>
                    <p>Ticket Auditado · ${new Date().toLocaleString(getUserLocale())}</p>
                </div>
                <div class="row"><span class="label">Operación</span><span class="value">${ticket.type === 'settlement' ? 'Liquidación' : 'Gasto'}</span></div>
                <div class="row"><span class="label">ID</span><span class="value">${ticket.txid || '—'}</span></div>
                <div class="row"><span class="label">Fecha</span><span class="value">${ticket.timestamp ? new Date(ticket.timestamp).toLocaleString(getUserLocale()) : '—'}</span></div>
                <div class="row"><span class="label">Grupo</span><span class="value">${ticket.groupName || '—'}</span></div>
                ${ticket.description ? `<div class="row"><span class="label">Concepto</span><span class="value">${ticket.description}</span></div>` : ''}
                <div class="row"><span class="label">Importe</span><span class="value total">${amount}${sym}</span></div>
                ${ticket.toUserName ? `<div class="row"><span class="label">Liquidación</span><span class="value">${ticket.fromUser || ''} → ${ticket.toUserName}</span></div>` : ''}
                ${ticket.balanceAfter !== undefined ? `<div class="row"><span class="label">Balance Resultante</span><span class="value">${parseFloat(ticket.balanceAfter).toFixed(2)}${sym}</span></div>` : ''}
                <div class="footer">
                    SplitGasto 2026 · Ticket generado electrónicamente<br>
                    Verificable en D1 · splitgasto.com
                </div>
                </body></html>
            `);
            w.document.close();
            setTimeout(() => { w.print(); }, 500);
        }
        </script>

        <script>
        if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
            
window.addEventListener('pageshow', (e) => {
    if (e.persisted) location.reload();
});            
    </script>
</div>
</body>
</html>
