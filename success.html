<!DOCTYPE html>
<html lang="es" class="app-shell" style="background-color:#000 !important">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Operación Exitosa | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@700;900&display=swap');
        
        :root { --cian-tech: #13ecd6; }
        
        body { background:#000; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; overflow:hidden; }

        .success-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 300px; background: radial-gradient(circle, rgba(19,236,214,0.15) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
        }

        .success-icon-container {
            position: relative; width: 120px; height: 120px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(19,236,214,0.05); border: 1px solid rgba(19,236,214,0.2);
            border-radius: 3rem; margin: 0 auto; z-index: 1;
        }

        .check-anim {
            font-size: 60px; color: var(--cian-tech);
            animation: checkPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes checkPop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .receipt-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 2.5rem; padding: 2.5rem;
            position: relative; overflow: hidden;
        }

        .receipt-line {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 0; border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .btn-finish {
            background: var(--cian-tech); color: #000;
            font-family: 'Space Grotesk'; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.3em;
            transition: var(--transition-alpha);
        }
        .btn-finish:active { transform: scale(0.95); box-shadow: 0 0 30px rgba(19,236,214,0.2); }
    </style>
    <script src="engine/router.js"></script>
</head>
<body class="app-shell bg-black">
<div class="app-frame flex flex-col items-center justify-center h-screen px-6">
    
    <div class="success-glow"></div>

    <div class="w-full max-w-sm space-y-10 text-center">
        
        <div class="success-icon-container reveal-node">
            <span class="material-icons-round check-anim">check_circle</span>
        </div>

        <div class="space-y-2 reveal-node" style="animation-delay:0.1s">
            <h1 class="text-3xl font-black font-['Space_Grotesk'] italic tracking-tighter uppercase text-white">Misión Cumplida</h1>
            <p class="text-[9px] font-black text-[#13ecd6] uppercase tracking-[0.4em]">Transacción Auditada y Firmada</p>
        </div>

        <div class="receipt-card reveal-node border-white/5" style="animation-delay:0.2s">
            <div class="space-y-1">
                <div class="receipt-line">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Importe</span>
                    <span class="text-lg font-black font-['Space_Grotesk'] text-white">84,50€</span>
                </div>
                <div class="receipt-line">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Destino</span>
                    <span class="text-[11px] font-black text-white uppercase italic">Mario García</span>
                </div>
                <div class="receipt-line border-none">
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Protocolo</span>
                    <span class="text-[10px] font-black text-[#13ecd6] uppercase">Instant Alpha Pay</span>
                </div>
            </div>
            
            <div class="mt-6 pt-6 border-t border-white/5 flex items-center justify-center gap-2">
                <span class="material-icons-round text-zinc-700 text-sm">verified_user</span>
                <span class="text-[8px] font-black text-zinc-700 uppercase tracking-widest">TXID: SG-2026-8842-AX</span>
            </div>
        </div>

        <div class="space-y-4 reveal-node" style="animation-delay:0.3s">
            <button onclick="SGRouter.navigate('dashboard')" class="btn-finish w-full py-6 rounded-[2rem] text-xs">
                Volver al Mando
            </button>
            <button onclick="window.print()" class="w-full py-4 text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em] hover:text-white transition-colors">
                Descargar Comprobante
            </button>
        </div>

    </div>
</div>

<script>
    // Protocolo de limpieza de estado de pago si fuera necesario
    window.onload = () => {
        if(window.SGRouter) {
            console.log("[Alpha System] Pago registrado en el Ledger local.");
        }
    };
</script>
</body>
</html>
