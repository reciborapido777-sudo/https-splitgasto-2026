<!DOCTYPE html>
<html lang="es" class="app-shell" style="background:#000 !important">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Bóveda Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@700;900&display=swap');
        
        body { background:#000; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; overflow:hidden; }

        .asset-card {
            position: relative; aspect-ratio: 4/5; border-radius: 2.2rem;
            overflow: hidden; border: 1px solid var(--glass-border);
            transition: var(--transition-alpha); background: #050505;
            transform: translateZ(0);
        }
        .asset-card:active { transform: scale(0.96); }
        .asset-card:hover { border-color: var(--cian-tech); box-shadow: 0 0 30px rgba(19, 236, 214, 0.05); }
        
        .asset-overlay { 
            background: linear-gradient(to top, rgba(0,0,0,1) 5%, rgba(0,0,0,0.5) 50%, transparent 100%); 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .filter-btn {
            padding: 10px 22px; border-radius: 14px; font-size: 9px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.15em; border: 1px solid var(--glass-border);
            color: #52525b; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap; background: rgba(255,255,255,0.01);
        }
        .filter-btn.active { 
            border-color: var(--cian-tech); color: var(--cian-tech); 
            background: rgba(19, 236, 214, 0.08);
            box-shadow: 0 0 20px rgba(19, 236, 214, 0.1);
        }

        .status-tag {
            font-size: 7px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.15em; padding: 4px 10px; border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: var(--cian-tech); }
    </style>
    <script src="engine/router.js"></script>
</head>
<body class="app-shell flex flex-col h-screen">
<div class="app-frame flex flex-col h-full">

    <header class="flex justify-between items-center p-6 shrink-0 sticky top-0 z-50 bg-black/80 backdrop-blur-xl border-b border-white/5">
        <div class="flex items-center gap-4">
            <button onclick="SGRouter.back()" class="size-11 rounded-2xl glass-panel flex items-center justify-center active:scale-90 transition-all">
                <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
            </button>
            <div class="text-left">
                <p class="text-[8px] font-black text-zinc-600 uppercase tracking-[0.4em]">Vault Security · AES-256</p>
                <h1 class="text-sm font-black font-['Space_Grotesk'] tracking-widest uppercase italic text-white leading-none">Bóveda</h1>
            </div>
        </div>
        <button onclick="SGRouter.navigate('scanner')" class="size-11 glass-panel rounded-2xl flex items-center justify-center text-[#FF9D42] border-[#FF9D42]/20 active:scale-90 transition-all shadow-[0_0_20px_rgba(255,157,66,0.1)]">
            <span class="material-icons-round">add_a_photo</span>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto px-6 py-4 space-y-6">
        
        <section class="reveal-node">
            <div class="glass-panel px-6 py-4 rounded-2xl flex items-center gap-4 border-white/5 focus-within:border-[#13ecd6]/30 transition-all">
                <span class="material-icons-round text-zinc-600 text-lg">search</span>
                <input type="text" placeholder="BUSCAR EN LA BÓVEDA..." 
                       class="bg-transparent border-none outline-none text-[10px] font-black uppercase tracking-[0.2em] w-full text-white placeholder:text-zinc-700" 
                       oninput="filterVault(this.value)">
            </div>
        </section>

        <nav class="flex gap-2 overflow-x-auto no-scrollbar reveal-node" style="animation-delay: 0.1s">
            <button class="filter-btn active" onclick="setFilter(this,'todos')">Todos</button>
            <button class="filter-btn" onclick="setFilter(this,'alimentacion')">Alimentación</button>
            <button class="filter-btn" onclick="setFilter(this,'ocio')">Ocio</button>
            <button class="filter-btn" onclick="setFilter(this,'hogar')">Hogar</button>
            <button class="filter-btn" onclick="setFilter(this,'viajes')">Viajes</button>
        </nav>

        <div id="vaultGrid" class="grid grid-cols-2 gap-4 pb-28">
            <div class="asset-card group reveal-node" data-cat="alimentacion" data-name="mercadona" onclick="SGRouter.navigate('receipt')">
                <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=800" class="absolute inset-0 w-full h-full object-cover opacity-30 group-hover:scale-110 transition-all duration-700">
                <div class="absolute inset-0 asset-overlay flex flex-col justify-end p-5 space-y-2">
                    <span class="status-tag w-fit bg-[#13ecd6]/10 text-[#13ecd6] border border-[#13ecd6]/20">Alimentación</span>
                    <h3 class="text-[11px] font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none text-white">Mercadona</h3>
                    <p class="text-xl font-black font-['Space_Grotesk'] text-[#13ecd6]">42,15€</p>
                </div>
            </div>

            <div class="asset-card group reveal-node" data-cat="ocio" data-name="netflix" onclick="SGRouter.navigate('receipt')" style="animation-delay:0.1s">
                <div class="absolute inset-0 bg-red-950/20 flex items-center justify-center">
                    <span class="material-icons-round text-red-600/20 text-[6rem]">play_circle</span>
                </div>
                <div class="absolute inset-0 asset-overlay flex flex-col justify-end p-5 space-y-2">
                    <span class="status-tag w-fit bg-red-500/10 text-red-400 border border-red-500/20">Ocio</span>
                    <h3 class="text-[11px] font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none text-white">Netflix</h3>
                    <p class="text-xl font-black font-['Space_Grotesk'] text-red-400">15,99€</p>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item active">
                <span class="material-icons-round">auto_stories</span>
                <p>Bóveda</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>

</div>

<script>
    let currentFilter = 'todos';
    function setFilter(btn, cat) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = cat;
        applyFilters();
    }
    function filterVault(query) { applyFilters(query); }
    function applyFilters(query = '') {
        const cards = document.querySelectorAll('#vaultGrid [data-cat]');
        cards.forEach(card => {
            const matchCat = currentFilter === 'todos' || card.dataset.cat === currentFilter;
            const matchName = !query || card.dataset.name.toLowerCase().includes(query.toLowerCase());
            card.style.display = (matchCat && matchName) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
