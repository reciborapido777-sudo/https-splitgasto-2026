<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Bóveda Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Estilos específicos de Bóveda: Densidad de Activos */
        .asset-card {
            position: relative; aspect-ratio: 4/5; border-radius: 2.5rem;
            overflow: hidden; border: 1px solid var(--glass-border);
            transition: var(--transition-alpha); background: #0a0a0a;
            transform: translateZ(0); will-change: transform;
        }
        .asset-card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--cian-tech); }
        .asset-overlay { background: linear-gradient(to top, rgba(0,0,0,0.9) 5%, rgba(0,0,0,0.2) 60%, transparent 100%); }

        .filter-btn {
            padding: 8px 16px; border-radius: 999px; font-size: 9px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--glass-border);
            color: #71717a; transition: all 0.3s;
        }
        .filter-btn.active { border-color: var(--cian-tech); color: var(--cian-tech); background: rgba(19, 236, 214, 0.05); }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; }
        .nav-item span { font-size: 20px; color: #4a4a4a; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: var(--cian-tech); }
    </style>

    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame">
    <div class="max-w-lg mx-auto px-4 py-6 space-y-8">

        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/80 backdrop-blur-xl z-50 -mx-4 px-4">
            <div class="flex items-center gap-4">
                <button onclick="SGRouter.back()" class="size-12 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all">
                    <span class="material-icons-round text-zinc-500 text-xl">arrow_back</span>
                </button>
                <div>
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em]">Vault · AES-256</p>
                    <h1 class="text-xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Bóveda</h1>
                </div>
            </div>
            <button onclick="SGRouter.navigate('scanner')" class="size-12 glass-panel rounded-xl flex items-center justify-center text-[#FF9D42] border-[#FF9D42]/20 active:scale-90 transition-all">
                <span class="material-icons-round">add_a_photo</span>
            </button>
        </header>

        <section class="reveal-node">
            <div class="glass-panel px-5 py-4 rounded-2xl flex items-center gap-3 border-white/5">
                <span class="material-icons-round text-zinc-500 text-lg">search</span>
                <input type="text" placeholder="BUSCAR ACTIVO..." class="bg-transparent border-none outline-none text-[10px] font-black uppercase tracking-widest w-full text-zinc-300 placeholder:text-zinc-700" oninput="filterVault(this.value)">
            </div>
        </section>

        <nav class="flex gap-2 overflow-x-auto no-scrollbar reveal-node" style="animation-delay: 0.1s">
            <button class="filter-btn active" onclick="setFilter(this,'todos')">Todos</button>
            <button class="filter-btn" onclick="setFilter(this,'alimentacion')">Alimentación</button>
            <button class="filter-btn" onclick="setFilter(this,'ocio')">Ocio</button>
        </nav>

        <main id="vaultGrid" class="grid grid-cols-2 gap-4 reveal-node" style="animation-delay: 0.2s">
            
            <div class="asset-card group reveal-node" data-cat="alimentacion" data-name="mercadona" onclick="SGRouter.navigate('receipt')">
                <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=800" class="absolute inset-0 w-full h-full object-cover opacity-40 group-hover:scale-105 transition-all duration-700" alt="">
                <div class="absolute inset-0 asset-overlay flex flex-col justify-end p-5 space-y-2">
                    <span class="status-tag w-fit bg-[#13ecd6]/10 text-[#13ecd6] border-[#13ecd6]/20">Alimentación</span>
                    <h3 class="text-sm font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Mercadona</h3>
                    <p class="text-xl font-black font-['Space_Grotesk'] text-[#13ecd6] money-display">42,15€</p>
                </div>
            </div>

            <div class="asset-card group reveal-node" data-cat="ocio" data-name="netflix" onclick="SGRouter.navigate('receipt')">
                <div class="absolute inset-0 bg-red-900/20 flex items-center justify-center">
                    <span class="material-icons-round text-red-600/30 text-6xl">play_circle</span>
                </div>
                <div class="absolute inset-0 asset-overlay flex flex-col justify-end p-5 space-y-2">
                    <span class="status-tag w-fit bg-red-500/10 text-red-400 border-red-500/20">Ocio</span>
                    <h3 class="text-sm font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Netflix</h3>
                    <p class="text-xl font-black font-['Space_Grotesk'] text-red-400 money-display">15,99€</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentFilter = 'todos';
        function setFilter(btn, cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = cat;
            applyFilters();
        }
        function filterVault(query) { applyFilters(query); }
        function applyFilters(query = '') {
            const cards = document.querySelectorAll('#vaultGrid [data-cat]');
            cards.forEach(card => {
                const matchCat = currentFilter === 'todos' || card.dataset.cat === currentFilter;
                const matchName = !query || card.dataset.name.includes(query.toLowerCase());
                card.style.display = (matchCat && matchName) ? '' : 'none';
            });
        }
    </script>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>
</div>
</body>
</html>
