<!DOCTYPE html>
<html lang="es" style="background-color: #000 !important;">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Añadir Gasto | SplitGasto 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link rel="stylesheet" href="engine/global.css"/>
<style>
  :root { --cyan:#13ecd6; --purple:#a855f7; --orange:#FF9D42; }
  * { font-family:'Manrope',sans-serif; box-sizing:border-box; }
  body { background:#0a0a0a; min-height:100dvh; touch-action: manipulation; }

  .glass { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); border-radius:24px; }

  /* Amount input */
  #amount-input {
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:3.5rem;
    font-weight:900;
    text-align:center;
    width:100%;
    caret-color:var(--cyan);
  }
  #amount-input::placeholder { color:rgba(255,255,255,0.15); }

  /* Category buttons */
  .cat-btn {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 14px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.04);
    cursor:pointer;
    transition:all 0.2s;
    font-size:0.7rem;
    font-weight:700;
    min-width:72px;
    flex-shrink:0;
  }
  /* Categories scroll container — visible scrollbar on desktop */
  .cats-scroll {
    display:flex; gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .cats-scroll::-webkit-scrollbar { height:3px; }
  .cats-scroll::-webkit-scrollbar-track { background:transparent; }
  .cats-scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }
  .cats-scroll .cat-btn { scroll-snap-align:start; }
  .cat-btn.active { border-color:var(--cyan); background:rgba(19,236,214,0.1); color:var(--cyan); }
  .cat-btn:hover { background:rgba(255,255,255,0.07); }

  /* Form inputs */
  .sg-input {
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:14px;
    color:white;
    padding:14px 16px;
    width:100%;
    font-size:0.9rem;
    font-weight:600;
    outline:none;
    transition:border-color 0.2s;
  }
  .sg-input:focus { border-color:var(--cyan); }
  .sg-input::placeholder { color:rgba(255,255,255,0.25); font-weight:400; }

  /* Split toggle */
  .split-option {
    flex:1; text-align:center; padding:10px;
    border-radius:12px;
    font-size:0.8rem; font-weight:700;
    cursor:pointer; transition:all 0.2s;
  }
  .split-option.active { background:var(--cyan); color:#0a0a0a; }
  .split-option:not(.active) { color:rgba(255,255,255,0.4); }

  /* Payer avatars */
  .payer-chip {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; min-width:56px;
  }
  .payer-avatar {
    width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:0.85rem;
    border:2px solid rgba(255,255,255,0.1);
    transition:all 0.2s;
  }
  .payer-chip.selected .payer-avatar { border-color:var(--cyan); box-shadow:0 0 12px rgba(19,236,214,0.4); }
  .payer-chip.selected .payer-name { color:var(--cyan); }
  .payer-name { font-size:0.65rem; font-weight:700; opacity:0.6; }

  /* Save button */
  #save-btn {
    background:linear-gradient(135deg, var(--cyan), #0fbfaf);
    color:#0a0a0a; border-radius:50px;
    font-weight:800; font-size:1rem;
    box-shadow:0 8px 32px rgba(19,236,214,0.35);
    transition:all 0.2s;
  }
  #save-btn:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(19,236,214,0.5); }
  #save-btn:active { transform:scale(0.97); }
  #save-btn:disabled { opacity:0.4; }

  /* Scanner CTA */
  .scanner-cta {
    background:linear-gradient(135deg, rgba(19,236,214,0.08), rgba(168,85,247,0.08));
    border:1px solid rgba(19,236,214,0.2);
    border-radius:20px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .scanner-cta:hover { border-color:rgba(19,236,214,0.4); background:rgba(19,236,214,0.12); }

        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
        .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
        .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
        .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
        .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
</style>

    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SplitGasto">

    <script src="engine/router.js"></script>
    <script src="engine/desktop-fix.js" defer></script>

</head>
<body class="app-shell text-white pb-32">
<div class="app-frame">

<header class="flex justify-between items-center px-5 py-4 sticky top-0 z-50" style="background:rgba(10,10,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05)">
  <button onclick="SGRouter.back()" class="flex items-center justify-center w-10 h-10 rounded-full" style="background:rgba(255,255,255,0.07)">
    <span class="material-icons-round text-white/60">close</span>
  </button>
  <h1 class="font-bold text-base" data-i18n="expense.title">Nuevo Gasto</h1>
  <button id="save-btn" class="px-5 py-2 text-sm" onclick="saveExpense()" data-i18n="expense.save">Guardar</button>
</header>

<main class="max-w-md mx-auto px-4 pt-4 space-y-5 w-full">

  <div class="scanner-cta p-4 flex items-center gap-4" onclick="SGRouter.navigate('scanner','add-expense')">
    <div class="w-12 h-12 rounded-2xl flex items-center justify-center" style="background:rgba(19,236,214,0.15)">
      <span class="material-icons-round" style="color:var(--cyan)">document_scanner</span>
    </div>
    <div>
      <p class="font-bold text-sm" data-i18n="expense.scanTicket">Escanear Ticket con IA</p>
      <p class="text-xs opacity-50" data-i18n="expense.scanTicketSub">Extrae datos automáticamente</p>
    </div>
    <span class="material-icons-round ml-auto opacity-30">chevron_right</span>
  </div>

  <div class="glass p-6 text-center">
    <p class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3" data-i18n="expense.amount">Importe</p>
    <div class="flex items-center justify-center gap-3">
      <span class="text-2xl font-black opacity-40">€</span>
      <input type="number" id="amount-input" placeholder="0,00" step="0.01" min="0" inputmode="decimal"/>
    </div>
    <p class="text-xs opacity-30 mt-2" id="per-person-hint">— € <span data-i18n="expense.perPerson">por persona</span></p>
  </div>

  <div class="space-y-2">
    <label class="text-xs font-bold uppercase tracking-widest opacity-40" data-i18n="expense.description">Descripción</label>
    <div class="relative">
      <input type="text" id="desc-input" class="sg-input pl-12" placeholder="¿En qué se gastó?" data-i18n="expense.descriptionPlaceholder"/>
      <span class="material-icons-round absolute left-4 top-1/2 -translate-y-1/2 opacity-30">edit_note</span>
    </div>
  </div>

  <div class="space-y-2">
    <label class="text-xs font-bold uppercase tracking-widest opacity-40" data-i18n="expense.category">Categoría</label>
    <div class="cats-scroll">
      <button class="cat-btn active" data-cat="comida" onclick="selectCat(this)">🍣<span data-i18n="category.comida">Comida</span></button>
      <button class="cat-btn" data-cat="transporte" onclick="selectCat(this)">🚗<span data-i18n="category.transporte">Transporte</span></button>
      <button class="cat-btn" data-cat="entretenimiento" onclick="selectCat(this)">🎬<span data-i18n="category.entretenimiento">Ocio</span></button>
      <button class="cat-btn" data-cat="alojamiento" onclick="selectCat(this)">🏠<span data-i18n="category.alojamiento">Hogar</span></button>
      <button class="cat-btn" data-cat="compras" onclick="selectCat(this)">🛍️<span data-i18n="category.compras">Compras</span></button>
      <button class="cat-btn" data-cat="salud" onclick="selectCat(this)">💊<span data-i18n="category.salud">Salud</span></button>
      <button class="cat-btn" data-cat="otro" onclick="selectCat(this)">📦<span data-i18n="category.otro">Otro</span></button>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div class="space-y-2">
      <label class="text-xs font-bold uppercase tracking-widest opacity-40" data-i18n="expense.date">Fecha</label>
      <input type="date" id="date-input" class="sg-input"/>
    </div>
 <div class="space-y-2">
  <label class="text-xs font-bold uppercase tracking-widest opacity-40" data-i18n="expense.group">Grupo</label>
  <select id="group-input" class="sg-input" style="appearance:none;cursor:pointer">
    <option value="" data-i18n="expense.groupLoading">Cargando grupos…</option>
  </select>
</div>
  </div>

  <div class="glass p-5 space-y-4">
    <div class="flex justify-between items-center">
      <h3 class="font-bold text-sm" data-i18n="expense.paidBy">Pagado por</h3>
      <button class="text-xs font-bold" style="color:var(--cyan)" data-i18n="expense.multiplePayers">+ Múltiples</button>
    </div>
    <div class="flex gap-4 overflow-x-auto pb-1" id="payers-row" style="scrollbar-width:none">
      </div>
  </div>

  <div class="glass p-5 space-y-4">
    <h3 class="font-bold text-sm" data-i18n="expense.splitMethod">Método de reparto</h3>
    <div class="flex p-1 rounded-xl" style="background:rgba(255,255,255,0.04)">
      <div class="split-option active" onclick="selectSplit(this,'equal')" data-i18n="expense.splitEqual">Igual</div>
      <div class="split-option" onclick="selectSplit(this,'percentage')" data-i18n="expense.splitPercentage">%</div>
      <div class="split-option" onclick="selectSplit(this,'exact')" data-i18n="expense.splitExact">Exacto</div>
      <div class="split-option" onclick="selectSplit(this,'shares')" data-i18n="expense.splitShares">Partes</div>
    </div>

    <div id="split-details" class="space-y-3 mt-2">
      </div>
  </div>

  <div class="space-y-2">
    <label class="text-xs font-bold uppercase tracking-widest opacity-40" data-i18n="expense.note">Nota (opcional)</label>
    <textarea id="notes-input" class="sg-input resize-none" rows="2" placeholder="Añade una nota…" data-i18n="expense.notePlaceholder"></textarea>
  </div>

  <button id="save-btn-bottom" class="w-full py-5 rounded-full font-black text-lg" style="background:linear-gradient(135deg,var(--cyan),#0fbfaf);color:#0a0a0a;box-shadow:0 8px 32px rgba(19,236,214,0.35)" onclick="saveExpense()">
    <span class="flex items-center justify-center gap-2">
      <span class="material-icons-round">check_circle</span>
      <span data-i18n="expense.saveExpense">GUARDAR GASTO</span>
    </span>
  </button>

</main>

<script>
let groups = [];
let selectedPayer = 0;
let selectedCat = 'comida';
let splitMethod = 'equal';
let members = [];

const today = new Date().toISOString().split('T')[0];
document.getElementById('date-input').value = today;

// ── Load groups from API into select ──
async function loadGroups() {
  if (!SGAuth || !SGAuth.isLoggedIn()) return;
  try {
    const result = await SGApi.getGroups(); 
    if (result && result.success && result.groups) {
      groups = result.groups;
      const sel = document.getElementById('group-input');
      if (groups.length === 0) {
        sel.innerHTML = '<option value="">' + t('expense.groupEmpty', null, 'Sin grupos — crea uno primero') + '</option>';
        return;
      }
      sel.innerHTML = '<option value="">' + t('expense.groupSelect', null, 'Selecciona un grupo') + '</option>';
      groups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        sel.appendChild(opt);
      });
      // Auto-select if groupId in URL
      const params = new URLSearchParams(window.location.search);
      const preGroup = params.get('groupId') || sessionStorage.getItem('sg_selected_group');
      if (preGroup) {
        sel.value = preGroup;
        loadGroupMembers(preGroup);
      } else if (groups.length === 1) {
        // Si solo hay un grupo, seleccionarlo automáticamente
        sel.value = groups[0].id;
        loadGroupMembers(groups[0].id);
      }
    } else {
      const sel = document.getElementById('group-input');
      sel.innerHTML = '<option value="">' + t('expense.groupError', null, 'Error al cargar grupos') + '</option>';
    }
  } catch (e) {
    console.error('Error loading groups:', e);
    const sel = document.getElementById('group-input');
    sel.innerHTML = '<option value="">' + t('error.system', null, 'Error al cargar') + '</option>';
  }
}

// ── Listen for group selection ──
document.getElementById('group-input').addEventListener('change', function() {
  loadGroupMembers(this.value);
});

async function loadGroupMembers(groupId) {
  if (!groupId) { members = []; renderPayers(); renderSplitDetails(); return; }
  const colors = ['#13ecd6', '#a855f7', '#FF9D42', '#ec4899', '#22c55e', '#3b82f6'];
  const uid = SGAuth.getUserId();
  try {
    // Obtener miembros reales del grupo con nombres
    const memResult = await SGApi.getGroupMembers(groupId);
    if (memResult?.success && memResult.members && memResult.members.length > 0) {
      members = memResult.members.map((m, i) => {
        const isMe = m.id === uid;
        const displayName = isMe ? t('expense.you', null, 'Tú') : (m.name || `Socio ${i + 1}`);
        const initials = displayName.slice(0, 2).toUpperCase();
        return { id: m.id, name: displayName, initials, color: colors[i % colors.length], avatar_url: m.avatar_url || '' };
      });
      // «Tú» siempre primero
      members.sort((a, b) => (a.id === uid ? -1 : b.id === uid ? 1 : 0));
    } else {
      members = [{ name: t('expense.you', null, 'Tú'), initials: 'TÚ', color: '#13ecd6', id: uid || 'self' }];
    }
  } catch (e) {
    console.error('Error loading members:', e);
    members = [{ name: t('expense.you', null, 'Tú'), initials: 'TÚ', color: '#13ecd6', id: uid || 'self' }];
  }
  selectedPayer = 0;
  renderPayers();
  renderSplitDetails();
}

function renderPayers() {
  const row = document.getElementById('payers-row');
  if (members.length === 0) {
    row.innerHTML = '<p class="text-xs opacity-30 py-3">' + t('expense.selectGroupFirst', null, 'Selecciona un grupo primero') + '</p>';
    return;
  }
  row.innerHTML = members.map((m, i) => `
    <div class="payer-chip ${i === selectedPayer ? 'selected' : ''}" onclick="selectPayer(${i})">
      <div class="payer-avatar overflow-hidden relative" style="background:${m.color}22;color:${m.color};border-color:${i===selectedPayer?m.color:'rgba(255,255,255,0.1)'}">${m.initials}${m.avatar_url ? `<img src="${m.avatar_url}" class="absolute inset-0 w-full h-full object-cover" alt="${m.name}" onerror="this.style.display='none'"/>` : ''}</div>
      <span class="payer-name">${m.name}</span>
    </div>`).join('');
}

function selectPayer(idx) { selectedPayer = idx; renderPayers(); }

function selectCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedCat = btn.dataset.cat;
}

function selectSplit(el, method) {
  document.querySelectorAll('.split-option').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  splitMethod = method;
  renderSplitDetails();
}

function renderSplitDetails() {
  const amount = parseFloat(document.getElementById('amount-input').value) || 0;
  const perPerson = splitMethod === 'equal' && members.length > 0 ? (amount / members.length).toFixed(2) : '—';
  document.getElementById('per-person-hint').textContent = splitMethod === 'equal' ? `${perPerson} € ` + t('expense.perPerson', null, 'por persona') : '— € ' + t('expense.perPerson', null, 'por persona');

  const container = document.getElementById('split-details');
  container.innerHTML = members.map((m, i) => {
    let valueContent;
    if (splitMethod === 'equal') {
      valueContent = `<span class="text-sm font-bold" style="color:var(--cyan)">${perPerson} €</span>`;
    } else if (splitMethod === 'percentage') {
      valueContent = `<div class="flex items-center gap-1"><input type="number" data-member-id="${m.id}" data-split-type="percentage" value="${Math.round(100/members.length)}" min="0" max="100" class="sg-input w-16 text-center py-2 text-sm split-input" style="padding:6px;"/><span class="opacity-40">%</span></div>`;
    } else if (splitMethod === 'exact') {
      valueContent = `<input type="number" data-member-id="${m.id}" data-split-type="exact" placeholder="0.00" step="0.01" class="sg-input w-24 text-center py-2 text-sm split-input" style="padding:6px;"/>`;
    } else {
      valueContent = `<div class="flex items-center gap-1"><input type="number" data-member-id="${m.id}" data-split-type="shares" value="1" min="1" class="sg-input w-16 text-center py-2 text-sm split-input" style="padding:6px;"/><span class="opacity-40">` + t('expense.part', null, 'parte') + `</span></div>`;
    }
    return `
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div style="width:36px;height:36px;border-radius:50%;background:${m.color}22;color:${m.color};border:2px solid ${m.color}33;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.8rem">${m.initials}</div>
          <span class="text-sm font-semibold">${m.name}</span>
        </div>
        ${valueContent}
      </div>`;
  }).join('');
}

document.getElementById('amount-input').addEventListener('input', renderSplitDetails);

async function saveExpense() {
  const amount = parseFloat(document.getElementById('amount-input').value);
  const desc = document.getElementById('desc-input').value.trim();
  const groupSel = document.getElementById('group-input');
  const groupId = groupSel ? groupSel.value : null;

  if (!amount || amount <= 0) { SGRouter.showToast(t('expense.errorAmount', null, 'Introduce un importe válido'), 'warning'); return; }
  if (!desc) { SGRouter.showToast(t('expense.errorDescription', null, 'Añade una descripción'), 'warning'); return; }
  if (!groupId) { SGRouter.showToast(t('expense.errorGroup', null, 'Selecciona un grupo'), 'warning'); return; }

  if (!SGAuth.isLoggedIn()) {
    SGRouter.showToast(t('activity.loginRequired', null, 'Inicia sesión primero'), 'error');
    setTimeout(() => SGRouter.navigate('auth-login'), 1200);
    return;
  }

  // Obtener el UUID real del pagador seleccionado
  const payerMember = members[selectedPayer];
  const payerId = payerMember?.id || SGAuth.getUserId();

  const saveBtnTop = document.getElementById('save-btn');
  const saveBtnBot = document.getElementById('save-btn-bottom');
  if (saveBtnTop) saveBtnTop.disabled = true;
  if (saveBtnBot) saveBtnBot.disabled = true;

  // Leer split details si no es reparto igual
  let splitDetails = null;
  if (splitMethod !== 'equal') {
    const inputs = document.querySelectorAll('.split-input');
    splitDetails = [];
    inputs.forEach(input => {
      splitDetails.push({
        userId: input.dataset.memberId,
        value: parseFloat(input.value) || 0,
        type: input.dataset.splitType
      });
    });

    // Validaciones
    if (splitMethod === 'percentage') {
      const totalPct = splitDetails.reduce((s, d) => s + d.value, 0);
      if (Math.abs(totalPct - 100) > 0.1) {
        SGRouter.showToast(t('expense.errorPercentage', null, 'Los porcentajes deben sumar 100%'), 'warning');
        if (saveBtnTop) saveBtnTop.disabled = false;
        if (saveBtnBot) saveBtnBot.disabled = false;
        return;
      }
    } else if (splitMethod === 'exact') {
      const totalExact = splitDetails.reduce((s, d) => s + d.value, 0);
      if (Math.abs(totalExact - amount) > 0.01) {
        SGRouter.showToast(t('expense.errorExact', null, 'Las cantidades deben sumar el total'), 'warning');
        if (saveBtnTop) saveBtnTop.disabled = false;
        if (saveBtnBot) saveBtnBot.disabled = false;
        return;
      }
    } else if (splitMethod === 'shares') {
      const totalShares = splitDetails.reduce((s, d) => s + d.value, 0);
      if (totalShares <= 0) {
        SGRouter.showToast(t('expense.errorShares', null, 'Las partes deben ser mayores a 0'), 'warning');
        if (saveBtnTop) saveBtnTop.disabled = false;
        if (saveBtnBot) saveBtnBot.disabled = false;
        return;
      }
    }
  }

  try {
    const result = await SGApi.addExpense(groupId, amount, 'EUR', selectedCat, desc, splitMethod, payerId, splitDetails);

    if (result && result.success) {
      storeExpenseTicket(result, groupId, amount, desc);
      SGRouter.showToast(t('expense.saved', null, 'Gasto guardado ✓'), 'success');
      try { sessionStorage.setItem('sg_expense_added', Date.now()); } catch {}
      setTimeout(() => SGRouter.navigate('success', 'add-expense'), 800);
    } else {
      const errMsg = result?.error || t('expense.saveError', null, 'Error al guardar el gasto');
      console.error('saveExpense backend error:', errMsg);
      if (errMsg.includes('perteneces') || errMsg.includes('403')) {
        SGRouter.showToast(t('expense.repairingMembership', null, 'Reparando membresía… reintentando'), 'warning');
        try {
          await fetch('/api/db/repair-memberships', { method: 'POST', headers: { 'Authorization': `Bearer ${SGAuth.getToken()}` } });
          await new Promise(r => setTimeout(r, 500));
          const retry = await SGApi.addExpense(groupId, amount, 'EUR', selectedCat, desc, splitMethod, payerId, splitDetails);
          if (retry && retry.success) {
            storeExpenseTicket(retry, groupId, amount, desc);
            SGRouter.showToast(t('expense.saved', null, 'Gasto guardado ✓'), 'success');
            try { sessionStorage.setItem('sg_expense_added', Date.now()); } catch {}
            setTimeout(() => SGRouter.navigate('success', 'add-expense'), 800);
            return;
          }
        } catch {}
      }
      SGRouter.showToast(errMsg, 'error');
    }
  } catch (e) {
    console.error('saveExpense error:', e);
    SGRouter.showToast(t('error.system', null, 'Error de conexión'), 'error');
  } finally {
    if (saveBtnTop) saveBtnTop.disabled = false;
    if (saveBtnBot) saveBtnBot.disabled = false;
  }
}

function storeExpenseTicket(apiResult, groupId, amount, desc) {
    const groupName = groups.find(g => g.id === groupId)?.name || t('expense.group', null, 'Grupo');
    sessionStorage.setItem('sg_success_ticket', JSON.stringify({
        type: 'expense',
        txid: apiResult.id || crypto.randomUUID(),
        timestamp: new Date().toISOString(),
        groupId: groupId,
        groupName: groupName,
        amount: amount,
        currency: 'EUR',
        description: desc,
        splitMethod: splitMethod,
        participants: members.length + ' socios',
        balanceAfter: null
    }));
}

// ── Initialize ──
async function init() {
  // MED-2: Verificación proactiva contra servidor
  if (SGAuth.isLoggedIn()) {
    SGAuth.verifySession().then(valid => {
      if (!valid) {
        SGRouter.showToast(t('auth.sessionExpired', null, 'Sesión expirada'), 'error');
        setTimeout(() => SGRouter.navigate('auth-login'), 1200);
      }
    });
  }
  // Reparar membresías huérfanas al cargar la página
  try {
    await fetch('/api/db/repair-memberships', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SGAuth.getToken()}` }
    });
  } catch {}
  await loadGroups();
  renderPayers();
  renderSplitDetails();
}

// bfcache: recargar grupos al volver atrás
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    fetch('/api/db/purge-cache', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SGAuth.getToken()}` }
    }).catch(() => {});
    loadGroups();
  }
});

document.addEventListener('DOMContentLoaded', () => {
    init();
});

</script>

        <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
