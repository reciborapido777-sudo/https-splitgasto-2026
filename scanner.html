<!DOCTYPE html>
<html lang="es" class="app-shell" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Scanner Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&display=swap');
        
        body, html { height: 100vh; overflow: hidden !important; display: flex; flex-direction: column; background: #000; font-family: 'Plus Jakarta Sans', sans-serif; }
        .tech-font { font-family: 'Space Grotesk', sans-serif; }
        
        .viewfinder-master { 
            flex: 1; position: relative; margin: 0 16px; 
            background: #050505; border-radius: 3rem; 
            border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
            transform: translateZ(0);
        }

        /* Guías de Encuadre Alpha */
        .frame-guides { position: absolute; inset: 60px 30px; pointer-events: none; }
        .corner { 
            position: absolute; width: 45px; height: 45px; 
            border: 3px solid #13ecd6; 
            filter: drop-shadow(0 0 15px rgba(19,236,214,0.4)); 
        }
        .tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 1.5rem 0 0 0; }
        .tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-radius: 0 1.5rem 0 0; }
        .bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 1.5rem; }
        .br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 1.5rem 0; }

        .scan-pulse { 
            position: absolute; width: 100%; height: 3px; 
            background: linear-gradient(to right, transparent, #13ecd6, transparent); 
            box-shadow: 0 0 30px #13ecd6; 
            animation: moveScan 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @keyframes moveScan { 0% { top: 5%; opacity: 0; } 50% { opacity: 1; } 100% { top: 95%; opacity: 0; } }

        /* UI Overlay & Shutter */
        .ui-overlay { background: rgba(0,0,0,0.9); backdrop-filter: blur(30px); z-index: 50; }
        
        .shutter-btn { 
            background: #FF9D42; 
            box-shadow: 0 0 50px rgba(255, 157, 66, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .shutter-btn:active { transform: scale(0.8) rotate(5deg); filter: brightness(1.3); }

        .btn-action { transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1); opacity: 0.5; }
        .btn-action:active { transform: scale(0.9); opacity: 1; color: #13ecd6; }

        .reveal-node { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>

    <script src="engine/router.js" defer></script>
</head>
<body class="app-shell">
<div class="app-frame flex flex-col h-full">

    <header class="ui-overlay p-6 flex justify-between items-center border-b border-white/5">
        <button onclick="SGRouter.back()" class="size-12 glass-panel rounded-2xl flex items-center justify-center active:scale-90 transition-all border border-white/5">
            <span class="material-icons-round text-white text-2xl">close</span>
        </button>
        <div class="text-right">
            <p class="text-[9px] font-black text-[#13ecd6] tech-font uppercase tracking-[0.5em]">AI Vision Alpha</p>
            <div class="flex items-center justify-end gap-2 mt-1">
                <span class="size-1.5 bg-[#13ecd6] rounded-full animate-pulse"></span>
                <p class="text-[8px] font-black text-zinc-500 uppercase tracking-widest">Digitalización Activa</p>
            </div>
        </div>
    </header>

    <main class="viewfinder-master reveal-node">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1556742044-3c52d6e88c62?q=80&w=1200')] bg-cover bg-center opacity-40 grayscale group-hover:grayscale-0 transition-all duration-1000"></div>
        <div class="absolute inset-0 bg-black/20"></div>
        
        <div class="frame-guides">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <div class="scan-pulse"></div>
            
            <div class="absolute bottom-16 w-full text-center">
                <div class="glass-panel inline-block px-5 py-2.5 rounded-full border border-white/10 backdrop-blur-md">
                    <p class="text-[9px] font-black text-white uppercase tracking-[0.4em]">Encuadre Detectado</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="ui-overlay p-8 pb-14 flex flex-col items-center gap-10 reveal-node" style="animation-delay: 0.1s">
        <div class="flex justify-around items-center w-full max-w-sm px-6">
            <button class="btn-action flex flex-col items-center gap-2">
                <span class="material-icons-round text-2xl text-white">flash_on</span>
                <span class="text-[8px] font-black uppercase tracking-widest text-zinc-500">Flash</span>
            </button>
            
            <button onclick="captureReceipt()" class="size-24 shutter-btn rounded-full flex items-center justify-center border-8 border-black shadow-[0_0_60px_rgba(255,157,66,0.15)]">
                <div class="size-16 rounded-full border-2 border-white/30 flex items-center justify-center">
                    <span class="material-icons-round text-black text-4xl">qr_code_scanner</span>
                </div>
            </button>
            
            <button class="btn-action flex flex-col items-center gap-2">
                <span class="material-icons-round text-2xl text-white">photo_library</span>
                <span class="text-[8px] font-black uppercase tracking-widest text-zinc-500">Galería</span>
            </button>
        </div>
        
        <div class="flex items-center gap-3">
            <span class="text-[9px] font-black text-zinc-700 uppercase tracking-[0.4em]">Auditado por</span>
            <span class="text-[9px] font-black text-[#13ecd6] tech-font uppercase tracking-[0.4em] italic">Split-Engine v4.4</span>
        </div>
    </footer>

</div>

<script>
    function captureReceipt() {
        // Feedback háptico visual de disparo
        document.querySelector('.viewfinder-master').style.transition = 'none';
        document.querySelector('.viewfinder-master').style.filter = 'brightness(2.5) contrast(1.2)';
        
        setTimeout(() => {
            document.querySelector('.viewfinder-master').style.transition = 'filter 0.4s ease';
            document.querySelector('.viewfinder-master').style.filter = 'none';
            SGRouter.showToast('Analizando Recibo Alpha...', 'info');
            
            // Salto al nodo de recibo tras procesamiento
            setTimeout(() => {
                SGRouter.navigate('receipt');
            }, 1200);
        }, 100);
    }
</script>

</body>
</html>
