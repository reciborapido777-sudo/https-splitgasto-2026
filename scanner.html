<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Scanner Alpha | SplitGasto 2026</title>
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Visor Táctico: Configuración de Cámara */
        body, html { height: 100vh; overflow: hidden !important; display: flex; flex-direction: column; background: #000; }
        
        .viewfinder-master { 
            flex: 1; position: relative; margin: 0 16px; 
            background: #050505; border-radius: 3rem; 
            border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
            transform: translateZ(0);
        }

        /* Guías de Encuadre Alpha */
        .frame-guides { position: absolute; inset: 60px 30px; pointer-events: none; }
        .corner { 
            position: absolute; width: 40px; height: 40px; 
            border: 3px solid var(--cian-tech); 
            filter: drop-shadow(0 0 12px rgba(19,236,214,0.3)); 
        }
        .tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 1.5rem 0 0 0; }
        .tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-radius: 0 1.5rem 0 0; }
        .bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 1.5rem; }
        .br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 1.5rem 0; }

        .scan-pulse { 
            position: absolute; width: 100%; height: 2px; 
            background: linear-gradient(to right, transparent, var(--cian-tech), transparent); 
            box-shadow: 0 0 25px var(--cian-tech); 
            animation: moveScan 3s infinite cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @keyframes moveScan { 0% { top: 10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 90%; opacity: 0; } }

        /* Interfaz de Disparo */
        .ui-overlay { background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 50; }
        .shutter-btn { 
            background: var(--orange-socio); 
            box-shadow: 0 0 40px rgba(255, 157, 66, 0.25);
            transition: var(--transition-alpha);
        }
        .shutter-btn:active { transform: scale(0.85); filter: brightness(1.2); }
    </style>

    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame flex flex-col h-full">

    <header class="ui-overlay p-6 flex justify-between items-center">
        <button onclick="SGRouter.back()" class="size-12 glass-panel rounded-2xl flex items-center justify-center active:scale-90 transition-all">
            <span class="material-icons-round text-white text-2xl">close</span>
        </button>
        <div class="text-right">
            <p class="text-[9px] font-black text-[#13ecd6] uppercase tracking-[0.4em]">AI Vision Alpha</p>
            <p class="text-[8px] font-bold text-zinc-500 uppercase tracking-widest">Digitalización Activa</p>
        </div>
    </header>

    <main class="viewfinder-master reveal-node">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1556742044-3c52d6e88c62?q=80&w=1200')] bg-cover bg-center opacity-40 scale-105"></div>
        
        <div class="frame-guides">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <div class="scan-pulse"></div>
            
            <div class="absolute bottom-12 w-full text-center">
                <p class="text-[9px] font-black text-white uppercase tracking-[0.5em] animate-pulse">Alinee el Ticket</p>
            </div>
        </div>
    </main>

    <footer class="ui-overlay p-8 pb-12 flex flex-col items-center gap-8 reveal-node" style="animation-delay: 0.2s">
        <div class="flex justify-around items-center w-full max-w-xs">
            <button class="flex flex-col items-center gap-2 opacity-40 hover:opacity-100 transition-all">
                <span class="material-icons-round text-2xl text-white">flash_on</span>
                <span class="text-[8px] font-black uppercase tracking-widest">Flash</span>
            </button>
            
            <button onclick="SGRouter.navigate('receipt')" class="size-20 shutter-btn rounded-full flex items-center justify-center border-4 border-black/50">
                <div class="size-16 rounded-full border border-white/20 flex items-center justify-center">
                    <span class="material-icons-round text-black text-3xl">qr_code_scanner</span>
                </div>
            </button>
            
            <button class="flex flex-col items-center gap-2 opacity-40 hover:opacity-100 transition-all">
                <span class="material-icons-round text-2xl text-white">photo_library</span>
                <span class="text-[8px] font-black uppercase tracking-widest">Galería</span>
            </button>
        </div>
        <p class="text-[9px] font-black text-zinc-700 uppercase tracking-[0.4em]">Procesamiento <span class="text-[#13ecd6]">Grado Militar</span></p>
    </footer>

</div>
</body>
</html>
