<!DOCTYPE html>
<html lang="es" style="background-color: #000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones | SplitGasto 2026</title>
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space_Grotesk:wght@500;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden !important; margin: 0; padding: 0;  touch-action: manipulation; }
        .glass-panel { background: rgba(255,255,255,0.02); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); transform: translateZ(0); }
        .reveal-node { animation: revealUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
        @keyframes revealUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .notif-row { transition: all 0.3s; cursor: pointer; }
        .notif-row:hover { background: rgba(255,255,255,0.04); }
        .notif-row.unread { border-left: 3px solid; }
    
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;transition:all .2s}
        .nav-item span.material-icons-round,.nav-item .mat-icon{font-size:20px;color:#4a4a4a;transition:color .2s}
        .nav-item p{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:#4a4a4a;transition:color .2s}
        .nav-item.active span.material-icons-round,.nav-item.active p{color:#13ecd6}
        .nav-item:hover span.material-icons-round,.nav-item:hover p{color:#fff}
</style>
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SplitGasto">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <script src="engine/router.js"></script>
    <script src="engine/desktop-fix.js" defer></script>
    <script src="engine/auth.js"></script>
    <script src="engine/api.js"></script>
    <script src="engine/i18n.js" defer></script>

</head>
<body class="app-shell pb-20">
<div class="app-frame">
    <div class="max-w-3xl mx-auto px-6 py-8 space-y-10">

        <header class="flex justify-between items-center py-4 sticky top-0 bg-black/80 backdrop-blur-xl z-50">
            <div class="flex items-center gap-6">
                <button onclick="SGRouter.back()" class="size-14 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all">
                    <span class="material-icons-round text-zinc-500">arrow_back</span>
                </button>
                <div>
                    <p class="text-[9px] font-black text-zinc-600 uppercase tracking-[0.4em]" data-i18n="notifications.alertSystem">Sistema de Alertas</p>
                    <h1 class="text-2xl font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none" data-i18n="notifications.title">Notificaciones</h1>
                </div>
            </div>
            <button class="px-5 py-2.5 glass-panel rounded-2xl text-[9px] font-black uppercase tracking-widest text-zinc-500 hover:text-white transition-colors" onclick="markAllRead()" data-i18n="notifications.markAllRead">
                Leer todas
            </button>
        </header>

        <section id="notifications-container" class="space-y-10">
            <p class="text-zinc-600 text-[10px] font-black uppercase tracking-widest text-center py-12" data-i18n="notifications.loading">Cargando notificaciones...</p>
        </section>

    </div>

    <script>
    (function() {
        // === AUTH GUARD ===
        if (!SGAuth || !SGAuth.isLoggedIn()) {
            SGRouter.showToast('Inicia sesión primero', 'error');
            setTimeout(function() { SGRouter.navigate('auth-login'); }, 1500);
            return;
        }

        var ICON_MAP = {
            'payment':     { icon: 'payments',         color: '#13ecd6' },
            'expense':     { icon: 'pending_actions',   color: '#FF9D42' },
            'settlement':  { icon: 'payments',          color: '#13ecd6' },
            'scan':        { icon: 'receipt_long',      color: '#a855f7' },
            'member':      { icon: 'group_add',         color: '#13ecd6' },
            'alert':       { icon: 'trending_up',       color: '#FF9D42' },
            'membership':  { icon: 'workspace_premium',  color: '#FF9D42' },
            'group':       { icon: 'group_add',         color: '#13ecd6' },
            'default':     { icon: 'notifications',     color: '#71717a' }
        };

        function getIconMeta(type) {
            return ICON_MAP[type] || ICON_MAP['default'];
        }

        function timeAgo(dateStr) {
            if (!dateStr) return '';
            var diff = Date.now() - new Date(dateStr).getTime();
            var mins = Math.floor(diff / 60000);
            if (mins < 60) return t('notifications.timeAgo.minutes', null, 'hace {n} min').replace('{n}', mins);
            var hours = Math.floor(mins / 60);
            if (hours < 24) return t('notifications.timeAgo.hours', null, 'hace {n} hora').replace('{n}', hours) + (hours > 1 ? 's' : '');
            var days = Math.floor(hours / 24);
            if (days === 1) return t('notifications.timeAgo.yesterday', null, 'ayer');
            if (days < 7) return t('notifications.timeAgo.days', null, 'hace {n} días').replace('{n}', days);
            return new Date(dateStr).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        function renderNotifications(notifications) {
            var container = document.getElementById('notifications-container');
            if (!container) return;

            if (!notifications || notifications.length === 0) {
                container.innerHTML =
                    '<div class="flex flex-col items-center py-20 space-y-4">' +
                        '<span class="material-icons-round text-zinc-700 text-5xl">notifications_off</span>' +
                        '<p class="text-zinc-600 text-[10px] font-black uppercase tracking-widest">' + t('notifications.empty', null, 'Sin notificaciones') + '</p>' +
                    '</div>';
                return;
            }

            // Agrupar por período
            var now = Date.now();
            var groups = {
                [t('notifications.period.today', null, 'Hoy')]: [],
                [t('notifications.period.yesterday', null, 'Ayer')]: [],
                [t('notifications.period.thisWeek', null, 'Esta semana')]: [],
                [t('notifications.period.earlier', null, 'Anterior')]: []
            };
            
            notifications.forEach(function(n) {
                var d = new Date(n.created_at || n.date || Date.now()).getTime();
                var diff = now - d;
                var days = diff / 86400000;
                
                if (days < 1) groups[t('notifications.period.today', null, 'Hoy')].push(n);
                else if (days < 2) groups[t('notifications.period.yesterday', null, 'Ayer')].push(n);
                else if (days < 7) groups[t('notifications.period.thisWeek', null, 'Esta semana')].push(n);
                else groups[t('notifications.period.earlier', null, 'Anterior')].push(n);
            });

            var html = '';
            Object.keys(groups).forEach(function(period) {
                var items = groups[period];
                if (items.length === 0) return;

                html += '<section class="space-y-3 reveal-node">' +
                    '<p class="text-[9px] font-black text-zinc-700 uppercase tracking-[0.4em] px-2">' + period + '</p>';

                items.forEach(function(n) {
                    var meta = getIconMeta(n.type);
                    var isUnread = !n.read && !n.read_at;
                    var unreadClass = isUnread ? 'unread' : '';
                    var opacityStyle = isUnread ? '' : 'opacity:0.7;';
                    var borderStyle = isUnread ? 'border-left-color:' + meta.color : '';
                    var target = n.target_page || n.link || '';

                    html += '<div class="notif-row ' + unreadClass + ' glass-panel p-5 rounded-[2rem] flex items-start gap-5" style="' + opacityStyle + borderStyle + '"' +
                        (target ? ' onclick="SGRouter.navigate(\'' + target + '\')"' : '') + '>' +
                        '<div class="size-11 rounded-2xl flex items-center justify-center border flex-shrink-0 mt-0.5" style="background:' + meta.color + '10;border-color:' + meta.color + '33">' +
                            '<span class="material-icons-round text-lg" style="color:' + meta.color + '">' + meta.icon + '</span>' +
                        '</div>' +
                        '<div class="flex-1 min-w-0">' +
                            '<div class="flex justify-between items-start gap-2">' +
                                '<p class="text-sm font-bold leading-tight">' + (n.title || n.message || '') + '</p>' +
                                (isUnread ? '<span class="size-2 rounded-full flex-shrink-0 mt-1.5 animate-pulse" style="background:' + meta.color + '"></span>' : '') +
                            '</div>' +
                            '<p class="text-[10px] text-zinc-500 font-bold uppercase tracking-tight mt-1">' + (n.body || n.description || '') + '</p>' +
                            '<p class="text-[8px] text-zinc-700 uppercase mt-2">' + timeAgo(n.created_at || n.date) + '</p>' +
                        '</div>' +
                    '</div>';
                });

                html += '</section>';
            });

            container.innerHTML = html;
        }

        // === CARGA ===
        async function loadNotifications() {
            try {
                var result = await SGApi.getNotifications();
                var notifs = [];
                if (result && result.success && result.notifications) {
                    notifs = result.notifications;
                }
                renderNotifications(notifs);
            } catch (e) {
                console.error('[Notifications] Load error:', e);
                renderNotifications([]);
            }
        }

        // === MARK ALL READ ===
        window.markAllRead = async function() {
            document.querySelectorAll('.notif-row.unread').forEach(function(row) {
                row.classList.remove('unread');
                row.style.borderLeft = '';
                row.style.opacity = '0.7';
                row.querySelectorAll('.animate-pulse').forEach(function(dot) { dot.remove(); });
            });
            try {
                await SGApi.markNotificationsRead();
            } catch (e) { /* silencioso */ }
            SGRouter.showToast(t('notifications.allRead', null, 'Todas leídas'), 'success');
        };

        loadNotifications();
    })();
    </script>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item active" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p data-i18n="nav.dashboard">Mando</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p data-i18n="nav.groups">Grupos</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p data-i18n="nav.expenses">Gastos</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p data-i18n="nav.metrics">Métricas</p>
            </button>
            <button class="nav-item " onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p data-i18n="nav.profile">Perfil</p>
            </button>
        </div>
    </nav>


        <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        if (!sw) return;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                sw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch(e => console.warn('[SW] Failed:', e));
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        });
    }
    </script>
</div>
</body>
</html>
