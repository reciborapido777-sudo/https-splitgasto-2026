<script>
// CATEGORÍAS TRADUCIDAS
const DASH_CAT_ICONS = {
  comida:'restaurant', transporte:'directions_car', entretenimiento:'movie',
  alojamiento:'home', compras:'shopping_bag', salud:'medical_services',
  servicios:'build', otro:'receipt'
};
const DASH_CAT_COLORS = {
  comida:'#13ecd6', transporte:'#a855f7', entretenimiento:'#FF9D42',
  alojamiento:'#ec4899', compras:'#3b82f6', salud:'#22c55e',
  servicios:'#f59e0b', otro:'#6b7280'
};

function dashReset(msg, isError = false) {
  const netEl   = document.getElementById('net-worth-value');
  const settEl  = document.getElementById('settlements-value');
  const recEl   = document.getElementById('to-receive-value');
  const nameEl  = document.getElementById('active-group-name');
  const subEl   = document.getElementById('active-group-sub');
  const actEl   = document.getElementById('activity-list');
  
  const display = isError ? '—' : '0,00€';
  const label   = isError ? (msg || 'Error') : (msg || 'Sin grupos');
  
  if (netEl)  netEl.textContent    = display;
  if (settEl) settEl.textContent   = display;
  if (recEl)  recEl.textContent    = display;
  if (nameEl) nameEl.textContent   = label;
  if (subEl)  subEl.textContent    = isError ? 'Reintenta o inicia sesión' : t('dashboard.createFirstGroup', null, 'Crea tu primer grupo');
  if (actEl)  actEl.innerHTML      = `<p class="text-xs ${isError ? 'text-red-400' : 'text-zinc-600'} text-center py-4">${msg || t('activity.empty', null, 'Sin actividad. Crea un grupo y añade gastos.')}</p>`;
}

async function loadDashboardData() {
  if (!SGAuth || !SGAuth.isLoggedIn()) {
    dashReset('Sesión requerida', true);
    return;
  }
  
  try {
    const profile = await SGApi.getProfile().catch(() => null);
    if (profile?.success && profile.profile) {
      const p = profile.profile;
      const headerDiv = document.getElementById('dash-user-name');
      if (headerDiv) headerDiv.textContent = p.name || 'Usuario';
      const avatarEl = document.querySelector('header img[alt="Avatar Comandante"]');
      if (avatarEl && p.name) {
        const seed = encodeURIComponent(p.name.slice(0,2).toUpperCase());
        avatarEl.src = `https://api.dicebear.com/9.x/initials/svg?seed=${seed}&backgroundColor=0d1f0d&fontFamily=Arial&fontSize=40`;
      }
    }

    const groupsResult = await SGApi.getGroups().catch(() => null);
    
    // DEBUG: Ver error de grupos
    if (!groupsResult?.success) {
      console.error('[Dashboard] Error cargando grupos:', groupsResult);
      dashReset(groupsResult?.error || 'Error cargando grupos', true);
      return;
    }
    
    const groups = groupsResult.groups || [];
    if (groups.length === 0) { dashReset(); return; }
    
    const uid = SGAuth.getUserId();
    if (!uid) {
      dashReset('Error de sesión', true);
      return;
    }
    
    const allBalResults = await Promise.all(groups.map(g => SGApi.getBalances(g.id).catch(e => {
      console.error(`[Dashboard] Error balances grupo ${g.id}:`, e);
      return null;
    })));

    let totalOwed = 0;
    let totalReceive = 0;
    let maxDebt = 0;
    let targetGid = groups[0].id;
    let targetUid = null;
    
    groups.forEach((g, i) => {
      const br = allBalResults[i];
      if (!br?.success) {
        console.warn(`[Dashboard] Sin datos de balances para grupo ${g.name}:`, br);
        return;
      }
      
      let balances = br.balances;
      if (Array.isArray(balances)) {
        const obj = {};
        balances.forEach(b => {
          const key = b.user_id || b.userId || b.id || 'unknown';
          obj[key] = parseFloat(b.balance || b.amount || 0);
        });
        balances = obj;
      }
      
      const myBal = parseFloat(balances[uid]);
      const effectiveBal = isNaN(myBal) ? 0 : myBal;
      
      console.log(`[Dashboard] Grupo "${g.name}": mi balance = ${effectiveBal}, keys = ${Object.keys(balances).join(',')}`);

      if (effectiveBal < -0.01) {
        totalOwed += Math.abs(effectiveBal);
        if (Math.abs(effectiveBal) > maxDebt) {
          maxDebt = Math.abs(effectiveBal);
          targetGid = g.id;
          let maxCreditorBal = 0;
          Object.entries(balances).forEach(([mid, val]) => {
            if (mid !== uid && val > maxCreditorBal) {
              maxCreditorBal = val;
              targetUid = mid;
            }
          });
        }
      } else if (effectiveBal > 0.01) {
        totalReceive += effectiveBal;
      }
    });

    document.getElementById('net-worth-value').textContent = (totalReceive - totalOwed).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';
    document.getElementById('settlements-value').textContent = totalOwed.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';
    document.getElementById('to-receive-value').textContent = totalReceive.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';

    // BOTÓN LIQUIDAR INTELIGENTE
    const liqBtn = document.getElementById('dash-liquidation-trigger');
    if (liqBtn) {
        if (maxDebt > 0.01 && targetUid) {
            liqBtn.onclick = () => window.location.href = `liquidation.html?groupId=${targetGid}&to=${targetUid}&amount=${maxDebt.toFixed(2)}`;
        } else {
            liqBtn.onclick = () => SGRouter.showToast(t('debts.none', null, 'No tienes deudas pendientes'), 'success');
        }
    }

    // GRUPO ACTIVO
    const activeGroup = groups[0];
    document.getElementById('active-group-name').textContent = activeGroup.name;

    const card = document.getElementById('active-group-card');
    if (card) {
      card.onclick = () => { window.location.href = 'split.html?groupId=' + activeGroup.id + '&from=dashboard'; };
    }
    const gastoBtn = document.querySelector('[onclick*="add-expense"]');
    if (gastoBtn) {
      gastoBtn.onclick = () => { window.location.href = 'add-expense.html?groupId=' + activeGroup.id + '&from=dashboard'; };
    }

    const balRes0 = allBalResults[0];
    let balances0 = (balRes0?.success && balRes0.balances) ? balRes0.balances : {};
    if (Array.isArray(balances0)) {
        const obj = {};
        balances0.forEach(function(b) {
            const key = b.user_id || b.userId || b.id || 'unknown';
            obj[key] = parseFloat(b.balance || b.amount || 0);
        });
        balances0 = obj;
    }
    
    // mc0 se actualizará con datos reales de miembros más abajo
    let mc0 = Object.keys(balances0).length || (activeGroup.member_count || 1);

    const avatarRow = document.getElementById('active-group-avatars');
    if (avatarRow) {
      const memRes0 = await SGApi.getGroupMembers(activeGroup.id).catch(() => null);
      if (memRes0?.success && memRes0.members && memRes0.members.length > 0) {
        mc0 = memRes0.members.length; // Count real de miembros activos
        const shown = memRes0.members.slice(0, 3);
        const extra = memRes0.members.length - 3;
        avatarRow.innerHTML = shown.map(m => {
          const seed = encodeURIComponent((m.name || 'U').slice(0,2).toUpperCase());
          return `<img src="https://api.dicebear.com/9.x/initials/svg?seed=${seed}&backgroundColor=1a1a2e&fontSize=40" class="size-7 rounded-full border border-black/50" alt="${m.name || ''}">`;
        }).join('') + (extra > 0
          ? `<div class="size-7 rounded-full bg-white/10 border border-black/50 flex items-center justify-center"><span class="text-[8px] font-black text-white">+${extra}</span></div>`
          : '');
      } else {
        const seed = encodeURIComponent(activeGroup.name.slice(0,2).toUpperCase());
        avatarRow.innerHTML = `<img src="https://api.dicebear.com/9.x/initials/svg?seed=${seed}&backgroundColor=1a1a2e&fontSize=40" class="size-7 rounded-full border border-black/50" alt="">`;
      }
    }

    // ACTIVIDAD RECIENTE
    const expPromises = groups.map(g => SGApi.getExpenses(g.id).catch(() => null));
    const allExpResults = await Promise.all(expPromises);
    let allExpenses = [];
    groups.forEach((g, i) => {
      const expRes = allExpResults[i];
      if (expRes?.success && expRes.expenses) {
        expRes.expenses.forEach(exp => allExpenses.push({ ...exp, _groupName: g.name }));
      }
    });

    allExpenses.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    const recent = allExpenses.slice(0, 3);
    const actEl = document.getElementById('activity-list');

    if (actEl) {
      if (recent.length === 0) {
        actEl.innerHTML = `<p class="text-xs text-zinc-600 text-center py-4">${t('activity.noExpenses', null, 'Sin gastos todavía. ¡Añade el primero!')}</p>`;
      } else {
        actEl.innerHTML = recent.map(exp => {
            const icon = DASH_CAT_ICONS[exp.category] || 'receipt';
            const color = DASH_CAT_COLORS[exp.category] || '#6b7280';
            return `<div class="glass-panel flex items-center gap-4 p-4 rounded-2xl cursor-pointer" onclick="SGRouter.navigate('activity','dashboard')">
                <div class="size-10 rounded-xl flex items-center justify-center" style="background:${color}15"><span class="material-icons-round text-base" style="color:${color}">${icon}</span></div>
                <div class="flex-1"><p class="text-[11px] font-bold">${exp.description || exp.category}</p><p class="text-[9px] text-zinc-500">${exp._groupName}</p></div>
                <p class="text-sm font-black" style="color:${color}">${parseFloat(exp.amount).toFixed(2)}€</p>
            </div>`;
        }).join('');
      }
    }
    
    // Recalcular totalExp con gastos reales del grupo activo y pintar subtexto
    const totalExp = allExpenses
      .filter(e => e._groupName === activeGroup.name)
      .reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
      
    const memberLabel = mc0 === 1 
      ? t('group.member', null, 'Socio') 
      : t('group.members', null, 'Socios');
    document.getElementById('active-group-sub').innerHTML =
      `${mc0} ${memberLabel} · <span class="text-white font-black money-display">${totalExp.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}€</span> ${t('group.inPlay', null, 'en juego')}`;
      
  } catch (e) {
    console.error('Dashboard load error:', e);
    dashReset(t('error.system', null, 'Error al cargar'));
  }
}
loadDashboardData();
window.addEventListener('pageshow', (e) => { if (e.persisted) loadDashboardData(); });

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .then(reg => {
                reg.update().catch(() => {});
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    if (!sw) return;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                            sw.postMessage({ type: 'SKIP_WAITING' });
                        }
                    });
                });
            })
            .catch(e => console.warn('[SW] Failed:', e));
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) { refreshing = true; window.location.reload(); }
        });
    });
}
</script>
</body>
</html>
