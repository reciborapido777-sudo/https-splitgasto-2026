<!DOCTYPE html>
<html lang="es" class="app-shell">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Centro de Mando | SplitGasto 2026</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13ecd6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <link rel="stylesheet" href="engine/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* Estilos específicos del Dashboard que no están en global.css */
        .experience-card { position: relative; height: 280px; border-radius: 3rem; overflow: hidden; transform: translateZ(0); }
        .premium-badge { background: linear-gradient(135deg,#D4AF37,#F9E076); color: #000; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 999px; letter-spacing: .15em; text-transform: uppercase; }
        
        /* Nav items (Mantenidos para control granular) */
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; cursor: pointer; transition: all .2s; }
        .nav-item span { font-size: 20px; color: #4a4a4a; transition: color .2s; }
        .nav-item p { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .15em; color: #4a4a4a; }
        .nav-item.active span, .nav-item.active p { color: var(--cian-tech); }
    </style>

    <script src="engine/router.js"></script>
</head>
<body class="app-shell">
<div class="app-frame">

    <div class="max-w-lg mx-auto px-4 py-6 space-y-6">

        <header class="flex justify-between items-center py-2 sticky top-0 bg-black/80 backdrop-blur-xl z-50 -mx-4 px-4">
            <button onclick="SGRouter.navigate('landing')" class="size-12 rounded-2xl glass-panel flex items-center justify-center hover:bg-white/5 active:scale-90 transition-all">
                <span class="material-icons-round text-zinc-500 text-xl">logout</span>
            </button>

            <div class="flex items-center gap-3 cursor-pointer group flex-1 mx-3" onclick="SGRouter.navigate('profile','dashboard')">
                <div class="relative">
                    <img src="https://api.dicebear.com/9.x/initials/svg?seed=SG&backgroundColor=0d1f0d" class="size-11 rounded-xl border border-white/10 group-hover:border-[#D4AF37]/60 transition-all" alt="Avatar">
                    <div class="absolute -top-1 -right-1 size-4 bg-gradient-to-br from-[#D4AF37] to-[#F9E076] rounded-full flex items-center justify-center">
                        <span class="material-icons-round text-[8px] text-black">workspace_premium</span>
                    </div>
                </div>
                <div>
                    <p class="text-[8px] font-black text-[#D4AF37] uppercase tracking-[.35em]">Socio Fundador</p>
                    <h1 class="text-sm font-black font-['Space_Grotesk'] tracking-tighter uppercase italic leading-none">Comandante</h1>
                </div>
            </div>

            <button onclick="SGRouter.navigate('notifications','dashboard')" class="size-12 glass-panel rounded-2xl flex items-center justify-center relative hover:bg-white/5 transition-all active:scale-90">
                <span class="material-icons-round text-zinc-400 text-xl">notifications</span>
                <span class="absolute top-3 right-3 size-2 bg-[#FF9D42] rounded-full shadow-[0_0_8px_rgba(255,157,66,.6)]"></span>
            </button>
        </header>

        <section class="glass-panel p-8 rounded-[2.5rem] relative overflow-hidden reveal-node">
            <div class="absolute -right-16 -top-16 size-48 bg-[#13ecd6]/8 rounded-full blur-[60px] pointer-events-none"></div>
            <div class="space-y-6 relative z-10">
                <div>
                    <p class="text-[8px] font-black text-zinc-500 uppercase tracking-[.5em] mb-1">Patrimonio Neto Auditado</p>
                    <h2 class="text-5xl sm:text-6xl font-black font-['Space_Grotesk'] tracking-tighter italic text-gradient-cyan money-display">
                        1.450,26€
                    </h2>
                </div>

                <div class="grid grid-cols-2 gap-6 border-t border-white/5 pt-6">
                    <div>
                        <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest mb-1">Liquidaciones</p>
                        <p class="text-lg font-bold font-['Space_Grotesk'] text-[#FF9D42] money-display">-84,50€</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[8px] font-black text-zinc-600 uppercase tracking-widest mb-1">A Recibir</p>
                        <p class="text-lg font-bold font-['Space_Grotesk'] text-[#13ecd6] money-display">+210,00€</p>
                    </div>
                </div>

                <div class="flex gap-3 border-t border-white/5 pt-4">
                    <button onclick="SGRouter.navigate('liquidation','dashboard')" class="flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl bg-[#FF9D42]/10 border border-[#FF9D42]/20 text-[#FF9D42] text-[10px] font-black uppercase tracking-wider active:scale-95 transition-all">
                        <span class="material-icons-round text-sm">swap_horiz</span> Liquidar
                    </button>
                    <button onclick="SGRouter.navigate('split','dashboard')" class="flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl bg-[#13ecd6]/10 border border-[#13ecd6]/20 text-[#13ecd6] text-[10px] font-black uppercase tracking-wider active:scale-95 transition-all">
                        <span class="material-icons-round text-sm">call_split</span> Repartir
                    </button>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-3 gap-3 reveal-node" style="animation-delay:.1s">
            <button onclick="SGRouter.navigate('scanner','dashboard')" class="glass-panel p-5 rounded-[1.75rem] flex flex-col items-center gap-3 hover:bg-white/5 group active:scale-95 transition-all">
                <span class="material-icons-round text-[#13ecd6] text-3xl group-hover:scale-110 transition-transform">qr_code_scanner</span>
                <span class="text-[8px] font-black uppercase tracking-wider text-zinc-500">Scanner</span>
            </button>
            <button onclick="SGRouter.navigate('groups','dashboard')" class="glass-panel p-5 rounded-[1.75rem] flex flex-col items-center gap-3 hover:bg-white/5 group active:scale-95 transition-all">
                <span class="material-icons-round text-[#a855f7] text-3xl group-hover:scale-110 transition-transform">groups_3</span>
                <span class="text-[8px] font-black uppercase tracking-wider text-zinc-500">Grupos</span>
            </button>
            <button onclick="SGRouter.navigate('vault','dashboard')" class="glass-panel p-5 rounded-[1.75rem] flex flex-col items-center gap-3 hover:bg-white/5 group active:scale-95 transition-all">
                <span class="material-icons-round text-[#FF9D42] text-3xl group-hover:scale-110 transition-transform">auto_stories</span>
                <span class="text-[8px] font-black uppercase tracking-wider text-zinc-500">Bóveda</span>
            </button>
            <button onclick="SGRouter.navigate('analytics','dashboard')" class="glass-panel p-5 rounded-[1.75rem] flex flex-col items-center gap-3 hover:bg-white/5 group active:scale-95 transition-all">
                <span class="material-icons-round text-zinc-100 text-3xl group-hover:scale-110 transition-transform">query_stats</span>
                <span class="text-[8px] font-black uppercase tracking-wider text-zinc-500">Métricas</span>
            </button>
            <button onclick="SGRouter.requirePremium('Juegos')" class="glass-panel p-5 rounded-[1.75rem] flex flex-col items-center gap-3 hover:bg-white/5 group active:scale-95 transition-all relative" style="border-color:rgba(212,175,55,.2)">
                <span class="material-icons-round text-3xl group-hover:scale-110 transition-transform" style="color:#D4AF37">casino</span>
                <span class="text-[8px] font-black uppercase tracking-wider text-zinc-500">Juegos</span>
                <span class="absolute top-2 right-2 premium-badge">PRO</span>
            </button>
            <button onclick="SGRouter.navigate('add-expense','dashboard')" class="glass-panel p-5 rounded-[1.75rem] flex flex-col items-center gap-3 hover:bg-white/5 group active:scale-95 transition-all" style="border-color:rgba(19,236,214,.15)">
                <span class="material-icons-round text-[#13ecd6] text-3xl group-hover:scale-110 transition-transform">add_circle</span>
                <span class="text-[8px] font-black uppercase tracking-wider text-zinc-500">Gasto</span>
            </button>
        </section>

        <section class="experience-card group cursor-pointer reveal-node active:scale-[.98] transition-all" style="animation-delay:.2s" onclick="SGRouter.navigate('split','dashboard')">
            <img src="https://images.unsplash.com/photo-1579027989536-b7b1f875659b?q=80&w=1000" class="absolute inset-0 w-full h-full object-cover opacity-40 group-hover:scale-105 transition-all duration-700" alt="Sushi">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent flex flex-col justify-end p-8 space-y-3">
                <div class="flex items-center gap-2">
                    <span class="size-2 bg-[#13ecd6] rounded-full animate-pulse"></span>
                    <p class="text-[9px] font-black text-[#13ecd6] uppercase tracking-[.5em]">Grupo Activo</p>
                </div>
                <h3 class="text-3xl font-black font-['Space_Grotesk'] uppercase italic leading-none tracking-tighter">Sushi Kyoto Pro</h3>
                <p class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider">12 Socios · <span class="text-white font-black money-display">256,00€</span> en juego</p>
            </div>
        </section>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-lg mx-auto flex justify-around items-center py-3 pb-5">
            <button class="nav-item active" onclick="SGRouter.navigate('dashboard')">
                <span class="material-icons-round">grid_view</span>
                <p>Mando</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('groups')">
                <span class="material-icons-round">groups_3</span>
                <p>Grupos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('activity')">
                <span class="material-icons-round">receipt_long</span>
                <p>Gastos</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('analytics')">
                <span class="material-icons-round">query_stats</span>
                <p>Métricas</p>
            </button>
            <button class="nav-item" onclick="SGRouter.navigate('profile')">
                <span class="material-icons-round">person</span>
                <p>Perfil</p>
            </button>
        </div>
    </nav>

</div>
</body>
</html>
